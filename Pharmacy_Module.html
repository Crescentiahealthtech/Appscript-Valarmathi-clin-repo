<div id="workspace-pharmacy" class="page-section d-none">
  
  <div id="pharmacy-landing-menu">
    <div class="d-flex justify-content-between align-items-center mb-3 mt-4 me-md-5">
      <h3 class="fw-bold m-0 text-white">Pharmacy Command Center</h3>
    </div>
    
    <div class="row g-4">
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-inventory">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" onclick="switchTab('tab-admin-pharmacy')">
          <i class="fa-solid fa-prescription-bottle-medical fa-2x mb-3 text-success"></i>
          <h6 class="text-white fw-bold m-0">Inventory Ledger</h6>
        </div>
      </div>
      
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-billing">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" onclick="switchTab('pharmacy-billing-workspace');">
          <i class="fa-solid fa-receipt fa-2x mb-3 text-info"></i>
          <h6 class="text-white fw-bold m-0">Pharmacy Billing</h6>
        </div>
      </div>

      <!-- Low stock and near-expiry
           (Stock_Alerts.gs), in the shell's Operations panel. -->
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-alerts">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" role="button" tabindex="0"
             onclick="crescOpsOpen('stock')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();crescOpsOpen('stock');}">
          <i class="fa-solid fa-triangle-exclamation fa-2x mb-3 text-danger"></i>
          <h6 class="text-white fw-bold m-0">Stock Alerts</h6>
        </div>
      </div>

      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-stock-add">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" onclick="switchTab('pharmacy-inventory-view');">
          <i class="fa-solid fa-boxes-packing fa-2x mb-3 text-warning"></i>
          <h6 class="text-white fw-bold m-0">Add New Stock</h6>
        </div>
      </div>

      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-desk">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" onclick="switchTab('pharmacy-desk-workspace')">
          <i class="fa-solid fa-hand-holding-dollar fa-2x mb-3 text-danger"></i>
         <h6 class="text-white fw-bold m-0">Pharmacy Desk</h6>
       </div>
      </div>
      
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-dash">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" onclick="switchTab('pharmacy-dashboard-workspace')">
          <i class="fa-solid fa-chart-line fa-2x mb-3 text-primary"></i>
         <h6 class="text-white fw-bold m-0">Dashboard & Search</h6>
        </div>
      </div>

      <!-- The billing ledger: every pharmacy bill in a date range, settled
           and unsettled, with reprint and collection — the same ledger the
           hospital billing desk has. -->
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-ledger">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" role="button" tabindex="0"
             onclick="switchTab('pharmacy-ledger-workspace')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('pharmacy-ledger-workspace');}">
          <i class="fa-solid fa-book fa-2x mb-3 text-info"></i>
          <h6 class="text-white fw-bold m-0">Billing Ledger</h6>
        </div>
      </div>

      <!-- Schedule H / H1 / X issue register, by date range, with a blank
           column for the pharmacist's signature. -->
      <div class="col-6 col-md-4 col-xl-3" id="ph-tile-register">
        <div class="card p-4 text-center soft-glow h-100 style-workspace-btn" role="button" tabindex="0"
             onclick="switchTab('pharmacy-schedule-register')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('pharmacy-schedule-register');}">
          <i class="fa-solid fa-file-signature fa-2x mb-3" style="color: var(--danger-fg);"></i>
          <h6 class="text-white fw-bold m-0">Schedule H Register</h6>
        </div>
      </div>
    </div>
  </div>
</div>
