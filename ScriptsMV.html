<script>
  const appLogo = "https://lh3.googleusercontent.com/d/1tANMw3wEVcQa6hMxmTDMiKAKhj93Zi_j";
 
 window.onload = function() {
   const loginLogo = document.getElementById('login-logo');
   const navLogo = document.getElementById('nav-logo');
   
   if(loginLogo) loginLogo.src = appLogo;
   if(navLogo) navLogo.src = appLogo;
 };

  /**
   * The date line on the patient's home screen.
   *
   * This was a one-second interval that wrote a wall clock AND a shouted,
   * uppercased date into the DOM every tick, for the whole life of the
   * session, on every screen. The clock is gone from the markup — a patient
   * reading their record has one on the device already, and it was set at
   * heading size beside their own name — so what is left changes once a day.
   * A minute is therefore plenty, and it costs nothing when the element is
   * not on the current screen.
   */
  function updateClock() {
    const el = document.getElementById('live-date');
    if (!el) return;
    el.innerText = new Date().toLocaleDateString('en-GB',
      { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  setInterval(updateClock, 60000); updateClock();

/* ====================================================================
   APPLY RBAC — DRAWING ONLY

   Read this before changing anything below: NOTHING HERE PROTECTS
   ANYTHING. It adds `d-none` to a list of element ids in the browser.
   Deleting that class in devtools brings every hidden control back, and
   the server answers the call either way. It exists so a user is not
   offered a control that will be refused — an affordance, not a gate.

   The gate is crescRequire_() in RBAC.gs, on the server, in front of the
   work. When you add a screen, add the permission check there first;
   this list is the cosmetic follow-up, not the other way round.

   WHAT CHANGED

   This used to be a switch on the role name with its own hand-written
   allow-list per role — a SECOND permission matrix, in a different
   language, in a different file, which nothing kept in step with the
   first. The two had already drifted: 'accounts' appeared here and
   'accountant' did not, so an accountant whose Users row happened to say
   "Accountant" fell through to `default` and was shown a rail with one
   item on it.

   Now there is one matrix. The server's answer to crescGetMyPermissions()
   decides, and each id below names the permission that earns it. A role
   spelling the matrix knows how to resolve — and CRESC_ROLE_ALIAS knows
   several — lands in the right place without an entry here.
   ==================================================================== */

/**
 * Element id -> the permission that reveals it. An array means ANY of them.
 *
 * The Command Center (nav-tab-dash) is dashboard.read: administrators and
 * doctors, and anyone given it individually from Staff Accounts → Access.
 * Everyone else lands on their own desk — see crescLandingTab() below.
 */
var CRESC_UI_PERMS = {
  'nav-tab-dash':       'dashboard.read',
  'nav-tab-appt':       'appointment.read',
  'nav-tab-patients':   'patient.read',
  'nav-tab-emr':        'emr.read',
  'nav-tab-pharmacy':   'pharmacy.read',
  'nav-tab-lab':        'lab.read',
  'nav-tab-accounts':   'accounts.read',
  'nav-tab-privacy':    'dpdp.manage',
  'card-hosp-billing':  'billing.write',
  // The pharmacy hub's tiles (Pharmacy_Module.html), each on the key the
  // screen behind it needs. A tile for work the server will refuse is a
  // button that exists only to produce an error.
  'ph-tile-inventory':  'pharmacy.read',
  'ph-tile-billing':    ['pharmacy.dispense', 'pharmacy.bill'],
  'ph-tile-alerts':     'pharmacy.read',
  'ph-tile-stock-add':  'pharmacy.stock_add',
  'ph-tile-desk':       'pharmacy.return',
  'ph-tile-dash':       ['pharmacy.bill', 'pharmacy.read'],
  'ph-tile-ledger':     ['pharmacy.bill', 'accounts.read'],
  'ph-tile-register':   'pharmacy.register',
  // The lab hub's billing tiles (Admin_Lab_Workspace.html, a lazy bundle —
  // Module_Loader_UI repaints when it arrives).
  'lab-tile-billing':   ['lab.bill', 'accounts.read'],
  'lab-tile-ledger':    ['lab.bill', 'accounts.read'],
  // THE THREE STAGES OF ONE INPATIENT STAY, each hidden from a role that
  // cannot work it. The server has always enforced these — billing.read to
  // see a running tab, billing.write to post to it, accounts.settle to close
  // it — but the tiles were visible to everybody, so the only way to learn
  // that a receptionist may not settle a discharge was to press the tile and
  // read a FORBIDDEN. Hidden here AND checked there; this is the label, not
  // the lock.
  'card-ip-tab':        'billing.read',
  'card-ip-settle':     'accounts.settle',
  'card-ip-invoice':    'billing.write',
  // The money panels are gated here AND on the server: the dashboard
  // payload carries no revenue figures for a clinical role, and these ids
  // keep the empty cards off their screen.
  'dash-card-revenue':  'accounts.read',
  'dash-card-credit':   'accounts.read',
  'an-card-bill':       'accounts.read',
  'an-money-row':       'accounts.read',
  'an-card-paymix':     'accounts.read'
};

/** What the server says this session may do. Null until it answers. */
window.crescPerms = null;

/** True when the signed-in user holds `perm`. Safe before the reply lands. */
window.crescCan = function (perm) {
  return !!(window.crescPerms && window.crescPerms[perm]);
};

/** True when `need` (a key, a list of keys, or null) is satisfied. */
function crescHolds(need, perms) {
  perms = perms || window.crescPerms || {};
  if (need === null || need === undefined) return true;
  if (Array.isArray(need)) return need.some(function (p) { return !!perms[p]; });
  return !!perms[need];
}

function crescPaintRBAC() {
  var perms = window.crescPerms || {};
  Object.keys(CRESC_UI_PERMS).forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('d-none', !crescHolds(CRESC_UI_PERMS[id], perms));
  });
  // Buttons inside screens can carry their own gate: data-perm="a,b" shows
  // the element to anyone holding any one of the keys.
  Array.prototype.forEach.call(document.querySelectorAll('[data-perm]'), function (el) {
    var keys = String(el.getAttribute('data-perm') || '').split(',')
      .map(function (k) { return k.trim(); }).filter(Boolean);
    el.classList.toggle('d-none', keys.length > 0 && !crescHolds(keys, perms));
  });
  if (window.crescPerms) crescEnsureLanding();
}
window.crescPaintRBAC = crescPaintRBAC;

/**
 * WHERE A SIGNED-IN PERSON STARTS.
 *
 * Their role's usual desk, if they hold the key for it; otherwise the first
 * rail item they can open. Before this, sign-in routed on the role NAME alone
 * — so a receptionist landed on the Command Center whether or not they could
 * read it, and a Users row spelled "Pharmacist" (rather than "pharmacy")
 * fell through to the dashboard too.
 */
var CRESC_LANDING = {
  admin:        ['nav-tab-dash'],
  doctor:       ['nav-tab-emr', 'nav-tab-dash'],
  nurse:        ['nav-tab-emr', 'nav-tab-appt'],
  receptionist: ['nav-tab-appt', 'nav-tab-patients'],
  reception:    ['nav-tab-appt', 'nav-tab-patients'],
  pharmacist:   ['nav-tab-pharmacy'],
  pharmacy:     ['nav-tab-pharmacy'],
  lab:          ['nav-tab-lab'],
  accountant:   ['nav-tab-accounts'],
  accounts:     ['nav-tab-accounts']
};
var CRESC_NAV_TARGET = {
  'nav-tab-dash': 'tab-admin-dash', 'nav-tab-appt': 'workspace-appointments',
  'nav-tab-patients': 'workspace-patients', 'nav-tab-emr': 'tab-admin-emr',
  'nav-tab-pharmacy': 'workspace-pharmacy', 'nav-tab-lab': 'workspace-lab',
  'nav-tab-accounts': 'workspace-accounts', 'nav-tab-privacy': 'tab-admin-dpdp'
};
var CRESC_NAV_ORDER = ['nav-tab-dash', 'nav-tab-appt', 'nav-tab-patients', 'nav-tab-emr',
                       'nav-tab-pharmacy', 'nav-tab-lab', 'nav-tab-accounts', 'nav-tab-privacy'];

/** The rail item a role should start on, given what it may open. */
function crescLandingTab(role, perms) {
  var want = (CRESC_LANDING[String(role || '').toLowerCase()] || []).concat(CRESC_NAV_ORDER);
  for (var i = 0; i < want.length; i++) {
    if (crescHolds(CRESC_UI_PERMS[want[i]], perms)) return want[i];
  }
  return null;
}
window.crescLandingTab = crescLandingTab;

/**
 * If the screen showing is one this person may not open — the Command Center
 * after their access to it was withdrawn, say — move them to one they can.
 * Only the rail's own landing screens are judged; a deep screen inside a
 * module is guarded by its server calls.
 */
function crescEnsureLanding() {
  if (!window.crescPerms || String(window.loggedInRole || '') === 'patient') return;
  if (window.crescNavPending > 0) return;   // a screen is still on its way
  var active = document.querySelector('.page-section.active-section');
  var onId = active ? active.id : '';
  var navId = null;
  Object.keys(CRESC_NAV_TARGET).forEach(function (k) { if (CRESC_NAV_TARGET[k] === onId) navId = k; });
  if (onId && (!navId || crescHolds(CRESC_UI_PERMS[navId]))) return;
  var go = crescLandingTab(window.loggedInRole, window.crescPerms);
  if (!go) {
    crescRbacProblem('Your account has no screens switched on. Ask an administrator ' +
                     'to check your access in Staff Accounts.', false);
    return;
  }
  switchTab(CRESC_NAV_TARGET[go], document.getElementById(go));
}

/**
 * Access changed by an administrator reaches an open screen within minutes,
 * not at the next sign-in: the rail is re-drawn from the server's answer
 * every five minutes and whenever the window regains focus.
 */
(function () {
  var last = 0;
  function recheck() {
    if (!window.sessionToken || !window.crescPerms || typeof google === 'undefined' || !google.script) return;
    if (String(window.loggedInRole || '') === 'patient') return;
    if (Date.now() - last < 60000) return;
    last = Date.now();
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) { window.crescPerms = res.permissions || {}; crescPaintRBAC(); }
      })
      .withFailureHandler(function () { /* the next check tries again */ })
      .crescGetMyPermissions(window.sessionToken);
  }
  setInterval(recheck, 5 * 60000);
  window.addEventListener('focus', recheck);
})();

/**
 * @param {string} role  kept for the existing call site in Auth.html; the
 *        server is the authority, and this is only the fallback for the
 *        moment before it answers.
 */
/**
 * A rail item that is missing looks exactly like a rail item you are not
 * allowed to have, and the two have completely different remedies.
 *
 * THIS IS WHY AN ADMIN COULD NOT REACH ACCOUNTS. Every id in
 * CRESC_UI_PERMS is hidden before the permission fetch and revealed by its
 * answer. If that ONE call did not come back — a dropped round trip, a cold
 * start, a reply lost on the way home (google.script.run hands the success
 * handler `null` in that case) — crescPerms was set to {} and every
 * permissioned entry stayed hidden. The user is signed in, the rail shows
 * Dashboard and nothing else, and nothing anywhere says why.
 *
 * So a failed fetch is now retried once, and a second failure says so on
 * screen with a button that tries again, instead of presenting a stripped
 * rail as though it were this account's permissions.
 */
function crescRbacProblem(message, canRetry) {
  var id = 'cresc-rbac-warning';
  var old = document.getElementById(id);
  if (old) old.parentNode.removeChild(old);
  if (!message) return;

  var bar = document.createElement('div');
  bar.id = id;
  bar.className = 'alert alert-warning d-flex align-items-center gap-2 mb-0 rounded-0';
  bar.style.cssText = 'position:sticky;top:0;z-index:1500;font-size:.85rem;';
  bar.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span></span>';
  bar.querySelector('span').textContent = message;
  if (canRetry) {
    var btn = document.createElement('button');
    btn.className = 'btn btn-sm btn-outline-dark ms-auto';
    btn.textContent = 'Try again';
    btn.onclick = function () { applyRBAC(window.loggedInRole); };
    bar.appendChild(btn);
  }
  var host = document.querySelector('.main-content') || document.body;
  host.insertBefore(bar, host.firstChild);
}

/**
 * @param {string} role  kept for the existing call site in Auth.html; the
 *        server is the authority, and this is only the fallback for the
 *        moment before it answers.
 * @param {number} [attempt]  internal: retry counter.
 */
function applyRBAC(role, attempt) {
  attempt = attempt || 0;

  // Hide everything first, so a slow reply never flashes an accountant's
  // revenue card at a pharmacist.
  Object.keys(CRESC_UI_PERMS).forEach(function (id) {
    var el = document.getElementById(id);
    if (el && CRESC_UI_PERMS[id] !== null) el.classList.add('d-none');
  });

  if (!window.sessionToken || typeof google === 'undefined' || !google.script) {
    crescPaintRBAC();
    return;
  }

  function failed(reason, sessionGone) {
    // One silent retry. A single dropped round trip is the common case and
    // does not deserve a banner.
    if (!sessionGone && attempt < 1) {
      setTimeout(function () { applyRBAC(role, attempt + 1); }, 900);
      return;
    }
    window.crescPerms = {};
    crescPaintRBAC();
    if (sessionGone) {
      crescRbacProblem(reason + ' Sign in again to restore your access.', false);
      if (window.showToast) window.showToast('Signed out', reason, 'warning');
    } else {
      crescRbacProblem('Your permissions could not be confirmed, so most of the ' +
                       'menu is hidden. This is a connection problem, not a ' +
                       'restriction on your account.', true);
    }
  }

  google.script.run
    .withSuccessHandler(function (res) {
      // A null reply is a failed round trip, not an answer of "no permissions".
      if (!res) { failed('', false); return; }
      if (res.success) {
        window.crescPerms = res.permissions || {};
        crescRbacProblem('');       // clear any banner from an earlier attempt
        crescPaintRBAC();
        return;
      }
      failed(res.message || 'Your session is no longer valid.', true);
    })
    .withFailureHandler(function () { failed('', false); })
    .crescGetMyPermissions(window.sessionToken);
}
 
 
function switchTab(tabId, clickedElement) {
    // The rail rests collapsed on every screen. Navigating is the end of a
    // glance at the labels, so it closes here too — including the routes that
    // never went through a rail click (handoffs, cockpit cards, deep links).
    if (typeof window.crescCollapseSidebar === 'function') {
        window.crescCollapseSidebar();
    }
    if (typeof window.crescNavMoved === 'function') window.crescNavMoved();

    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    
    const targetEl = document.getElementById(tabId);
    if(targetEl) targetEl.classList.add('active-section');
    
    if(clickedElement) clickedElement.classList.add('active');
    
    crescRunTabInit(tabId);

    // 🛡️ THE SAFETY CATCH (Restored original)
    if (tabId !== 'tab-admin-emr') {
        
        // 👇 ADDED FIX: Manually hide the detached modules when leaving the EMR tab
        ['emr-workspace-records', 'emr-workspace-op-consult'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('d-none');
        });
        
        // If leaving the EMR tab entirely, force the OP workspace to close & clear memory
        if (typeof closeOPConsultationWorkspace === 'function') closeOPConsultationWorkspace();
        
    } else if (tabId === 'tab-admin-emr' && !window.isLedgerHandoff) {
        // If clicking the EMR tab directly, show the landing menu
        if (typeof returnToEMRMenu === 'function') returnToEMRMenu();
    }
    
    window.isLedgerHandoff = false;
}

/* ====================================================================
   ONE ROUTER, ONE INIT TABLE

   Every screen that has to fetch something when you arrive on it used to
   do so from its own `if (tabId === …)` block here, and the screens that
   had no block relied on their tile's onclick calling the init by hand:
   `onclick="switchTab('tab-admin-appt'); initAdminLedger();"`. Two ways
   of doing one thing, and the second one broke the moment modules began
   loading on demand — the init ran before the module carrying it had
   arrived.

   So the table below is now the only place a screen's entry point is
   named, every tile is a plain switchTab(), and the init runs after the
   module is in. Values are function NAMES resolved at call time,
   because the module that owns one may not be downloaded yet.
   ==================================================================== */
var CRESC_TAB_INIT = {
  // The patient portal. Every screen loads its own data when it is opened
  // rather than all of it at sign-in: the portal is the screen most likely
  // to be on a phone on mobile data. 'tab-pat-home' used to point at
  // renderCharts, which drew two charts of hardcoded numbers.
  'tab-pat-home':                 'ppLoadHome',
  'tab-pat-records':              'ppLoadRecords',
  'tab-pat-meds':                 'ppLoadReports',
  'tab-pat-appt':                 'ppInitBooking',
  'tab-pat-profile':              'ppLoadPrivacy',
  'tab-admin-dash':               'renderAdminDashboard',
  'tab-admin-appt':               'initAdminLedger',
  'tab-admin-avail':              'initAvailability',
  'tab-admin-billing':            'openBillingWorkspace',
  'tab-admin-search':             'loadRoster',
  'ip-ledger-view':               'loadIPLedger',
  'ip-history-view':              'loadIPHistory',
  'ip-bed-management-view':       'initBedMap',
  'ds-desk-view':                 'dsOpenDesk',
  'tab-admin-pharmacy':           'loadPharmacyInventory',
  'pharmacy-desk-workspace':      'openPharmacyDesk',
  'pharmacy-billing-workspace':   'openPharmacyBilling',
  'pharmacy-dashboard-workspace': 'openPharmacyDashboard',
  'pharmacy-ledger-workspace':    'PhLedger.open',
  'pharmacy-schedule-register':   'PhRegister.open',
  // THE PRIVACY CONSOLE HAD NO ENTRY HERE AT ALL.
  //
  // switchTab('tab-admin-dpdp') showed the markup and nothing fetched
  // anything, so the screen opened on its own placeholders — four counters
  // reading "–" and every panel reading "Loading…" — and stayed that way
  // for ever. The only thing that ever populated it was the Refresh button
  // in its top corner, which a person has to notice and press on a screen
  // that is already claiming to be loading. That is the whole of "the
  // privacy workspace loads poorly".
  'tab-admin-dpdp':               'dpConsoleLoad',
  'lab-workspace-view':           'LabX.load',
  'lab-billing-workspace':        'LabBill.load',
  'lab-ledger-workspace':         'LabLedger.open',
  'workspace-lab-catalog':        'LabCatalog.init',
  'workspace-lab-records':        'LabRecordsApp.init',
  'workspace-accounts':           'showAccounts'
};

/** A dotted global path ("LabX.load") to the function, or null. */
function crescResolveFn(path) {
  if (!path) return null;
  var parts = String(path).split('.');
  var ref = window;
  for (var i = 0; i < parts.length; i++) {
    if (ref === null || ref === undefined) return null;
    ref = ref[parts[i]];
  }
  return (typeof ref === 'function') ? ref : null;
}

/* --------------------------------------------------------------------
   NAVIGATION GENERATION

   crescRunTabInit defers the entry point to the next tick so the switch
   paints first. That is right, but it made every DEEP LINK into a
   workspace fail silently, and the Discharge Settlement tile was the
   visible case:

     openDischargeDesk()
       -> switchTab('workspace-accounts')      // schedules showAccounts()
       -> switchAccountsPage('…-discharge')    // shows the settlement desk
       ... next tick ...
       -> showAccounts()                       // switches straight back

   The user clicked the tile, the hub stayed on screen, and nothing in the
   console said why. openIpTab() next to it worked only because it never
   called switchTab at all.

   So an init is now stamped with the navigation it was scheduled for, and
   skipped if navigation has moved on since. Every deep link into a
   workspace sub-page is fixed by this, not just the one that was
   reported.
   -------------------------------------------------------------------- */
window.crescNavSeq = 0;

/** Records that navigation has moved. Called by every router in the app. */
window.crescNavMoved = function () { window.crescNavSeq++; };

/** Runs a screen's entry point, on the next tick so the switch paints first. */
function crescRunTabInit(tabId) {
  var path = CRESC_TAB_INIT[tabId];
  if (!path) return;
  var seq = window.crescNavSeq;
  setTimeout(function () {
    // Somebody navigated deeper while this was queued. Their destination
    // wins; running the landing init now would throw it away.
    if (seq !== window.crescNavSeq) return;
    var fn = crescResolveFn(path);
    if (fn) {
      try { fn(); } catch (e) { /* the screen is up; its fetch reports itself */ }
      return;
    }
    // THE ENTRY POINT IS NOT THERE.
    //
    // This branch used to be nothing at all: no function, no call, no word.
    // A screen whose script block failed to evaluate still has its markup —
    // the loader inserts markup before it runs scripts — so the page looks
    // completely normal, its entry point never runs, and every inline
    // onclick on it is a dead reference. Pressing anything does nothing,
    // including the buttons that make no server call, which is what makes
    // it so hard to report as anything but "nothing works".
    //
    // Module_Loader_UI.html now catches and names the script that failed,
    // and this is the backstop for every other way a name can go missing:
    // a renamed function, a partial dropped from a bundle, a file pasted
    // in half.
    crescScreenInert(tabId, path);
  }, 0);
}

/**
 * Says that a screen did not start, once, without covering the screen.
 *
 * Deliberately not a modal: the user may still be able to read what is on
 * the page, and the honest statement is that the controls will not answer,
 * not that the data is wrong.
 */
function crescScreenInert(tabId, wanted) {
  var id = 'cresc-screen-inert';
  var old = document.getElementById(id);
  if (old) old.parentNode.removeChild(old);

  var bar = document.createElement('div');
  bar.id = id;
  bar.className = 'alert alert-danger d-flex align-items-start gap-2 m-3';
  bar.style.cssText = 'font-size:.9rem;';
  bar.innerHTML = '<i class="fa-solid fa-triangle-exclamation mt-1"></i><span></span>';
  bar.querySelector('span').textContent =
    'This screen did not start: its code defines no ' + wanted + '(), so its ' +
    'buttons will not respond. Nothing you do here will be saved. Reload the ' +
    'page; if it keeps happening, this deployment is missing or has a stale ' +
    'copy of the file that holds that screen.';

  var btn = document.createElement('button');
  btn.className = 'btn btn-sm btn-light ms-auto flex-shrink-0';
  btn.textContent = 'Reload';
  btn.onclick = function () { window.location.reload(); };
  bar.appendChild(btn);

  var host = document.querySelector('.main-content') || document.body;
  host.insertBefore(bar, host.firstChild);
}

function routeToEMRTimeline(patientId) {
    // 1. Tell switchTab we are entering EMR via a handoff (skips the landing menu)
    window.isLedgerHandoff = true; 
    
    // 2. Activate the main EMR tab natively so the sidebar highlights
    switchTab('tab-admin-emr'); 
    
    // 3. Hide the landing menu and OP consult
    const landingMenu = document.getElementById('emr-landing-menu');
    if (landingMenu) landingMenu.classList.add('d-none');
    
    const opWorkspace = document.getElementById('emr-workspace-op-consult');
    if (opWorkspace) opWorkspace.classList.add('d-none');
    
    // 4. Show the Timeline module specifically
    const recordsEl = document.getElementById('emr-workspace-records');
    if (recordsEl) recordsEl.classList.remove('d-none');
    
    // 5. Fire the fetch
    if (typeof openPatientTimeline === 'function') {
        openPatientTimeline(patientId);
    }
}

function signOut() {
  if (typeof performSignOut === 'function') {
    performSignOut();
    return;
  }
  // Defensive fallback only if Auth.html failed to load. Do NOT use location.reload()
  // (reloads the sandbox iframe -> blank page). Best-effort identity teardown only.
  try { if (typeof firebase !== 'undefined' && firebase.auth) firebase.auth().signOut(); } catch (e) {}
  var a = document.getElementById('app-screen');
  var s = document.getElementById('auth-screen');
  if (a) a.classList.add('d-none');
  if (s) s.classList.remove('d-none');
}
</script>
