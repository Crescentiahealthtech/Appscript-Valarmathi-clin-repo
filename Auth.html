<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<div id="auth-screen">
  <div class="auth-card shadow-lg text-center mx-auto mt-5" style="max-width: 400px; padding: 40px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px;">
    <img id="login-logo" src="" alt="CRESCENTIA HEALTHTECH" class="clinic-logo">
    <h2 class="fw-bold mb-1">CresRx</h2>
    <p class="mb-4 small label-bright" style="letter-spacing: 1px;">Care • Compassion • Cure</p>

    <button id="btn-google-login" class="btn w-100 py-2 mb-3 fw-bold text-dark border shadow-sm" style="background-color: var(--bg-card);" onclick="handleGoogleLogin()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G" style="width: 18px; margin-right: 8px; margin-bottom: 2px;">
      Sign in with Google
    </button>

    <div class="text-muted mb-3 small fw-bold">OR MANUAL LOGIN</div>

    <input type="text" id="in-username" class="form-control mb-3 py-2 text-white-force" placeholder="Patient ID / Admin">
    <input type="password" id="in-password" class="form-control mb-4 py-2 text-white-force" placeholder="Password">

    <button id="btn-login" class="btn w-100 py-2 mb-3 text-white fw-bold on-accent" style="background-color: var(--accent-purple);" onclick="handleLogin()">Secure Login</button>
  </div>
</div>

<div id="mfa-screen" class="d-none text-center mx-auto mt-5" style="max-width: 350px; padding: 40px; background-color: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px;">
  <i class="fa-solid fa-shield-halved text-warning mb-3" style="font-size: 2rem;"></i>
  <h4 class="fw-bold text-white mb-2">Two-Factor Auth</h4>
  <p class="small text-muted mb-4">Enter the 6-digit code from Google Authenticator.</p>

  <input type="text" id="in-mfa-code" class="form-control mb-3 text-center fs-4" placeholder="000000" maxlength="6" style="letter-spacing: 4px;">

  <button id="btn-verify-mfa" class="btn btn-warning w-100 fw-bold" onclick="submitMFA()">Verify &amp; Login</button>
  <button class="btn btn-link text-muted w-100 mt-2 small" onclick="cancelMFA()">Cancel</button>
</div>

<script>
  // ==========================================
  // 0. SESSION TIMEOUT CONFIGURATION
  // ------------------------------------------
  // Matched to the SERVER-SIDE CacheService token TTL (6h) set in
  // issueSession_(). Keeping the client longer than the server produces a
  // window where the UI looks logged in but every scoped call is refused.
  // ==========================================
  const SESSION_TIMEOUT_MS = 6 * 60 * 60 * 1000;
  let sessionInterval;

  window.addEventListener('DOMContentLoaded', function () {
    checkSession();
  });

  function checkSession() {
    const isLoggedIn    = localStorage.getItem('isLoggedIn');
    const loginTime     = localStorage.getItem('loginTimestamp');
    const savedUsername = localStorage.getItem('loggedInUser');
    const savedRole     = localStorage.getItem('loggedInRole');

    if (isLoggedIn === 'true' && loginTime && savedUsername && savedRole) {
      const timeElapsed = Date.now() - parseInt(loginTime, 10);

      if (timeElapsed > SESSION_TIMEOUT_MS) {
        logoutUser("Your session has expired. Please log in again.");
      } else {
        // Restore the FULL session, not just the role. Without sessionToken
        // every doctor-scoped backend call would be refused after a refresh.
        const restored = {
          role:         savedRole,
          success:      true,
          sessionToken: localStorage.getItem('sessionToken') || '',
          doctorId:     localStorage.getItem('doctorId') || '',
          displayName:  localStorage.getItem('displayName') || savedUsername
        };
        executeUIRouting(restored, savedUsername, true);
      }
    }
  }

  function startBackgroundTimer() {
    clearInterval(sessionInterval);
    sessionInterval = setInterval(function () {
      const loginTime = localStorage.getItem('loginTimestamp');
      if (loginTime) {
        const timeElapsed = Date.now() - parseInt(loginTime, 10);
        if (timeElapsed > SESSION_TIMEOUT_MS) {
          logoutUser("You have been automatically logged out.");
        }
      }
    }, 60000);
  }

  /** Single place that wipes every stored session key. */
  function clearStoredSession() {
    ['isLoggedIn', 'loggedInUser', 'loggedInRole', 'loginTimestamp',
     'sessionToken', 'doctorId', 'displayName'].forEach(function (k) {
      localStorage.removeItem(k);
    });
    window.loggedInUser      = null;
    window.loggedInRole      = null;
    window.currentDoctorId   = "";
    window.currentDoctorName = "";
    window.sessionToken      = "";
    window.crescDoctorCtx    = null;   // force a fresh doctor list on next login
  }

  function logoutUser(message) {
    if (window.CrescScan) window.CrescScan.stop();   // before the token is cleared
    clearInterval(sessionInterval);
    clearStoredSession();

    if (message) alert(message);

    const appScreen = document.getElementById('app-screen');
    if (appScreen) appScreen.classList.add('d-none');

    document.getElementById('mfa-screen').classList.add('d-none');
    document.getElementById('auth-screen').classList.remove('d-none');

    try { if (auth) auth.signOut(); } catch (e) { /* never block logout */ }
  }

  // ==========================================
  // 0b. SHARED DOCTOR CONTEXT
  // ------------------------------------------
  // Loaded once per session and reused by Admin_Appointments, Modals and
  // Admin_Availability. Lives here because it is session-derived, and because
  // Auth.html is guaranteed to be parsed before any module partial.
  // ==========================================
  window.crescDoctorCtx = null;

  /** HTML-escape helper shared by every module that builds markup strings. */
  window.crescEsc = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  // ==========================================
  //  MISSING-SYMBOL TRANSLATOR
  // ==========================================
  // Apps Script has one global scope and no module system. If a single .gs file
  // is missing from the project - or was pasted in half - every function it
  // declares is simply undefined, and the ONLY symptom is a ReferenceError deep
  // inside an unrelated screen ("resolveScope_ is not defined" while loading a
  // ward). That reads like five separate bugs. This maps the symbol back to the
  // file that declares it, so one banner replaces the guesswork.
  window.CRESC_SYMBOL_HOME = {
    resolveScope_: 'Doctor_Core.gs', resolveWriteDoctor_: 'Doctor_Core.gs',
    dc_invalidate_: 'Doctor_Core.gs', dc_sheetValues_: 'Doctor_Core.gs',
    dc_headerMap_: 'Doctor_Core.gs', dc_ensureSheet_: 'Doctor_Core.gs',
    dc_getDoctorById_: 'Doctor_Core.gs', dc_normaliseTeamRole_: 'Doctor_Core.gs',
    dc_isOnCareTeam_: 'Doctor_Core.gs', dc_careTeamSheet_: 'Doctor_Core.gs',
    dc_sessionName_: 'Doctor_Session_Store.gs', dc_validateSession_: 'Doctor_Session_Store.gs',
    validateSession_: 'Doctors_Engine.gs', issueSession_: 'Doctors_Engine.gs',
    logAudit_: 'Doctors_Engine.gs', getTenantId_: 'Doctors_Engine.gs',
    resolveIPWrite_: 'IP_Clinical_Access.gs', resolveIPRead_: 'IP_Clinical_Access.gs',
    ipc_admissionRow_: 'IP_Clinical_Access.gs', ipc_authorLabel_: 'IP_Clinical_Access.gs',
    ipc_wardVisibilityFilter_: 'IP_Clinical_Access.gs',
    ipc_currentCasesheet_: 'IP_Casesheet_Engine.gs', ipc_writeCasesheetRow_: 'IP_Casesheet_Engine.gs',
    checkDrugInteractions: 'Drug_Interactions.gs', di_rules_: 'Drug_Interactions.gs',
    _normDrug_: 'IP_Notes_Logic.gs',
    createLabRequest: 'LabIntegrationEngine.gs'
  };

  /**
   * Turns a raw backend error into something that names the actual cause.
   * Anything that is not a missing-symbol error is passed through untouched.
   * @param {string|Error} err
   * @returns {string}
   */
  window.crescExplainError = function (err) {
    var msg = (err && err.message) ? err.message : String(err || '');
    var m = /([A-Za-z0-9_$]+) is not defined/.exec(msg);
    if (!m) return msg;
    var file = window.CRESC_SYMBOL_HOME[m[1]];
    var where = file ? 'the file ' + file + ' is' : 'one server file is';
    window.crescDeployBanner(
      'Server code incomplete: ' + where + ' missing or out of date in the Apps ' +
      'Script project. Run verifyDeployment() from the script editor for the full list.');
    return msg + '  —  ' + (file
      ? file + ' is missing from the Apps Script project (or was pasted in incomplete).'
      : 'a server file is missing from the Apps Script project.');
  };

  /** One sticky banner, not one toast per failed call. */
  window.crescDeployBanner = function (text) {
    var el = document.getElementById('cresc-deploy-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cresc-deploy-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:20000;' +
        'background:var(--danger-bg);color:var(--danger-fg);border-bottom:1px solid var(--danger);padding:10px 44px 10px 16px;font-size:0.85rem;' +
        'font-weight:600;box-shadow:0 2px 10px rgba(var(--shadow-rgb), .4);';
      var x = document.createElement('button');
      x.innerHTML = '&times;';
      x.setAttribute('aria-label', 'Dismiss');
      x.style.cssText = 'position:absolute;right:10px;top:6px;background:none;border:0;' +
        'color:var(--danger-fg);font-size:1.3rem;line-height:1;cursor:pointer;';
      x.onclick = function () { el.remove(); };
      el.appendChild(document.createElement('span'));
      el.appendChild(x);
      document.body.appendChild(el);
    }
    el.firstChild.textContent = text;
  };

  /**
   * Fetches the doctors this session may see. Cached for the session.
   * @param {function} done  called with the context object (never null)
   * @param {boolean}  force bypass the cache
   */
  window.loadDoctorContext = function (done, force) {
    if (window.crescDoctorCtx && !force) {
      if (done) done(window.crescDoctorCtx);
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          window.crescDoctorCtx = { success: false, doctors: [], locked: true,
                                    selfDoctorId: '', mode: 'SET' };
          alert((res && res.message) || 'Could not load the doctor list.');
        } else {
          window.crescDoctorCtx = res;
        }
        if (done) done(window.crescDoctorCtx);
      })
      .withFailureHandler(function (err) {
        window.crescDoctorCtx = { success: false, doctors: [], locked: true,
                                  selfDoctorId: '', mode: 'SET' };
        alert('Network error loading doctors: ' + err.message);
        if (done) done(window.crescDoctorCtx);
      })
      .getDoctorPickerContext(window.sessionToken);
  };

  /** Builds <option> markup from the cached context. */
  window.crescDoctorOptions = function (placeholder) {
    const ctx = window.crescDoctorCtx || { doctors: [] };
    const head = placeholder ? '<option value="">' + window.crescEsc(placeholder) + '</option>' : '';
    return head + ctx.doctors.map(function (d) {
      return '<option value="' + window.crescEsc(d.doctorId) + '">' +
             window.crescEsc(d.name) +
             (d.specialty ? ' &mdash; ' + window.crescEsc(d.specialty) : '') +
             '</option>';
    }).join('');
  };

  // ==========================================
  // 1. FIREBASE INITIALIZATION
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyDJSMsLhlbsGwC1cMR9mNM4Vy2kQ1MmGy4",
    authDomain: "crescentiaemrbuild.firebaseapp.com",
    projectId: "crescentiaemrbuild",
    storageBucket: "crescentiaemrbuild.firebasestorage.app",
    messagingSenderId: "882250071558",
    appId: "1:882250071558:web:e06dcf2d3880a492364d87",
    measurementId: "G-VCFZBNT7Y6"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  // ==========================================
  // 2. GLOBAL STATE FOR MFA
  // ==========================================
  let pendingAuthRes = null;
  let pendingAuthName = null;

  // ==========================================
  // 3. GOOGLE SSO LOGIN DISPATCHER
  // ==========================================
  function handleGoogleLogin() {
    const btn = document.getElementById('btn-google-login');
    const originalHtml = btn.innerHTML;

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
    btn.disabled = true;

    auth.signInWithPopup(provider)
      .then(function (result) {
        const userEmail = result.user.email;

        google.script.run
          .withSuccessHandler(function (res) {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            if (res.success) triggerMFAOrRoute(res, res.username);
            else alert(res.message);
          })
          .withFailureHandler(function (err) {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            alert("Network Verification Error: " + err.message);
          })
          .verifyGoogleLogin(userEmail);
      })
      .catch(function () {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      });
  }

  // ==========================================
  // 4. MANUAL LOGIN DISPATCHER
  // ==========================================
  function handleLogin() {
    const btn = document.getElementById('btn-login');
    const usernameInput = document.getElementById('in-username').value.trim();
    const passwordInput = document.getElementById('in-password').value.trim();

    if (!usernameInput || !passwordInput) {
      return alert("Please enter both ID and Password.");
    }

    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        if (res.success) triggerMFAOrRoute(res, usernameInput);
        else alert(res.message);
      })
      .withFailureHandler(function (err) {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        alert("Network Error: " + err.message);
      })
      .verifyLogin({ username: usernameInput, password: passwordInput });
  }

  // ==========================================
  // 5. THE INTERCEPTOR (MFA CHECKER)
  // ==========================================
  function triggerMFAOrRoute(res, username) {
    if (res.role === 'patient') {
      executeUIRouting(res, username);
    } else {
      pendingAuthRes = res;
      pendingAuthName = username;
      document.getElementById('auth-screen').classList.add('d-none');
      document.getElementById('mfa-screen').classList.remove('d-none');
    }
  }

  function submitMFA() {
    const btn = document.getElementById('btn-verify-mfa');
    const code = document.getElementById('in-mfa-code').value.trim();

    if (!code || code.length !== 6) return alert("Enter the 6 digit code.");

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (mfaRes) {
        btn.innerHTML = 'Verify & Login';
        btn.disabled = false;
        if (mfaRes.success) {
          document.getElementById('mfa-screen').classList.add('d-none');
          executeUIRouting(pendingAuthRes, pendingAuthName);
        } else {
          alert("Invalid or Expired MFA Code. Try again.");
        }
      })
      .withFailureHandler(function (err) {
        btn.innerHTML = 'Verify & Login';
        btn.disabled = false;
        alert("Network error: " + err.message);
      })
      .verifyMFA(pendingAuthName, code);
  }

  function cancelMFA() {
    pendingAuthRes = null;
    pendingAuthName = null;
    document.getElementById('in-mfa-code').value = "";
    document.getElementById('mfa-screen').classList.add('d-none');
    document.getElementById('auth-screen').classList.remove('d-none');
    auth.signOut();
  }

  // ==========================================
  // 6. CENTRAL UI ROUTING ENGINE
  // ==========================================
  function executeUIRouting(res, loggedInName, isRestore) {
    isRestore = (isRestore === true);

    window.loggedInUser      = loggedInName;
    window.loggedInRole      = (res.role || "").toLowerCase();
    window.currentDoctorId   = res.doctorId || "";
    window.currentDoctorName = res.displayName || loggedInName;
    window.sessionToken      = res.sessionToken || "";

    // Persist the FULL session so a page refresh does not strip the token.
    if (!isRestore) {
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('loggedInUser', loggedInName);
      localStorage.setItem('loggedInRole', window.loggedInRole);
      localStorage.setItem('loginTimestamp', Date.now().toString());
      localStorage.setItem('sessionToken', window.sessionToken);
      localStorage.setItem('doctorId', window.currentDoctorId);
      localStorage.setItem('displayName', window.currentDoctorName);
    }
    startBackgroundTimer();

    // A new identity must not inherit the previous user's doctor list.
    window.crescDoctorCtx = null;

    document.getElementById('auth-screen').classList.add('d-none');
    document.getElementById('mfa-screen').classList.add('d-none');

    // Reveal nothing until the role decides. Any pane still carrying
    // active-section from the markup would otherwise flash first.
    document.querySelectorAll('.page-section.active-section')
            .forEach(function (s) { s.classList.remove('active-section'); });

    const appScreen = document.getElementById('app-screen');
    if (appScreen) appScreen.classList.remove('d-none');

    const isPatient = window.loggedInRole === 'patient';
    const navDoc = document.getElementById('nav-doctor');
    const navPat = document.getElementById('nav-patient');
    if (navDoc) navDoc.classList.toggle('d-none', isPatient);
    if (navPat) navPat.classList.toggle('d-none', !isPatient);
    if (typeof setDateRestrictions === 'function') setDateRestrictions();

    const dispName = document.getElementById('display-user-name');
    const profInit = document.getElementById('profile-initial');
    if (dispName) dispName.innerText = isPatient
        ? "Patient Portal"
        : (res.displayName || ("Staff: " + window.loggedInRole.toUpperCase()));
    if (profInit) profInit.innerText = window.loggedInRole.charAt(0).toUpperCase();

    if (typeof applyRBAC === 'function') applyRBAC(window.loggedInRole);

    // Barcode scanner (Barcode_Router.html): staff only.
    if (window.CrescScan) {
      if (isPatient) window.CrescScan.stop(); else window.CrescScan.start();
    }

    // Warm the doctor cache for clinical roles so the first picker paints fast.
    if (!isPatient && window.sessionToken && typeof window.loadDoctorContext === 'function') {
      window.loadDoctorContext(function () {});
    }

    switch (window.loggedInRole) {
      case 'admin':
      case 'receptionist':
      case 'reception':
        switchTab('tab-admin-dash', document.getElementById('nav-tab-dash')); break;
      case 'doctor':
        switchTab('tab-admin-emr', document.getElementById('nav-tab-emr')); break;
      case 'nurse':
        switchTab('tab-admin-dash', document.getElementById('nav-tab-dash')); break;
      case 'pharmacy':
        switchTab('tab-admin-pharmacy', document.getElementById('nav-tab-pharmacy')); break;
      case 'lab':
        switchTab('tab-admin-lab', document.getElementById('nav-tab-lab')); break;
      case 'accounts':
        switchTab('tab-admin-billing', document.getElementById('nav-tab-accounts')); break;
      case 'patient': {
        const patHome = document.querySelector('#nav-patient .nav-link');
        switchTab('tab-pat-home', patHome);
        if (typeof fetchProfileData === 'function') fetchProfileData();
        if (typeof refreshPatientDashboard === 'function') refreshPatientDashboard();
        break;
      }
      default:
        switchTab('tab-admin-dash', document.getElementById('nav-tab-dash'));
    }
  }

  // ==========================================
  // 7. CENTRAL SIGN-OUT / SESSION TEARDOWN
  // ==========================================
  function performSignOut() {
    if (window.CrescScan) window.CrescScan.stop();   // before the token is cleared
    clearInterval(sessionInterval);

    try {
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().signOut().catch(function () {});
      }
    } catch (e) { /* ignore — sign-out must never get stuck */ }

    clearStoredSession();
    pendingAuthRes = null;
    pendingAuthName = null;

    const appScreen  = document.getElementById('app-screen');
    const mfaScreen  = document.getElementById('mfa-screen');
    const authScreen = document.getElementById('auth-screen');
    if (appScreen)  appScreen.classList.add('d-none');
    if (mfaScreen)  mfaScreen.classList.add('d-none');
    if (authScreen) authScreen.classList.remove('d-none');

    ['in-username', 'in-password', 'in-mfa-code'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });

    ['nav-doctor', 'nav-patient'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('d-none');
    });

    document.querySelectorAll('.page-section').forEach(function (s) { s.classList.remove('active-section'); });
    document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });

    window.scrollTo(0, 0);
  }
</script>
