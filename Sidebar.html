<script>
  // 1. Sidebar Toggle Logic
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 768) {
        sidebar.classList.toggle('mobile-open');
    } else {
        sidebar.classList.toggle('collapsed');
        // An explicit click is a preference: remember it, and stop auto-
        // collapsing until the user chooses again this session.
        window.crescSidebarPinned = !sidebar.classList.contains('collapsed');
        try {
            localStorage.setItem('sidebarCollapsed',
                sidebar.classList.contains('collapsed') ? '1' : '0');
        } catch (e) { /* a full localStorage must not break navigation */ }
    }
  }

  /**
   * Collapses the sidebar when the user moves into a working screen.
   *
   * Clinical screens — the OP consult, the IP casesheet, IP notes, the lab and
   * pharmacy desks — are dense, and 260px of navigation is 260px not spent on
   * the chart. The rail stays, so nothing becomes unreachable, and an explicit
   * click on the toggle pins it open for the rest of the session.
   */
  window.crescAutoCollapseSidebar = function (collapse) {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;
    if (window.innerWidth <= 768) return;      // mobile uses the overlay
    if (window.crescSidebarPinned) return;     // the user asked for it open
    sidebar.classList.toggle('collapsed', collapse !== false);
  };

  // Restore the last explicit choice on load.
  (function () {
    try {
      const v = localStorage.getItem('sidebarCollapsed');
      if (v === '0') window.crescSidebarPinned = true;
    } catch (e) { /* ignore */ }
  })();

  // 2. Theme control
  // Single entry point for the theme. The class is kept on the root element
  // AND the body element: the root is set pre-paint by the bootstrap in
  // Index.html, the body is what the component stylesheets match on. A
  // `themechange` event lets canvas-based
  // widgets (Chart.js) that cannot read CSS variables repaint themselves.
  function applyTheme(theme) {
    const isLight = (theme === 'light');

    // Scope colour transitions to the switch itself so we do not permanently
    // add a transition to every element in the app.
    document.body.classList.add('theme-switching');

    document.documentElement.classList.toggle('light-theme', isLight);
    document.body.classList.toggle('light-theme', isLight);

    const themeIcon = document.getElementById('theme-icon');
    if (themeIcon) {
      themeIcon.classList.toggle('fa-sun', isLight);
      themeIcon.classList.toggle('fa-moon', !isLight);
    }

    try { localStorage.setItem('cresrx_theme', theme); } catch (e) { /* private mode */ }

    // Let dependants (charts, canvases) re-read the resolved token values.
    window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));

    setTimeout(function () { document.body.classList.remove('theme-switching'); }, 300);
  }
  window.applyTheme = applyTheme;

  function toggleTheme() {
    applyTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light');
  }
  window.toggleTheme = toggleTheme;

  // 3. Sync the icon with the theme the pre-paint bootstrap already applied.
  (function syncThemeIcon() {
    function sync() {
      const isLight = document.documentElement.classList.contains('light-theme');
      document.body.classList.toggle('light-theme', isLight);
      const themeIcon = document.getElementById('theme-icon');
      if (themeIcon) {
        themeIcon.classList.toggle('fa-sun', isLight);
        themeIcon.classList.toggle('fa-moon', !isLight);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sync);
    } else {
      sync();
    }
  })();
</script>
