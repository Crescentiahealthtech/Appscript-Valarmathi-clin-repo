<style>
  /* 🛡️ Bulletproof CSS to ensure text hides perfectly when collapsed */
  .sidebar.collapsed .sidebar-text,
  .sidebar.collapsed .label-bright,
  .sidebar.collapsed .profile-details {
      display: none !important;
  }
  .sidebar.collapsed .nav-link,
  .sidebar.collapsed .theme-toggle-btn {
      justify-content: center !important;
      padding: 12px 0 !important;
  }
  .sidebar.collapsed .nav-link i,
  .sidebar.collapsed .theme-toggle-btn i {
      margin: 0 !important;
      font-size: 1.3rem !important;
  }

  /* ------------------------------------------------------------------
     ONE INSET DOWN THE WHOLE RAIL

     The nav buttons sit directly in the rail and carry margin:4px 12px
     (4px 8px collapsed). The theme toggle sat inside a px-2 wrapper ON
     TOP of that margin, and the profile row inside px-3, so the bottom
     of the rail was inset 8px and 16px further than every button above
     it — the toggle read as a narrower, displaced button and the avatar
     sat off the icon column instead of on it.

     The wrappers now contribute nothing and the two blocks inherit the
     nav-link geometry, so one vertical centre line runs from the
     Dashboard icon to the avatar.
     ------------------------------------------------------------------ */
  #sidebar .sidebar-footer,
  #sidebar .sidebar-profile {
      padding-left: 0 !important;
      padding-right: 0 !important;
  }
  #sidebar .sidebar-profile .profile-row { padding: 0 12px; }
  .sidebar.collapsed .sidebar-profile .profile-row {
      justify-content: center !important;
      padding: 0 8px !important;
      gap: 0 !important;
  }

  @media (max-width: 768px) {
    .sidebar:not(.mobile-open) .sidebar-profile .profile-row {
        justify-content: center !important;
        padding: 0 8px !important;
        gap: 0 !important;
    }
  }

  /* ------------------------------------------------------------------
     ACCOUNT MENU

     Anchored to the rail rather than to the avatar, and fixed-position so
     it is never clipped by the rail's own overflow: the rail scrolls, and
     a menu inside a scrolling 85px column would be cut off at the edge.
     ------------------------------------------------------------------ */
  #sidebar .sidebar-avatar { cursor: pointer; transition: box-shadow .15s ease; }
  #sidebar .sidebar-avatar:hover,
  #sidebar .sidebar-avatar[aria-expanded="true"] {
      box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .sidebar-account-menu {
      position: fixed; z-index: 2200; min-width: 208px;
      background: var(--bg-elevated); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 10px;
      box-shadow: var(--shadow-lg); padding: .35rem;
  }
  .sidebar-account-menu[hidden] { display: none !important; }
  .sidebar-account-menu .sam-who {
      padding: .45rem .6rem .5rem; margin-bottom: .25rem;
      border-bottom: 1px solid var(--divider-color);
  }
  .sidebar-account-menu .sam-item {
      display: flex; align-items: center; gap: .6rem; width: 100%;
      background: transparent; border: 0; border-radius: 7px;
      padding: .45rem .6rem; color: var(--text-main);
      font-size: .86rem; font-weight: 500; text-align: left;
  }
  .sidebar-account-menu .sam-item:hover { background: var(--surface-hover); }
  .sidebar-account-menu .sam-item i { width: 1rem; text-align: center; color: var(--text-muted); }
  .sidebar-account-menu .sam-danger { color: var(--danger-fg); }
  .sidebar-account-menu .sam-danger i { color: var(--danger-fg); }
</style>

<div id="sidebar" class="sidebar py-3 d-flex flex-column h-100">
  
  <div class="d-flex align-items-center justify-content-between mb-4 px-3 flex-shrink-0">
    <div class="d-flex align-items-center gap-2">
      <img id="nav-logo" src="" alt="Logo" class="sidebar-logo">
      <h5 class="m-0 fw-bold text-white sidebar-text">CresRx</h5>
    </div>
    <i class="fa-solid fa-bars sidebar-toggle" onclick="toggleSidebar()" style="cursor: pointer;"></i>
  </div>
  
  <div id="nav-patient" class="nav flex-column mt-2 d-none">
    <div class="px-3 mb-2 small fw-bold label-bright" style="letter-spacing: 1px;">MY HEALTH</div>
    <a class="nav-link active" onclick="switchTab('tab-pat-home', this)"><i class="fa-solid fa-house"></i> <span class="sidebar-text">Home</span></a>
    <a class="nav-link" onclick="switchTab('tab-pat-profile', this)"><i class="fa-solid fa-user"></i> <span class="sidebar-text">My Profile</span></a>
    <a class="nav-link" onclick="switchTab('tab-pat-records', this)"><i class="fa-solid fa-file-medical"></i> <span class="sidebar-text">Records & Labs</span></a>
    <a class="nav-link" onclick="switchTab('tab-pat-appt', this)"><i class="fa-solid fa-calendar-check"></i> <span class="sidebar-text">Book Appointment</span></a>
    <a class="nav-link" onclick="switchTab('tab-pat-meds', this)"><i class="fa-solid fa-pills"></i> <span class="sidebar-text">Order Medications</span></a>
  </div>

  <div id="nav-doctor" class="nav flex-column mt-2 d-none">
    <div class="px-3 mb-2 small fw-bold label-bright" style="letter-spacing: 1px;">COMMAND CENTER</div>
    <a class="nav-link active" id="nav-tab-dash" onclick="switchTab('tab-admin-dash', this)"><i class="fa-solid fa-chart-line"></i> <span class="sidebar-text">Dashboard</span></a>
    <a class="nav-link" id="nav-tab-appt" onclick="switchTab('workspace-appointments', this)"><i class="fa-solid fa-calendar-check"></i> <span class="sidebar-text">Appointments</span></a>
    <a class="nav-link" id="nav-tab-patients" onclick="switchTab('workspace-patients', this)"><i class="fa-solid fa-hospital-user"></i> <span class="sidebar-text">Patients</span></a>
    <a class="nav-link" id="nav-tab-emr" onclick="switchTab('tab-admin-emr', this)"><i class="fa-solid fa-laptop-medical"></i> <span class="sidebar-text">EMR</span></a>
    <!-- IP Ward and the Discharge Desk are not listed here on purpose. Both are

    <a class="nav-link" id="nav-tab-pharmacy" onclick="switchTab('workspace-pharmacy', this)"><i class="fa-solid fa-pills"></i> <span class="sidebar-text">Pharmacy</span></a>
    <a class="nav-link" id="nav-tab-lab" onclick="switchTab('workspace-lab', this)"><i class="fa-solid fa-flask-vial"></i> <span class="sidebar-text">Labs</span></a>

  </div>

  <div class="mt-auto sidebar-footer">
    <div class="theme-toggle-btn" onclick="toggleTheme()">

  </div>

  <div class="sidebar-profile pt-3 mt-3 border-top border-secondary flex-shrink-0">
    <!-- Collapsed, the avatar is the only thing left of this row, and Sign
         Out is inside .profile-details which is hidden. Signing out therefore
         meant opening the whole rail first. The avatar is now a button: it
         opens a small account menu with Sign Out in it, wherever the rail is. -->
    <div class="profile-row d-flex align-items-center gap-3" id="sidebar-profile-row">
      <button type="button"
              class="rounded-circle d-flex justify-content-center align-items-center text-white fw-bold on-accent sidebar-avatar"
              style="width: 35px; height: 35px; background-color: var(--accent-purple); border: 0; flex-shrink: 0;"
              id="profile-initial"
              aria-haspopup="true" aria-expanded="false"
              title="Account" onclick="crescToggleAccountMenu(event)">?</button>
      <div class="profile-details">
        <h6 id="display-user-name" class="m-0 text-white small">Loading...</h6>
        <small><a href="#" onclick="signOut(); return false;" style="color: var(--text-muted); text-decoration: none;">Sign Out</a></small>
      </div>
    </div>

    <div id="sidebar-account-menu" class="sidebar-account-menu" hidden>
      <div class="sam-who">
        <div class="fw-bold small" id="sam-name">&nbsp;</div>
        <div class="label-bright" style="font-size:.72rem;" id="sam-role">&nbsp;</div>
      </div>
      <button type="button" class="sam-item" onclick="toggleTheme(); crescCloseAccountMenu();">
        <i class="fa-solid fa-circle-half-stroke"></i> Toggle theme
      </button>
      <button type="button" class="sam-item sam-danger" onclick="crescCloseAccountMenu(); signOut();">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
      </button>
    </div>
  </div>
  
</div>

<script>
  /* ===================================================================
     SIDEBAR STATE — collapsed is the only resting state
     -------------------------------------------------------------------
     The rail costs 260px on every screen, and the screens that matter —
     the consult, the case sheet, the ward, the billing desks — are the
     ones least able to spare it. So the rail is collapsed to its icon
     strip everywhere, all the time. The bars button is the one thing
     that opens it, and the moment the user navigates somewhere the rail
     closes again: opening it is a glance at the labels, not a mode the
     app stays in.

     Nothing is persisted. A reload starts collapsed, always, because a
     remembered "open" is exactly the state the user asked us to stop
     producing.
     =================================================================== */

  function crescIsMobileRail() { return window.innerWidth <= 768; }

  /** Opens the rail. Mobile slides the overlay in; desktop widens it. */
  function crescOpenSidebar() {
    var sidebar = document.getElementById('sidebar');
    if (!sidebar) return;
    if (crescIsMobileRail()) sidebar.classList.add('mobile-open');
    else sidebar.classList.remove('collapsed');
  }

  /** Returns the rail to its resting state. Safe to call from anywhere. */
  function crescCollapseSidebar() {
    var sidebar = document.getElementById('sidebar');
    if (!sidebar) return;
    sidebar.classList.remove('mobile-open');
    // Mobile draws its own 65px strip from the media query; leaving `collapsed`
    // on there would out-specify it and give the phone an 85px rail.
    sidebar.classList.toggle('collapsed', !crescIsMobileRail());
  }
  window.crescCollapseSidebar = crescCollapseSidebar;

  /** True while the rail is showing its labels. */
  function crescSidebarIsOpen() {
    var sidebar = document.getElementById('sidebar');
    if (!sidebar) return false;
    return crescIsMobileRail() ? sidebar.classList.contains('mobile-open')
                               : !sidebar.classList.contains('collapsed');
  }

  // 1. The bars button — the only thing that opens the rail.
  function toggleSidebar() {
    if (crescSidebarIsOpen()) crescCollapseSidebar();
    else crescOpenSidebar();
  }
  window.toggleSidebar = toggleSidebar;

  /**
   * Kept so older call sites (ScriptsMV, the EMR cockpit) keep working.
   * Every screen is now a working screen, so whatever it is asked to do it
   * collapses — the rail never opens itself.
   */
  window.crescAutoCollapseSidebar = function () { crescCollapseSidebar(); };

  // An open rail is a glance, not a mode: navigating anywhere closes it.
  document.addEventListener('click', function (ev) {
    var link = ev.target && ev.target.closest ? ev.target.closest('#sidebar .nav-link') : null;
    if (link) setTimeout(crescCollapseSidebar, 0);
  });

  // Collapsed from the first paint, and after any resize across the
  // mobile/desktop boundary.
  (function () {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', crescCollapseSidebar);
    } else {
      crescCollapseSidebar();
    }
    window.addEventListener('resize', crescCollapseSidebar);
  })();

  /* ===================================================================
     ACCOUNT MENU — sign out without opening the rail
     =================================================================== */

  function crescCloseAccountMenu() {
    var menu = document.getElementById('sidebar-account-menu');
    var btn  = document.getElementById('profile-initial');
    if (menu) menu.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  window.crescCloseAccountMenu = crescCloseAccountMenu;

  function crescToggleAccountMenu(ev) {
    if (ev) ev.stopPropagation();
    var menu = document.getElementById('sidebar-account-menu');
    var btn  = document.getElementById('profile-initial');
    if (!menu || !btn) return;

    if (!menu.hidden) { crescCloseAccountMenu(); return; }

    // Name and role, so the menu says whose account is about to sign out.
    var nameEl = document.getElementById('display-user-name');
    var samName = document.getElementById('sam-name');
    var samRole = document.getElementById('sam-role');
    if (samName) samName.textContent = nameEl ? nameEl.textContent : '';
    if (samRole) {
      var role = String(window.loggedInRole || '');
      samRole.textContent = role ? (role.charAt(0).toUpperCase() + role.slice(1)) : '';
    }

    // Placed beside the avatar and nudged back on screen if it would overflow.
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    var box = btn.getBoundingClientRect();
    var w = menu.offsetWidth || 208;
    var h = menu.offsetHeight || 120;
    var left = Math.min(box.right + 8, window.innerWidth - w - 8);
    var top  = Math.min(Math.max(8, box.top - h + box.height), window.innerHeight - h - 8);
    menu.style.left = Math.max(8, left) + 'px';
    menu.style.top  = top + 'px';
  }
  window.crescToggleAccountMenu = crescToggleAccountMenu;

  // Anything else closes it: a click elsewhere, Escape, a resize or a scroll
  // (it is fixed-position, so it would otherwise sit where the avatar was).
  document.addEventListener('click', function (ev) {
    var menu = document.getElementById('sidebar-account-menu');
    if (!menu || menu.hidden) return;
    if (ev.target.closest && ev.target.closest('#sidebar-account-menu')) return;
    if (ev.target.closest && ev.target.closest('#profile-initial')) return;
    crescCloseAccountMenu();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') crescCloseAccountMenu();
  });
  window.addEventListener('resize', crescCloseAccountMenu);
  window.addEventListener('scroll', crescCloseAccountMenu, true);

  // 2. Theme control
  // Single entry point for the theme. The class is kept on the root element
  // AND the body element: the root is set pre-paint by the bootstrap in
  // Index.html, the body is what the component stylesheets match on. A
  // `themechange` event lets canvas-based
  // widgets (Chart.js) that cannot read CSS variables repaint themselves.
  function applyTheme(theme) {
    const isLight = (theme === 'light');

    // Scope colour transitions to the switch itself so we do not permanently
    // add a transition to every element in the app.
    document.body.classList.add('theme-switching');

    document.documentElement.classList.toggle('light-theme', isLight);
    document.body.classList.toggle('light-theme', isLight);

    const themeIcon = document.getElementById('theme-icon');
    if (themeIcon) {
      themeIcon.classList.toggle('fa-sun', isLight);
      themeIcon.classList.toggle('fa-moon', !isLight);
    }

    try { localStorage.setItem('cresrx_theme', theme); } catch (e) { /* private mode */ }

    // Let dependants (charts, canvases) re-read the resolved token values.
    window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));

    setTimeout(function () { document.body.classList.remove('theme-switching'); }, 300);
  }
  window.applyTheme = applyTheme;

  function toggleTheme() {
    applyTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light');
  }
  window.toggleTheme = toggleTheme;

  // 3. Sync the icon with the theme the pre-paint bootstrap already applied.
  (function syncThemeIcon() {
    function sync() {
      const isLight = document.documentElement.classList.contains('light-theme');
      document.body.classList.toggle('light-theme', isLight);
      const themeIcon = document.getElementById('theme-icon');
      if (themeIcon) {
        themeIcon.classList.toggle('fa-sun', isLight);
        themeIcon.classList.toggle('fa-moon', !isLight);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sync);
    } else {
      sync();
    }
  })();
</script>
