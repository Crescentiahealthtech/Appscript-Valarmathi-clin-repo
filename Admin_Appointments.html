<style>
  .doc-chip { font-size: .7rem; padding: 2px 8px; border-radius: 10px;
              border: 1px solid var(--border-color);
              background: var(--surface-hover); white-space: nowrap; }
</style>

<div id="tab-admin-appt" class="page-section d-none">
  <div id="daily-ledger-container">

    <div class="d-flex justify-content-between align-items-center mb-3 mt-4 me-md-5">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary label-bright" onclick="switchTab('workspace-appointments')"><i class="fa-solid fa-arrow-left"></i></button>
        <h3 class="fw-bold m-0 text-white">Daily Ledger</h3>
      </div>
      <div class="d-flex gap-2">
        <!-- Scan-to-arrive. The front desk scans the barcode on whatever the
             patient brought — card, prescription, lab report, discharge
             summary — and today's booking flips to Arrived without anyone
             finding the row first. -->
        <button class="btn btn-sm btn-outline-warning shadow-sm" id="appt-scan-toggle"
                onclick="toggleApptScanMode()">
          <i class="fa-solid fa-barcode"></i> Scan &rarr; Arrived
        </button>
        <button class="btn btn-sm btn-outline-info shadow-sm" onclick="openWorkingHours()"><i class="fa-solid fa-clock"></i> Hours</button>
        <button class="btn btn-sm btn-outline-success shadow-sm" onclick="openAdminBookingModal('','')"><i class="fa-solid fa-plus"></i> Manual Booking</button>
      </div>
    </div>

    <div id="appt-scan-banner" class="alert alert-warning py-2 px-3 mb-3 d-none
                d-flex align-items-center justify-content-between gap-2">
      <span><i class="fa-solid fa-barcode me-2"></i>
        <strong>Scan mode on.</strong>
        <span id="appt-scan-status">Scan a patient barcode to mark them arrived.</span>
      </span>
      <button class="btn btn-sm btn-outline-dark" onclick="toggleApptScanMode(false)">Stop scanning</button>
    </div>

    <div class="card p-3 mb-3 d-flex flex-row flex-wrap align-items-center justify-content-between gap-2">
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <button class="btn btn-sm btn-outline-secondary label-bright" onclick="changeLedgerDate(-1)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
        <input type="date" id="admin-ledger-date" class="form-control form-control-sm text-white-force" style="width: 140px;" onchange="loadAdminLedger()">
        <button class="btn btn-sm btn-outline-secondary label-bright" onclick="changeLedgerDate(1)">Next <i class="fa-solid fa-chevron-right"></i></button>

        <span class="label-bright small ms-2 fw-bold">Doctor</span>
        <select id="ledger-doctor-filter" class="form-select form-select-sm text-white-force" style="width: 215px;" onchange="loadAdminLedger()">
          <option value="">All doctors</option>
        </select>
      </div>
      <div class="d-flex gap-3 small fw-bold">
        <span class="text-info">Booked: <span id="stat-booked">0</span></span>
        <span class="text-warning">In Queue: <span id="stat-arrived">0</span></span>
        <span class="text-success">Completed: <span id="stat-completed">0</span></span>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div class="table-responsive">
        <table class="table table-dark table-ledger mb-0">
          <thead>
            <tr>
              <th style="width: 9%;">Time</th>
              <th style="width: 7%;">Token</th>
              <th style="width: 11%;">Patient ID</th>
              <th style="width: 20%;">Name</th>
              <th style="width: 9%;">Age/Sex</th>
              <th style="width: 16%;">Doctor</th>
              <th style="width: 12%;">Purpose</th>
              <th style="width: 11%;">Status</th>
              <th style="width: 5%; text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody id="ledger-table-body">
            <tr><td colspan="9" class="text-center label-bright py-4">Loading schedule...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* Never let error reporting become the error. Auth.html defines the real
   translator; if this partial is newer than Auth.html in the deployed project,
   this returns the raw message instead of throwing inside a handler and
   leaving the screen stuck on "Loading...". */
/* _crescExplain() lives in ScriptsMV.html now. Three byte-identical copies
   used to be declared here and in the other two ward screens; all three were
   globals, so only the last one parsed existed and the other two were dead
   weight that still had to be downloaded and parsed on every page load. */

// ============================================================================
// DOCTOR-SCOPED APPOINTMENTS LEDGER  (Phase 3)
// Backend: fetchDailyLedgerScoped / updateAppointmentStatus
// The booking modal lives in Modals.html — this file never renders it.
// Shared helpers (loadDoctorContext, crescDoctorOptions, crescEsc) come from Auth.html.
// ============================================================================

function apptToken(purpose, counters) {
  const isEmergency = String(purpose || '').toLowerCase().indexOf('emerg') !== -1;
  const c = isEmergency ? 'E' : 'A';
  return c + String(counters[c]++).padStart(2, '0');
}

// ---------------------------------------------------------------- INIT ----
function initAdminLedger() {
  document.getElementById('admin-ledger-date').value = new Date().toISOString().split('T')[0];

  window.loadDoctorContext(function (ctx) {
    const filter = document.getElementById('ledger-doctor-filter');

    // A doctor without cross-clinic rights gets no "All doctors" option:
    // the server would refuse it anyway, so do not offer it.
    filter.innerHTML = (ctx.locked ? '' : '<option value="">All doctors</option>') +
                       window.crescDoctorOptions('');

    if (ctx.locked && ctx.selfDoctorId) filter.value = ctx.selfDoctorId;
    filter.disabled = (ctx.locked && ctx.doctors.length <= 1);

    loadAdminLedger();
  });
}

function changeLedgerDate(days) {
  const input = document.getElementById('admin-ledger-date');
  const cur = new Date(input.value);
  cur.setDate(cur.getDate() + days);
  input.value = cur.toISOString().split('T')[0];
  loadAdminLedger();
}

// -------------------------------------------------------------- LEDGER ----
function loadAdminLedger() {
  const dateVal  = document.getElementById('admin-ledger-date').value;
  const doctorId = document.getElementById('ledger-doctor-filter').value || '';
  const tbody    = document.getElementById('ledger-table-body');

  if (!dateVal) return;

  // The scan claim is released automatically when the user navigates away, so
  // re-take it whenever this screen loads with scan mode still switched on.
  if (apptScanOn && window.CrescScan &&
      window.CrescScan.claimed() !== 'appt-arrive') {
    toggleApptScanMode(true);
  }

  tbody.innerHTML = '<tr><td colspan="9" class="text-center label-bright py-4">' +
                    '<i class="fa-solid fa-spinner fa-spin"></i> Loading schedule...</td></tr>';

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger py-4">' +
                          window.crescEsc(_crescExplain((res && res.message) || 'Could not load the ledger.')) +
                          '</td></tr>';
        setLedgerStats(0, 0, 0);
        return;
      }
      renderLedger(res.ledger || []);
    })
    .withFailureHandler(function (err) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger py-4">Network error: ' +
                        window.crescEsc(err.message) + '</td></tr>';
      setLedgerStats(0, 0, 0);
    })
    .fetchDailyLedgerScoped(dateVal, doctorId, window.sessionToken);
}

function setLedgerStats(b, a, c) {
  const set = function (id, v) { const el = document.getElementById(id); if (el) el.innerText = v; };
  set('stat-booked', b);
  set('stat-arrived', a);
  set('stat-completed', c);
}

function renderLedger(rows) {
  const tbody = document.getElementById('ledger-table-body');
  rows = rows.filter(function (r) { return r.status !== 'Cancelled'; });

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center label-bright py-5" style="opacity:.6;">' +
                      '<i class="fa-solid fa-calendar-xmark fa-2x d-block mb-2"></i>' +
                      'No appointments recorded for this date.</td></tr>';
    setLedgerStats(0, 0, 0);
    return;
  }

  let booked = 0, arrived = 0, completed = 0;
  const counters = { A: 1, E: 1 };
  let html = '';

  rows.forEach(function (r) {
    if (r.status === 'Booked') booked++;
    if (r.status === 'Arrived' || r.status === 'In-Progress') arrived++;
    if (r.status === 'Completed') completed++;

    const token = apptToken(r.purpose, counters);

    let badge = 'badge-booked';
    if (r.status === 'Arrived')     badge = 'badge-arrived';
    if (r.status === 'In-Progress') badge = 'badge-progress';
    if (r.status === 'Completed')   badge = 'badge-completed';

    const statusSel =
      '<select class="form-select form-select-sm select-badge ' + badge + '" ' +
      'style="width: 130px; cursor: pointer;" ' +
      'onchange="changeAppointmentStatus(\'' + window.crescEsc(r.apptId) + '\', this.value)">' +
      ['Booked', 'Arrived', 'In-Progress', 'Completed'].map(function (s) {
        const label = (s === 'Arrived') ? 'Arrived / Queue'
                    : (s === 'In-Progress' ? 'Consultation' : s);
        return '<option value="' + s + '"' + (r.status === s ? ' selected' : '') +
               ' style="background:var(--surface-2);">' + label + '</option>';
      }).join('') +
      '</select>';

    const pidLink =
      '<span class="text-info fw-bold" style="cursor:pointer; text-decoration:underline; text-underline-offset:2px;" ' +
      'onclick="routeToEMRTimeline(\'' + window.crescEsc(r.patientId) + '\')" title="View clinical history">' +
      window.crescEsc(r.patientId) + '</span>';

    html +=
      '<tr>' +
        '<td class="text-white-force fw-bold">' + window.crescEsc(r.time12) + '</td>' +
        '<td><span class="badge-token">' + token + '</span></td>' +
        '<td>' + pidLink + '</td>' +
        '<td class="fw-bold text-white">' + window.crescEsc(r.patientName || '-') + '</td>' +
        '<td class="text-white">' + window.crescEsc(r.age || '-') + ' / ' +
          window.crescEsc(String(r.sex || '-').charAt(0)) + '</td>' +
        '<td><span class="doc-chip text-white">' +
          window.crescEsc(r.doctorName || r.doctorId) + '</span></td>' +
        '<td class="label-bright small">' + window.crescEsc(r.purpose) + '</td>' +
        '<td>' + statusSel + '</td>' +
        '<td class="text-center"><button class="btn btn-sm btn-link text-danger p-0" title="Delete" ' +
          'onclick="cycleStatus(\'' + window.crescEsc(r.apptId) + '\', \'DELETE\', true)">' +
          '<i class="fa-solid fa-trash"></i></button></td>' +
      '</tr>';
  });

  tbody.innerHTML = html;
  setLedgerStats(booked, arrived, completed);
}

// ============================================================================
// SCAN → PATIENT ARRIVED
// ----------------------------------------------------------------------------
// Barcode_Router.html already resolves a scan and offers "Mark arrived" in its
// side panel. That is the right behaviour when a scan happens anywhere in the
// app. On the Daily Ledger it is one step too many: the receptionist is
// looking at today's list and wants the scan to just do it. CrescScan.claim()
// exists for exactly this — a screen takes over scan routing while it owns the
// task, and releases it on the way out.
// ============================================================================

var apptScanOn = false;

function apptScanStatus(msg, tone) {
  var el = document.getElementById('appt-scan-status');
  if (!el) return;
  el.textContent = msg;
  el.className = tone ? ('fw-bold text-' + tone) : '';
}

function toggleApptScanMode(force) {
  var want = (force === undefined) ? !apptScanOn : !!force;

  if (!window.CrescScan) {
    alert('The barcode scanner is not available in this deployment.');
    return;
  }

  var btn = document.getElementById('appt-scan-toggle');
  var banner = document.getElementById('appt-scan-banner');

  if (!want) {
    apptScanOn = false;
    try { window.CrescScan.release('appt-arrive'); } catch (e) {}
    if (banner) banner.classList.add('d-none');
    if (btn) btn.classList.replace('btn-warning', 'btn-outline-warning');
    return;
  }

  apptScanOn = true;
  if (banner) banner.classList.remove('d-none');
  if (btn) btn.classList.replace('btn-outline-warning', 'btn-warning');
  apptScanStatus('Scan a patient barcode to mark them arrived.');

  window.CrescScan.claim('appt-arrive', function (cls) {
    // Anything that is not a patient ID falls through to the normal router:
    // a tube barcode scanned here is a mis-scan, not an arrival.
    if (!cls || cls.type !== 'PATIENT') return false;
    markScannedPatientArrived(cls.value);
    return true;
  });
}

/**
 * Flips today's booking for one patient to Arrived.
 *
 * Resolving the scan first (rather than searching the rendered table) keeps
 * the decision on the server: it knows which of today's appointments belongs
 * to this patient, whether the caller's role may check anyone in, and it
 * audits the scan. The ledger on screen may be showing another date or
 * another doctor's filter entirely.
 */
function markScannedPatientArrived(patientId) {
  apptScanStatus('Looking up ' + patientId + '...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        apptScanStatus((res && res.message) || 'That code could not be resolved.', 'danger');
        return;
      }
      if (!res.found) {
        apptScanStatus(res.message || ('No patient registered with ID ' + patientId + '.'), 'danger');
        return;
      }

      var name = (res.patient && res.patient.name) || patientId;
      var appts = res.appointments || [];
      var booked = appts.filter(function (a) { return a.status === 'Booked'; });

      if (!booked.length) {
        var already = appts.filter(function (a) {
          return a.status === 'Arrived' || a.status === 'In-Progress';
        });
        apptScanStatus(already.length
          ? name + ' is already checked in.'
          : name + ' has no booking for today. Use Manual Booking.', 'danger');
        return;
      }

      // Earliest booking of the day: the one they have come for.
      var target = booked[0];
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) {
            apptScanStatus((r && r.message) || 'Could not update the appointment.', 'danger');
            return;
          }
          apptScanStatus(name + ' marked arrived (' + (target.time12 || 'today') + ').', 'success');
          loadAdminLedger();
        })
        .withFailureHandler(function (e) {
          apptScanStatus('Network error: ' + e.message, 'danger');
        })
        .barcodeUpdateAppointment(target.apptId, 'Arrived', window.sessionToken);
    })
    .withFailureHandler(function (e) {
      apptScanStatus('Lookup failed: ' + e.message, 'danger');
    })
    .resolveScan(patientId, 'tab-admin-appt', window.sessionToken);
}

function changeAppointmentStatus(apptId, newStatus) {
  google.script.run
    .withSuccessHandler(function (msg) {
      if (msg && msg !== 'Status updated!') alert(msg);
      loadAdminLedger();
    })
    .withFailureHandler(function (err) { alert('Could not update status: ' + err.message); })
    .updateAppointmentStatus(apptId, newStatus, window.sessionToken);
}

function cycleStatus(apptId, action, refresh) {
  if (action !== 'DELETE') return;
  if (!confirm('Delete this appointment?')) return;

  google.script.run
    .withSuccessHandler(function (msg) {
      if (msg && msg !== 'Status updated!') alert(msg);
      if (refresh) loadAdminLedger();
    })
    .withFailureHandler(function (err) { alert('Could not delete: ' + err.message); })
    .updateAppointmentStatus(apptId, 'DELETE', window.sessionToken);
}
</script>
