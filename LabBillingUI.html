<div id="lab-billing-workspace" class="page-section d-none">

  <div class="d-flex justify-content-between align-items-center mt-4 mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-outline-secondary py-1 px-3" onclick="switchTab('lab-workspace-view');"><i class="fa-solid fa-arrow-left me-1"></i>Back to Lab</button>
      <div>
        <h3 class="fw-bold m-0 text-white-force"><i class="fa-solid fa-receipt me-2" style="color:var(--success-fg);"></i>Lab Billing Desk
          <!-- A fixed, full-viewport scrim used to cover the WHOLE
               application - sidebar included - for the length of every call,
               including the routine reload after a bill. The work is
               announced here instead. -->
          <span class="cresc-busy-chip ms-2" id="lbOv" role="status" aria-live="polite" hidden>
            <span class="spinner-border" aria-hidden="true"></span>
            <span id="lbOvMsg">Loading…</span>
          </span>
        </h3>
        <div class="label-bright small" id="lbSub">Loading today's collections…</div>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="LabBill.load();" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
      <!-- The lab's own till, counted at the lab. See Cash_Drawer.html. -->
      <button class="btn btn-sm btn-outline-success" id="lb-drawer-btn"
              onclick="CrescDrawer.toggle('lb-drawer-host', 'Lab', 'lb-drawer-btn')"
              title="Open or close the lab counter's cash shift">
        <i class="fa-solid fa-cash-register"></i> Cash Drawer
      </button>
      <button class="btn btn-sm" style="background:var(--success-bg);border:1px solid var(--success);color:var(--success-fg);" onclick="LabBill.generateAndPrintDayReport();"><i class="fa-solid fa-print me-1"></i>Print Day Report</button>
    </div>
  </div>

  <div id="lb-drawer-host" class="d-none mb-4"></div>

  <div id="lbFlash"></div>

  <div class="row g-3 mb-4 row-cols-2 row-cols-md-5">
    <div class="col">
      <div class="lbKpi">
        <div class="lbKn" id="lbKpending">–</div>
        <div class="lbKl"><i class="fa-solid fa-hourglass-half me-1" style="color:var(--warning-fg);"></i>Pending Bills</div>
      </div>
    </div>
    <div class="col">
      <div class="lbKpi">
        <div class="lbKn" id="lbKtoday" style="color:var(--success-fg);">₹0</div>
        <div class="lbKl"><i class="fa-solid fa-coins me-1" style="color:var(--success-fg);"></i>Today Collection</div>
      </div>
    </div>
    <div class="col">
      <div class="lbKpi">
        <div class="lbKn" id="lbKcount">0</div>
        <div class="lbKl"><i class="fa-solid fa-receipt me-1" style="color:var(--teal-fg);"></i>Bills Raised Today</div>
      </div>
    </div>
    <!-- Everything still owed, whenever it was billed: the lab's share of the
         dashboard's Pending Credit. Click to list it. -->
    <div class="col">
      <div class="lbKpi" role="button" tabindex="0" onclick="LabBill.setTab('UNSETTLED')"
           onkeydown="if(event.key==='Enter')LabBill.setTab('UNSETTLED')" title="Show every unsettled lab bill">
        <div class="lbKn" id="lbKunsettled" style="color:var(--warning-fg);">–</div>
        <div class="lbKl"><i class="fa-solid fa-hand-holding-dollar me-1" style="color:var(--warning-fg);"></i>Unsettled · all dates</div>
        <div class="label-bright" style="font-size:.66rem;margin-top:2px;" id="lbKunsettledSplit">&nbsp;</div>
      </div>
    </div>
    <div class="col">
      <div class="lbKpi">
        <div class="lbKn" id="lbKip" style="color:var(--accent-fg);">–</div>
        <div class="lbKl"><i class="fa-solid fa-bed me-1" style="color:var(--accent-fg);"></i>IP On-Account today</div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 flex-wrap mb-3">
    <span class="lbTab on" id="lbTabPend" onclick="LabBill.setTab('PENDING')">⏳ Pending <span id="lbNpend" class="lbTN">0</span></span>
    <span class="lbTab" id="lbTabUnsettled" onclick="LabBill.setTab('UNSETTLED')">💳 Unsettled <span id="lbNunsettled" class="lbTN">0</span></span>
    <span class="lbTab" id="lbTabPaid" onclick="LabBill.setTab('PAID')">✅ Paid Today <span id="lbNpaid" class="lbTN">0</span></span>
    <span class="lbTab" id="lbTabIP" onclick="LabBill.setTab('IP')">🏥 IP Account <span id="lbNip" class="lbTN">0</span></span>
    <!-- The last week's cancellations; older ones leave the desk and are
         read back with "Find older cancellations" (labListCancelled). -->
    <span class="lbTab" id="lbTabCancel" onclick="LabBill.setTab('CANCELLED')">🚫 Cancelled <span id="lbNcancel" class="lbTN">0</span></span>
  </div>

  <div class="input-group mb-3" style="max-width:360px;">
    <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border-color);color:var(--text-muted);"><i class="fa-solid fa-search"></i></span>
    <input type="text" id="lbSearch" class="form-control form-control-sm" placeholder="Search patient, receipt, order…" oninput="LabBill.render();">
  </div>

  <div id="lbList"></div>

  <!-- Collecting what is owed on a bill. -->
  <div id="lbSettle" class="lbModal" hidden role="dialog" aria-modal="true" aria-labelledby="lbSettleTitle">
    <div class="lbModalCard">
      <div class="fw-bold mb-1" id="lbSettleTitle">Collect payment</div>
      <div class="label-bright small mb-3" id="lbSettleSub"></div>
      <label class="small fw-semibold label-bright" for="lbSettleAmt">Amount received (₹)</label>
      <input id="lbSettleAmt" type="number" min="0" step="0.01" class="form-control form-control-sm mb-2" inputmode="decimal">
      <label class="small fw-semibold label-bright" for="lbSettleMode">Paid by</label>
      <select id="lbSettleMode" class="form-select form-select-sm mb-2">
        <option value="CASH">Cash</option><option value="UPI">UPI</option>
        <option value="CARD">Card</option><option value="BANK">Bank transfer</option>
      </select>
      <label class="small fw-semibold label-bright" for="lbSettleNote">Note (optional)</label>
      <input id="lbSettleNote" class="form-control form-control-sm mb-3" placeholder="UPI reference, who paid…">
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="LabBill.closeSettle()">Cancel</button>
        <button class="btn btn-sm btn-success" id="lbSettleGo" onclick="LabBill.doSettle()">Record payment</button>
      </div>
    </div>
  </div>

</div>

<style>
.lbKpi{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px 16px;text-align:center;}
.lbKn{font-size:1.6rem;font-weight:800;color:var(--text-main);line-height:1;}
.lbKl{font-size:.67rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}
.lbTab{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-muted);border-radius:20px;padding:5px 14px;font-size:.78rem;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
.lbTab:hover{border-color:var(--border-hover);color:var(--text-main);}
.lbTab.on{background:var(--success-bg);border-color:var(--success);color:var(--success-fg);}
.lbTN{background:var(--surface-active);border-radius:10px;padding:0 7px;font-size:.67rem;font-weight:700;}
.lbCard{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:.18s;}
.lbCard:hover{border-color:var(--border-hover);}
.lbCard.PAID{border-left:3px solid var(--success);}
.lbCard.PENDING{border-left:3px solid var(--warning);}
.lbCard.IP{border-left:3px solid var(--accent-purple);}
.lbCard.UNSETTLED{border-left:3px solid var(--warning);}
.lbCard.CANCELLED{border-left:3px solid var(--danger);opacity:.85;}
.lbKpi[role=button]{cursor:pointer;}
.lbKpi[role=button]:hover,.lbKpi[role=button]:focus{border-color:var(--warning);outline:none;}
.lbModal{position:fixed;inset:0;z-index:3400;background:var(--overlay-scrim);display:flex;align-items:center;justify-content:center;}
.lbModal[hidden]{display:none!important;}
.lbModalCard{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:18px 20px;width:94%;max-width:380px;box-shadow:var(--shadow-lg);}
</style>

<script>
var LabBill=(function(){
  'use strict';

  var _bills=[], _stats={}, _tab='PENDING', _older=null, _settleBill=null;

  /* ─── UTILS ─── */
  function g(id){return document.getElementById(id);}
  function e(s){if(s==null)return '';return String(s).replace(/[&<>"'`=\/]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#x60;','=':'&#x3D;','/':'&#x2F;'}[c];});}
  /**
   * The clock time on a bill row.
   *
   * `new Date(b.billedAt).toLocaleTimeString()` printed "Invalid Date" in
   * the column whenever the stored timestamp was a day-first string, which
   * is most of them. crescParseDate (Auth.html) reads those.
   */
  function lbBillTime(v){
    if(!v) return '';
    var d = (typeof window.crescParseDate === 'function')
      ? window.crescParseDate(v) : new Date(v);
    if(!d || isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  }
  /* Counted, so two overlapping calls cannot clear each other's spinner. */
  var _lbBusy=0;
  function spin(m){_lbBusy++;var el=g('lbOv');if(el)el.hidden=false;if(g('lbOvMsg'))g('lbOvMsg').textContent=m||'Loading…';}
  function stop(){_lbBusy=Math.max(0,_lbBusy-1);if(_lbBusy)return;var el=g('lbOv');if(el)el.hidden=true;}
  function flash(msg,ok){
    var b=g('lbFlash');if(!b)return;
    b.innerHTML='<div class="d-flex align-items-center gap-2 px-3 py-2 rounded small mb-3" style="background:var(--bg-input);border:1px solid '+(ok?'var(--success)':'var(--danger)')+'"><i class="fa-solid '+(ok?'fa-circle-check text-success':'fa-circle-exclamation text-danger')+'"></i><span class="text-white-force flex-grow-1">'+e(msg)+'</span><span style="cursor:pointer;color:var(--text-muted);" onclick="this.parentNode.remove()">×</span></div>';
    if(ok)setTimeout(function(){if(g('lbFlash'))g('lbFlash').innerHTML='';},4000);
  }
  
  function run(fn, args, onOk, msg) {
    if (msg) spin(msg);
    var to = setTimeout(function() { stop(); flash('Server Timeout. Please retry.', false); }, 45000);
    
    var server = google.script.run
      .withSuccessHandler(function(res) { clearTimeout(to); stop(); onOk(res); })
      .withFailureHandler(function(err) { clearTimeout(to); stop(); flash('Error: ' + (err.message || err), false); });
    
    /* The session token goes on the END of every call — see the same note in
       LabModuleUI.html. Every lab billing endpoint is behind billing.read or
       billing.write now, and a call with no token is refused by the server. */
    var argv = (args || []).slice();
    var tok = window.sessionToken || '';
    if (argv.indexOf(tok) === -1) argv.push(tok);
    server[fn].apply(server, argv);
  }

  /* ─── LOAD ─── */
  function load(){
    // Re-read the lab till if it was left showing; see
    // CrescDrawer.onScreenOpen in Cash_Drawer.html.
    if (window.CrescDrawer) CrescDrawer.onScreenOpen('lb-drawer-host', 'Lab');
    run('getLabBillingWorkspace',[],function(res){
      if(!res||!res.success){flash((res&&res.message)||'Load failed.',false);return;}
      _bills=res.bills||[];
      _stats=res.stats||{};
      _kpis();
      _tabCounts();
      render();
      if(g('lbSub'))g('lbSub').innerHTML='Recent Activity · '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    },'Loading billing desk…');
  }

  function _kpis(){
    if(g('lbKpending'))g('lbKpending').textContent=_stats.pendingCount||0;
    if(g('lbKtoday'))g('lbKtoday').textContent='₹'+(Number(_stats.todayOP)||0).toFixed(0);
    if(g('lbKcount'))g('lbKcount').textContent=_stats.todayCount||0;
    if(g('lbKip'))g('lbKip').textContent='₹'+(Number(_stats.todayIP)||0).toFixed(0);
    if(g('lbKunsettled'))g('lbKunsettled').textContent='₹'+(Number(_stats.unsettledTotal)||0).toFixed(0);
    if(g('lbKunsettledSplit')){
      var parts=[];
      if(_stats.unsettledOP)parts.push('₹'+Number(_stats.unsettledOP).toFixed(0)+' OP');
      if(_stats.unsettledIP)parts.push('₹'+Number(_stats.unsettledIP).toFixed(0)+' IP');
      g('lbKunsettledSplit').textContent=parts.join(' · ')||'\u00a0';
    }
  }

  function _tabCounts(){
    var n=function(t){return _bills.filter(function(b){return b.tabType===t;}).length;};
    if(g('lbNpend'))g('lbNpend').textContent=n('PENDING');
    if(g('lbNpaid'))g('lbNpaid').textContent=n('PAID');
    if(g('lbNip'))g('lbNip').textContent=n('IP');
    if(g('lbNcancel'))g('lbNcancel').textContent=n('CANCELLED');
    if(g('lbNunsettled'))g('lbNunsettled').textContent=n('UNSETTLED');
  }

  var TABS=['PENDING','UNSETTLED','PAID','IP','CANCELLED'];
  var TAB_IDS=['lbTabPend','lbTabUnsettled','lbTabPaid','lbTabIP','lbTabCancel'];

  function setTab(t){
    _tab=t;
    if(t!=='CANCELLED')_older=null;
    TAB_IDS.forEach(function(id,i){
      var el=g(id);if(el)el.classList.toggle('on',TABS[i]===t);
    });
    render();
  }

  function render(){
    var h=g('lbList');if(!h)return;
    var q=((g('lbSearch')&&g('lbSearch').value)||'').toLowerCase().trim();
    var source=(_tab==='CANCELLED'&&_older)?_older:_bills;
    var list=source.filter(function(b){
      if(b.tabType!==_tab)return false;
      if(!q)return true;
      return(b.patientName+' '+b.orderId+' '+b.receiptNumber+' '+b.patientId+' '+(b.admissionId||'')).toLowerCase().indexOf(q)!==-1;
    });
    if(_tab==='UNSETTLED')list.sort(function(a,b){return (Number(b.balance)||0)-(Number(a.balance)||0);});
    // Cancellations older than a week have left the desk. They are kept, and
    // read back here on request.
    var cancelNote='';
    if(_tab==='CANCELLED'){
      cancelNote=_older
        ?'<div class="label-bright small mb-2">Showing every cancellation on record. '
          +'<a href="#" onclick="LabBill.hideOlder();return false;">Back to the last '+(_stats.cancelledDays||7)+' days</a></div>'
        :'<div class="label-bright small mb-2">The last '+(_stats.cancelledDays||7)+' days. '
          +(_stats.olderCancelled?_stats.olderCancelled+' older cancellation(s) are kept on record. ':'')
          +'<a href="#" onclick="LabBill.findOlder();return false;">Find older cancellations</a></div>';
    }
    if(!list.length){
      h.innerHTML=cancelNote+'<div class="text-center label-bright py-5"><i class="fa-solid fa-receipt fa-2x mb-3 d-block"></i>'
        +(_tab==='PENDING'?'No pending bills right now.'
          :_tab==='UNSETTLED'?'Nothing is owed on any lab bill.'
          :_tab==='PAID'?'No recent payments collected.'
          :_tab==='CANCELLED'?'Nothing cancelled in this period.'
          :'No recent IP account postings.')
        +'</div>';
      return;
    }
    h.innerHTML=cancelNote+list.map(_card).join('');
  }

  /* Older cancellations, read back on request. */
  function findOlder(){
    run('labListCancelled',[window.sessionToken||'',500],function(res){
      if(!res||!res.success){flash((res&&res.message)||'Could not read the cancellations.',false);return;}
      _older=(res.rows||[]).map(function(r){
        return {tabType:'CANCELLED',orderId:r.orderId,billId:r.kind==='BILL'?r.id:'',paymentMode:'',
                patientName:r.patientName||'Unknown',patientId:r.patientId||'',testNames:r.kind==='BILL'?'Voided bill':'Cancelled order',
                receiptNumber:r.kind==='BILL'?r.id:'',billedAt:String(r.at||''),net:Number(r.amount)||0,paid:0,balance:0,discount:0,
                cancelReason:r.reason||'',cancelledBy:r.by||''};
      });
      render();
    },'Reading older cancellations…');
  }
  function hideOlder(){_older=null;render();}

  /* Collecting what is owed. */
  function openSettle(billId){
    var b=_bills.filter(function(x){return x.billId===billId&&x.tabType==='UNSETTLED';})[0];
    if(!b)return;
    _settleBill=b;
    g('lbSettleSub').textContent=b.patientName+' · '+b.billId+' · owes ₹'+Number(b.balance).toFixed(2)+' of ₹'+Number(b.net).toFixed(2);
    g('lbSettleAmt').value=Number(b.balance).toFixed(2);
    g('lbSettleMode').value='CASH';
    g('lbSettleNote').value='';
    g('lbSettle').hidden=false;
    g('lbSettleAmt').focus();g('lbSettleAmt').select();
  }
  function closeSettle(){g('lbSettle').hidden=true;_settleBill=null;}
  function doSettle(){
    if(!_settleBill)return;
    var amt=Number(g('lbSettleAmt').value);
    if(!(amt>0)){flash('Enter the amount received.',false);return;}
    var btn=g('lbSettleGo');btn.disabled=true;
    run('settleLabBillBalance',[{billId:_settleBill.billId,amount:amt,payMode:g('lbSettleMode').value,note:g('lbSettleNote').value.trim()}],function(res){
      btn.disabled=false;
      if(!res||!res.success){flash((res&&res.message)||'Could not record the payment.',false);return;}
      closeSettle();flash(res.message,true);load();
    },'Recording payment…');
  }
  document.addEventListener('keydown',function(ev){
    var m=g('lbSettle');if(!m||m.hidden)return;
    if(ev.key==='Escape'){ev.preventDefault();closeSettle();}
    else if(ev.key==='Enter'&&ev.target&&ev.target.tagName!=='BUTTON'){ev.preventDefault();doSettle();}
  });

  function _card(b){
    var payIcon=b.paymentMode==='CASH'?'💵':b.paymentMode==='UPI'?'📱':b.paymentMode==='CARD'?'💳':b.paymentMode==='IP_ACCOUNT'?'🏥':'💰';
    var CHIP='font-size:.67rem;font-weight:700;padding:2px 8px;border-radius:12px;';
    var statusBadge=b.tabType==='PENDING'
      ?'<span style="'+CHIP+'background:var(--warning-bg);color:var(--warning-fg);border:1px solid var(--warning);">PENDING</span>'
      :b.tabType==='IP'
      ?'<span style="'+CHIP+'background:var(--accent-glow);color:var(--accent-fg);border:1px solid var(--accent-purple);">IP ACCOUNT</span>'
      :b.tabType==='CANCELLED'
      ?'<span style="'+CHIP+'background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger);">CANCELLED</span>'
      :b.tabType==='UNSETTLED'
      ?'<span style="'+CHIP+'background:var(--warning-bg);color:var(--warning-fg);border:1px solid var(--warning);">'+(b.isIP?'IP · SETTLES AT DISCHARGE':(Number(b.paid)>0?'PART-PAID':'UNPAID'))+'</span>'
      :(Number(b.balance)>0
        ?'<span style="'+CHIP+'background:var(--warning-bg);color:var(--warning-fg);border:1px solid var(--warning);">PART-PAID</span>'
        :'<span style="'+CHIP+'background:var(--success-bg);color:var(--success-fg);border:1px solid var(--success);">PAID</span>');

    var actions='';
    if(b.tabType==='CANCELLED'){
      // Nothing to do to a cancellation. The reason is the record.
      actions='';
    } else if(b.tabType==='UNSETTLED'){
      actions=b.isIP
        ?'<div class="label-bright" style="font-size:.7rem;">On '+e(b.admissionId||'the IP account')+'</div>'
        :'<button class="btn btn-sm fw-semibold ms-2" style="font-size:.75rem;background:var(--success-bg);border:1px solid var(--success);color:var(--success-fg);" onclick="event.stopPropagation(); LabBill.openSettle(\''+e(b.billId)+'\')"><i class="fa-solid fa-hand-holding-dollar me-1"></i>Collect</button>';
    } else if(b.tabType==='PENDING'){
      actions='<button class="btn btn-sm fw-semibold ms-2" style="font-size:.75rem;background:var(--success-bg);border:1px solid var(--success);color:var(--success-fg);" onclick="LabBill.openOrder(\''+e(b.orderId)+'\')"><i class="fa-solid fa-arrow-right me-1"></i>Process</button>'
        +'<button class="btn btn-sm ms-1" style="font-size:.75rem;border:1px solid var(--danger);color:var(--danger-fg);background:transparent;" title="Cancel this order" onclick="event.stopPropagation(); LabBill.cancelOrder(\''+e(b.orderId)+'\',\''+e(b.patientName).replace(/\'/g,"\\\'")+'\')"><i class="fa-solid fa-ban"></i></button>';
    } else {
      actions=
        '<button class="btn btn-sm ms-1" style="font-size:.75rem;border:1px solid var(--success);color:var(--success-fg);background:var(--success-bg);" onclick="event.stopPropagation(); LabBill.waInvoice(\''+e(b.billId)+'\', \''+e(b.patientName).replace(/'/g,"\\'")+'\')" title="Send via WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>' +
        '<button class="btn btn-sm ms-1" style="font-size:.75rem;border:1px solid var(--blue);color:var(--blue-fg);background:var(--blue-bg);" onclick="event.stopPropagation(); LabBill.emailInvoice(\''+e(b.billId)+'\')" title="Email Invoice"><i class="fa-solid fa-envelope"></i></button>' +
        '<button class="btn btn-sm ms-1" style="font-size:.75rem;border:1px solid var(--border-color);color:var(--text-muted);background:transparent;" onclick="event.stopPropagation(); LabBill.printReceiptDirectly(\''+e(b.billId)+'\')"><i class="fa-solid fa-print me-1"></i>Receipt</button>' +
        '<button class="btn btn-sm ms-1" style="font-size:.75rem;border:1px solid var(--danger);color:var(--danger-fg);background:transparent;" title="Cancel / void this bill" onclick="event.stopPropagation(); LabBill.cancelBill(\''+e(b.billId)+'\',\''+e(b.patientName).replace(/\'/g,"\\\'")+'\','+(Number(b.net)||0)+')"><i class="fa-solid fa-ban"></i></button>';
    }

    return '<div class="lbCard '+(b.tabType||'')+'">'
      +'<div style="width:38px;height:38px;border-radius:10px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;">'+payIcon+'</div>'
      +'<div class="flex-grow-1" style="min-width:0;">'
        +'<div class="d-flex align-items-center gap-2 flex-wrap">'
          +'<span class="text-white-force fw-bold">'+e(b.patientName)+'</span>'
          +'<span class="label-bright" style="font-size:.72rem;">'+e(b.patientId)+'</span>'
          +statusBadge
        +'</div>'
        +'<div class="label-bright mt-1" style="font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px;"><i class="fa-solid fa-flask me-1" style="font-size:.63rem;"></i>'+e(b.testNames)+'</div>'
        +'<div class="d-flex gap-3 mt-1 flex-wrap">'
          +(b.receiptNumber?'<span class="label-bright" style="font-size:.67rem;font-family:monospace;">'+e(b.receiptNumber)+'</span>':'')
          +'<span class="label-bright" style="font-size:.67rem;">'+e(b.billedAt?b.billedAt.substring(0,16):'')+'</span>'
          +(b.paymentMode&&b.tabType!=='PENDING'&&b.tabType!=='CANCELLED'?'<span class="label-bright" style="font-size:.67rem;">'+payIcon+' '+e(b.paymentMode)+'</span>':'')
        +'</div>'
        +(b.tabType==='CANCELLED'&&b.cancelReason
          ?'<div class="mt-1" style="font-size:.7rem;color:var(--danger-fg);"><i class="fa-solid fa-ban me-1"></i>'
            +e(b.cancelReason)+(b.cancelledBy?' <span class="label-bright">— '+e(b.cancelledBy)+'</span>':'')+'</div>'
          :'')
      +'</div>'
      +'<div class="text-end flex-shrink-0">'
        +(b.tabType==='UNSETTLED'
          ?'<div style="font-size:1.1rem;font-weight:800;color:var(--warning-fg);">₹'+Number(b.balance).toFixed(2)+'</div>'
            +'<div class="label-bright" style="font-size:.67rem;">owed of ₹'+Number(b.net).toFixed(2)+(Number(b.paid)>0?' · ₹'+Number(b.paid).toFixed(2)+' paid':'')+'</div>'
          :'<div style="font-size:1.1rem;font-weight:800;color:'+(b.tabType==='IP'?'var(--accent-fg)':b.tabType==='PAID'?'var(--success-fg)':'var(--warning-fg)')+';">₹'+Number(b.net).toFixed(2)+'</div>'
            +(b.tabType==='PAID'&&Number(b.balance)>0?'<div class="label-bright" style="font-size:.67rem;">₹'+Number(b.balance).toFixed(2)+' still owed</div>':''))
        +(b.discount>0?'<div class="label-bright" style="font-size:.67rem;">Disc: ₹'+Number(b.discount).toFixed(0)+'</div>':'')
        +actions
      +'</div>'
      +'</div>';
  }

  function openOrder(orderId){
    if(typeof switchTab !== 'undefined') switchTab('lab-workspace-view');
    if(typeof LabX!=='undefined')setTimeout(function(){LabX.openPanel(orderId);},300);
  }

  /* 🚀 THE NATIVE POP-UP PRINT ENGINE 🚀 */
  
  function printReceiptDirectly(billId){
    run('getLabReceiptHtml',[billId],function(res){
      if(!res||!res.success){flash((res&&res.message)||'Receipt not found.',false);return;}
      _triggerNativePrint(res.html);
    },'Preparing receipt for printing…');
  }

  /* 🚀 WHATSAPP & EMAIL INVOICE DISPATCH 🚀 */
  function waInvoice(billId, patientName) {
    crescPrompt("Enter 10-digit WhatsApp number for " + patientName + "\n(Do not add country code):", "",
                { title: 'Send invoice on WhatsApp', okLabel: 'Continue' })
      .then(function (mobile) {
        if (!mobile || mobile.trim().length < 10) return;
        waInvoiceGo(billId, patientName, mobile);
      });
  }

  function waInvoiceGo(billId, patientName, mobile) {
    run('generateAndStoreLabInvoicePDF', [billId], function(res) {
      if (!res || !res.success) {
        if (window.crescConsentGate && window.crescConsentGate(res, function () {
              waInvoiceGo(billId, patientName, mobile);
            })) return;
        flash((res && res.message) || 'Failed to generate PDF.', false);
        return;
      }
      
      var text = "Hello " + patientName + ",%0A%0AThank you for visiting Crescentia Clinic. Your laboratory payment receipt is ready.%0A%0AYou can securely view and download your invoice here:%0A" + encodeURIComponent(res.link) + "%0A%0AWe wish you the best of health!%0A- Crescentia Billing Desk";
      
      var waUrl = "https://wa.me/91" + mobile.trim().replace(/\D/g,'') + "?text=" + text;
      var w = window.open(waUrl, '_blank');
      if(w) flash('Opening WhatsApp Web...', true);
      else flash('Pop-up blocked. Allow pop-ups to open WhatsApp.', false);
    }, 'Generating Secure PDF for WhatsApp...');
  }

  function emailInvoice(billId) {
    crescPrompt("Enter patient's email address:", "",
                { title: 'Email invoice', okLabel: 'Send' })
      .then(function (email) {
        if (!email || email.trim() === "") return;
        emailInvoiceGo(billId, email);
      });
  }

  function emailInvoiceGo(billId, email) {
    run('emailLabInvoicePDF', [billId, email.trim()], function(res) {
      if (res && res.success) { flash(res.message, true); } 
      else { flash((res && res.message) || 'Failed to send email.', false); }
    }, 'Dispatching Premium HTML Email...');
  }

  function generateAndPrintDayReport(){
    run('getLabDailyCollection',[],function(res){
      if(!res||!res.success){flash((res&&res.message)||'Failed.',false);return;}
      var html = _buildPremiumDayHtml(res);
      _triggerNativePrint(html);
    },'Compiling Daily Report…');
  }

  function _triggerNativePrint(htmlString) {
    var printWindow = window.open('', '_blank', 'width=900,height=800,top=50,left=50');
    if (!printWindow) { crescAlert("Pop-up blocker is preventing printing. Please click 'Allow Pop-ups' in your URL bar."); return; }
    printWindow.document.open(); printWindow.document.write(htmlString); printWindow.document.close();
    printWindow.focus();
    setTimeout(function() { printWindow.print(); }, 500);
  }

  function _buildPremiumDayHtml(res){
    var bills = res.bills || [];
    var todayStr = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var cashTotal=0, upiTotal=0, cardTotal=0, ipTotal=0;
    
    // Money TAKEN: an OP bill counts what was paid, not what was billed, and
    // today's collections on older bills are added as their own lines.
    bills = bills.map(function(b){ return Object.assign({}, b, { net: b.isIP ? b.net : (Number(b.paid) || 0) }); })
      .concat((res.settlements || []).map(function(s){
        return { receiptNumber: s.billId, billId: s.billId, patientName: 'Balance collected', testNames: 'Earlier bill ' + s.billId,
                 paymentMode: s.mode, billedAt: s.at, net: s.amount };
      }));
    bills.forEach(function(b){
      var n = Number(b.net) || 0;
      if(b.paymentMode === 'CASH') cashTotal += n;
      else if(b.paymentMode === 'UPI') upiTotal += n;
      else if(b.paymentMode === 'CARD') cardTotal += n;
      else if(b.paymentMode === 'IP_ACCOUNT' || b.paymentMode === 'ON_ACCOUNT') ipTotal += n;
    });

    var rows = bills.map(function(b, index){
      return `
        <tr>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; color: var(--text-faint);">${index + 1}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; font-family: monospace;">${b.receiptNumber || b.billId}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 600;">${b.patientName}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; color: var(--text-faint);">${b.testNames}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; text-align: center;">${b.paymentMode}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; text-align: right;">${lbBillTime(b.billedAt)}</td>
          <td style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: bold; text-align: right;">₹${Number(b.net).toFixed(2)}</td>
        </tr>
      `;
    }).join('');

    return `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>Daily Collection Report</title>
        <style>
          body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--text-main); padding: 30px; margin: 0; background: var(--bg-card); }
          .header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 30px; }
          .title { font-size: 24px; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; }
          .subtitle { font-size: 14px; color: var(--text-faint); margin-top: 5px; }
          .kpi-grid { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 30px; }
          .kpi-box { flex: 1; padding: 15px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; text-align: center; }
          .kpi-box .val { font-size: 20px; font-weight: bold; color: var(--text-main); }
          .kpi-box .lbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; margin-top: 5px; font-weight: 600; }
          table { width: 100%; border-collapse: collapse; }
          th { background: var(--bg-input); padding: 10px 8px; text-align: left; font-size: 12px; text-transform: uppercase; color: var(--text-faint); border-bottom: 2px solid var(--border-color); }
          .footer { margin-top: 50px; font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 15px; }
          @media print { body { padding: 0; margin: 0; } @page { size: A4 portrait; margin: 1cm; } }
        </style>
      </head>
      <body>
        <div class="header">
          <div class="title">Crescentia HealthTech</div>
          <div class="subtitle">Laboratory Daily Collection Report &bull; ${todayStr}</div>
        </div>
        <div class="kpi-grid">
          <div class="kpi-box"><div class="val">₹${cashTotal.toFixed(2)}</div><div class="lbl">CASH IN DRAWER</div></div>
          <div class="kpi-box"><div class="val">₹${upiTotal.toFixed(2)}</div><div class="lbl">UPI PAYMENTS</div></div>
          <div class="kpi-box"><div class="val">₹${cardTotal.toFixed(2)}</div><div class="lbl">CARD PAYMENTS</div></div>
          <div class="kpi-box"><div class="val" style="color:var(--accent-fg);">₹${ipTotal.toFixed(2)}</div><div class="lbl">IP ON-ACCOUNT</div></div>
          <div class="kpi-box" style="background:var(--success); border-color:var(--success);"><div class="val" style="color:var(--success-fg);">₹${Number(res.totalNet).toFixed(2)}</div><div class="lbl">TOTAL OP REVENUE</div></div>
        </div>
        <table>
          <thead>
            <tr><th>#</th><th>Receipt No.</th><th>Patient Name</th><th>Investigations</th><th style="text-align:center;">Mode</th><th style="text-align:right;">Time</th><th style="text-align:right;">Amount</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="footer"><div>Generated by: Crescentia EMR System</div><div>Page 1 of 1</div></div>
      </body>
      </html>
    `;
  }

  /* ─── CANCELLING ───────────────────────────────────────────────────────
     Two different acts, kept apart on purpose.

       CANCEL AN ORDER — nothing has been taken. The request is withdrawn
                         and the order leaves the pending queue.

       VOID A BILL     — money HAS been taken, or posted to an IP account.
                         The bill is reversed, the income drops out of the
                         Finance Hub, and the order goes back to the queue so
                         it can be billed correctly, which is normally why.

     Both demand a reason of at least a few words, and the server refuses
     anything shorter. That text is the whole of what anyone reviewing this
     in three months will have. */

  function _askReason(title, body, okLabel, then){
    crescPrompt(body, '', { title: title, okLabel: okLabel })
      .then(function(reason){
        if(reason === null || reason === undefined) return;   // dismissed
        var r = String(reason).trim();
        if(r.length < 10){
          flash('Give a reason of at least a few words — it is the only ' +
                'explanation anyone reviewing this will have.', false);
          return;
        }
        then(r);
      });
  }

  function cancelOrder(orderId, patientName){
    _askReason(
      'Cancel lab order',
      'Cancel the pending lab order for ' + patientName + ' (' + orderId + ')?\n\n' +
      'Nothing has been billed, so no money is involved. Why is it being cancelled?',
      'Cancel order',
      function(reason){
        run('labCancelPendingOrder', [{ orderId: orderId, reason: reason }, window.sessionToken],
          function(res){
            if(!res || !res.success){ flash((res && res.message) || 'Could not cancel.', false); return; }
            flash(res.message, true);
            load();
          }, 'Cancelling order…');
      });
  }

  function cancelBill(billId, patientName, net){
    _askReason(
      'Cancel / void bill',
      'Void bill ' + billId + ' for ' + patientName + ' (₹' + (Number(net)||0).toFixed(2) + ')?\n\n' +
      'The bill stays on record marked cancelled, the amount leaves the day\u2019s ' +
      'collection, and the order returns to the pending queue. Cash is NOT taken ' +
      'out of the drawer for you. Why is it being voided?',
      'Void bill',
      function(reason){
        run('labCancelBill', [{ billId: billId, reason: reason }, window.sessionToken],
          function(res){
            if(!res || !res.success){ flash((res && res.message) || 'Could not void the bill.', false); return; }
            flash(res.message, true);
            load();
          }, 'Voiding bill…');
      });
  }

  return{
    load:load, render:render, setTab:setTab, openOrder:openOrder, 
    printReceiptDirectly:printReceiptDirectly, generateAndPrintDayReport:generateAndPrintDayReport,
    waInvoice:waInvoice, emailInvoice:emailInvoice,
    cancelOrder:cancelOrder, cancelBill:cancelBill,
    openSettle:openSettle, closeSettle:closeSettle, doSettle:doSettle,
    findOlder:findOlder, hideOlder:hideOlder
  };
})();
</script>
