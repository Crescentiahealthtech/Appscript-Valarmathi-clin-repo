<!-- ===================================================================== -->
<!-- 💸 CRESCENTIA — PAYABLES (vendor / doctor / payroll).                  -->
<!-- Mount: <div id="workspace-accounts-payables" class="page-section       -->
<!--   d-none"><div id="acc-pay-root"></div></div>                         -->
<!-- Register 'workspace-accounts-payables' in AccX.PAGES; openPayables().  -->
<!-- Needs Payables.js. -->
<!-- ===================================================================== -->
<script>
const AccPay = (function () {
  const $ = (id) => document.getElementById(id);
  const inr = (n) => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const who = () => (window.currentUser || window.loggedInUser || window.userName || 'STAFF');
  const num = (id) => { const e = $(id); return Number(e && e.value !== '' ? e.value : 0) || 0; };
  const val = (id) => { const e = $(id); return e ? e.value : ''; };
  let FILTER = 'ALL';

  function toast(m, ok) { const t = document.createElement('div'); t.className = 'position-fixed bottom-0 end-0 m-4 px-4 py-3 rounded-3 shadow text-white toast-solid'; t.style.zIndex = 4000; t.style.background = ok ? 'var(--success)' : 'var(--danger)'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }

  function load() {
    const root = $('acc-pay-root'); if (!root) return;
    root.innerHTML = '<div class="text-center text-body-secondary py-5"><i class="fas fa-circle-notch fa-spin me-2"></i>Loading payables…</div>';
    google.script.run
      .withSuccessHandler(function (res) { if (!res || !res.success) { root.innerHTML = '<div class="text-danger text-center py-5">' + esc((res && res.message) || 'Failed.') + '</div>'; return; } render(res); })
      .withFailureHandler(function (e) { root.innerHTML = '<div class="text-danger text-center py-5">' + esc(e.message || 'Server error — Payables.js deployed?') + '</div>'; })
      .getPayables(FILTER);
  }

  function render(res) {
    const s = res.summary, root = $('acc-pay-root');
    root.innerHTML =
      // summary
      '<div class="row g-3 mb-3">' +
        kpi('Total Pending', s.totalPending, 'text-warning-emphasis') +
        kpi('Overdue', s.overdue, 'text-danger-emphasis') +
        kpi('Due This Week', s.dueWeek, 'text-info-emphasis') +
      '</div>' +
      // record form
      '<div class="card border bg-body-tertiary mb-3"><div class="card-body">' +
        '<h6 class="fw-bold mb-2">Record an Expense / Payable</h6>' +
        '<div class="row g-2 align-items-end">' +
          '<div class="col-md-2"><label class="form-label small text-body-secondary mb-1">Type</label><select id="pay-type" class="form-select form-select-sm" onchange="AccPay.typeChange()"><option value="VENDOR">Vendor</option><option value="DOCTOR">Doctor Payout</option><option value="PAYROLL">Payroll</option><option value="PETTY">Petty Cash</option><option value="REFUND">Refund</option><option value="EXPENSE">Other Expense</option></select></div>' +
          '<div class="col-md-3"><label class="form-label small text-body-secondary mb-1" id="pay-name-lbl">Vendor Name</label><input id="pay-name" class="form-control form-control-sm" placeholder="Name"></div>' +
          '<div class="col-md-2" id="pay-ref-wrap"><label class="form-label small text-body-secondary mb-1" id="pay-ref-lbl">Invoice Ref</label><input id="pay-ref" class="form-control form-control-sm" placeholder="Ref"></div>' +
          '<div class="col-md-2" id="pay-month-wrap" style="display:none"><label class="form-label small text-body-secondary mb-1">Payroll Month</label><input id="pay-month" type="month" class="form-control form-control-sm"></div>' +
          '<div class="col-md-2" id="pay-drawer-wrap" style="display:none"><label class="form-label small text-body-secondary mb-1">Drawer</label><select id="pay-drawer" class="form-select form-select-sm"><option>Reception</option><option>Pharmacy</option><option>Lab</option></select></div>' +
          '<div class="col-md-2"><label class="form-label small text-body-secondary mb-1">Amount (₹)</label><input id="pay-amt" type="number" min="0" class="form-control form-control-sm" placeholder="0"></div>' +
          '<div class="col-md-2" id="pay-gst-wrap"><label class="form-label small text-body-secondary mb-1">GST In (₹)</label><input id="pay-gst" type="number" min="0" class="form-control form-control-sm" placeholder="0"></div>' +
          '<div class="col-md-2" id="pay-due-wrap"><label class="form-label small text-body-secondary mb-1">Due Date</label><input id="pay-due" type="date" class="form-control form-control-sm"></div>' +
          '<div class="col-md-2"><label class="form-label small text-body-secondary mb-1">Pay Mode</label><select id="pay-mode" class="form-select form-select-sm"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank</option></select></div>' +
          '<div class="col-12"><input id="pay-notes" class="form-control form-control-sm" placeholder="Notes (optional)"></div>' +
          '<div class="col-12 d-flex gap-2 justify-content-end"><button class="btn btn-outline-secondary btn-sm fw-semibold" onclick="AccPay.record(false)">Add to Queue</button>' +
          '<button class="btn btn-primary btn-sm fw-semibold" onclick="AccPay.record(true)">Record &amp; Pay Now</button></div>' +
        '</div></div></div>' +
      // filter tabs
      '<div class="d-flex gap-2 mb-2 flex-wrap">' + ['ALL', 'VENDOR', 'DOCTOR', 'PAYROLL'].map(t =>
        '<button class="btn btn-sm rounded-pill ' + (FILTER === t ? 'btn-primary' : 'btn-outline-primary') + '" onclick="AccPay.filter(\'' + t + '\')">' + (t === 'ALL' ? 'All' : t.charAt(0) + t.slice(1).toLowerCase()) + '</button>').join('') + '</div>' +
      // open queue
      '<div class="card border bg-body-tertiary mb-3"><div class="card-body"><h6 class="fw-bold mb-2">Pending Queue</h6>' +
        '<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr>' +
        th('Entity') + th('Name') + th('Ref') + th('Total', 1) + th('Paid', 1) + th('Pending', 1) + th('Due') + th('Status') + th('') +
        '</tr></thead><tbody>' + queueRows(res.open) + '</tbody></table></div></div></div>' +
      // recent paid
      (res.paidRecent.length ? '<div class="card border bg-body-tertiary"><div class="card-body"><h6 class="fw-bold mb-2">Recently Settled</h6><div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr>' +
        th('Entity') + th('Name') + th('Ref') + th('Total', 1) + '</tr></thead><tbody>' +
        res.paidRecent.map(r => '<tr><td class="small">' + esc(r.entity) + '</td><td class="small">' + esc(r.name) + '</td><td class="small text-body-secondary">' + esc(r.ref) + '</td><td class="text-end small">' + inr(r.total) + '</td></tr>').join('') +
        '</tbody></table></div></div></div>' : '') +
      '<div id="acc-pay-modal"></div>';
    typeChange();
  }

  function kpi(label, value, cls) {
    return '<div class="col-md-4"><div class="card border bg-body-tertiary h-100"><div class="card-body py-2"><div class="small text-uppercase text-body-secondary">' + label + '</div><h4 class="fw-bold mb-0 ' + cls + '">' + inr(value) + '</h4></div></div></div>';
  }
  const th = (t, r) => '<th class="small text-uppercase text-body-secondary' + (r ? ' text-end' : '') + '">' + t + '</th>';

  function queueRows(rows) {
    if (!rows.length) return '<tr><td colspan="9" class="text-center text-body-secondary py-4">Nothing pending. 🎉</td></tr>';
    return rows.map(function (r) {
      const due = r.overdueDays > 0 ? '<span class="text-danger-emphasis fw-semibold">' + esc(r.due) + ' · ' + r.overdueDays + 'd</span>' : esc(r.due || '—');
      const badge = r.status === 'PARTIAL' ? '<span class="badge text-bg-info">PARTIAL</span>' : '<span class="badge text-bg-warning">PENDING</span>';
      return '<tr><td class="small">' + esc(r.entity) + '</td><td class="small fw-semibold">' + esc(r.name) + '</td><td class="small text-body-secondary">' + esc(r.ref) + '</td>' +
        '<td class="text-end small">' + inr(r.total) + '</td><td class="text-end small text-body-secondary">' + inr(r.paid) + '</td><td class="text-end small fw-semibold">' + inr(r.pending) + '</td>' +
        '<td class="small">' + due + '</td><td>' + badge + '</td>' +
        '<td><button class="btn btn-sm btn-success py-0" onclick="AccPay.payModal(\'' + esc(r.id) + '\',\'' + esc(r.name) + '\',' + r.pending + ')">Pay</button></td></tr>';
    }).join('');
  }

  function typeChange() {
    const t = val('pay-type');
    const lbl = { VENDOR: 'Vendor Name', DOCTOR: 'Doctor Name', PAYROLL: 'Payroll Run', PETTY: 'Purpose', REFUND: 'Refund To (Patient)', EXPENSE: 'Paid To / Purpose' };
    $('pay-name-lbl').innerText = lbl[t] || 'Name';
    const showVendor = (t === 'VENDOR');
    $('pay-gst-wrap').style.display = showVendor ? '' : 'none';
    $('pay-due-wrap').style.display = (t === 'VENDOR' || t === 'DOCTOR') ? '' : 'none';
    $('pay-ref-wrap').style.display = (t === 'PAYROLL') ? 'none' : '';
    $('pay-month-wrap').style.display = (t === 'PAYROLL') ? '' : 'none';
    $('pay-drawer-wrap').style.display = (t === 'PETTY') ? '' : 'none';
  }
  function filter(t) { FILTER = t; load(); }

  function record(payNow) {
    const t = val('pay-type');
    if (!val('pay-name').trim()) { toast('Enter a name / purpose.', false); return; }
    if (num('pay-amt') <= 0) { toast('Enter an amount.', false); return; }
    const ref = (t === 'PAYROLL') ? val('pay-month') : val('pay-ref');
    google.script.run
      .withSuccessHandler(function (res) { toast(res.message, !!res.success); if (res.success) load(); })
      .withFailureHandler(function (e) { toast(e.message || 'Server error.', false); })
      .recordPayable({ entityType: t, name: val('pay-name'), invoiceRef: ref, amount: num('pay-amt'), gstInput: num('pay-gst'), dueDate: val('pay-due'), drawer: val('pay-drawer'), notes: val('pay-notes'), payNow: payNow, payMode: val('pay-mode'), user: who() });
  }

  function payModal(id, name, pending) {
    $('acc-pay-modal').innerHTML = '<div class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background:var(--overlay-scrim);z-index:3500" onclick="if(event.target===this)AccPay.closeModal()">' +
      '<div class="card bg-body border shadow" style="width:min(420px,92vw)"><div class="card-body">' +
      '<div class="d-flex justify-content-between mb-2"><h5 class="fw-bold mb-0 text-body">Pay · ' + esc(name) + '</h5><button class="btn-close" onclick="AccPay.closeModal()"></button></div>' +
      '<label class="form-label small text-body-secondary mb-1">Amount (pending ' + inr(pending) + ')</label>' +
      '<input id="pay-pay-amt" type="number" min="0" max="' + pending + '" class="form-control mb-2" value="' + pending + '">' +
      '<label class="form-label small text-body-secondary mb-1">Pay By</label>' +
      '<select id="pay-pay-mode" class="form-select mb-2"><option>Bank</option><option>Cash</option><option>UPI</option><option>Card</option></select>' +
      '<input id="pay-pay-notes" class="form-control mb-3" placeholder="Notes (optional)">' +
      '<button class="btn btn-success w-100 fw-bold" onclick="AccPay.pay(\'' + esc(id) + '\')">Confirm Payment</button>' +
      '</div></div></div>';
  }
  function closeModal() { $('acc-pay-modal').innerHTML = ''; }
  function pay(id) {
    const amt = num('pay-pay-amt'); if (amt <= 0) { toast('Enter amount.', false); return; }
    google.script.run
      .withSuccessHandler(function (res) { toast(res.message, !!res.success); if (res.success) { closeModal(); load(); } })
      .withFailureHandler(function (e) { toast(e.message || 'Server error.', false); })
      .payPayable({ payableId: id, amount: amt, payMode: val('pay-pay-mode'), notes: val('pay-pay-notes'), user: who() });
  }

  return { load, filter, typeChange, record, payModal, closeModal, pay };
})();

function openPayables() { if (typeof switchAccountsPage === 'function') switchAccountsPage('workspace-accounts-payables'); AccPay.load(); }
(function () { if (window.__accPayWired) return; var o = window.switchAccountsPage; window.switchAccountsPage = function (p) { if (typeof o === 'function') o(p); if (p === 'workspace-accounts-payables') { try { AccPay.load(); } catch (e) {} } }; window.__accPayWired = true; })();
</script>
