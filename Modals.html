
<div id="admin-book-modal" class="d-none" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1050; display: flex; align-items: center; justify-content: center;">
  <div class="card p-4 border-secondary shadow-lg" style="width: 90%; max-width: 500px; background-color: var(--bg-card); max-height: 90vh; overflow-y: auto;">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
      <h5 class="fw-bold text-white m-0"><i class="fa-solid fa-calendar-plus text-success me-2"></i> Manual Booking</h5>
      <button class="btn-close btn-close-white" onclick="closeAdminBookModal()"></button>
    </div>
    
    <div class="mb-3">
      <label class="label-bright small mb-1">Patient ID (Leave blank for Walk-in)</label>
      <div class="input-group">
        <input type="text" id="ab-id" class="form-control text-white-force border-secondary" placeholder="e.g. LMTVS0001">
        <button class="btn btn-outline-info" onclick="autoFetchPatient()">Fetch Details</button>
      </div>
    </div>
    
    <div class="mb-3">
      <label class="label-bright small mb-1">Patient Name *</label>
      <input type="text" id="ab-name" class="form-control text-white-force border-secondary">
    </div>
    
    <div class="row g-2 mb-3">
      <div class="col-6"><label class="label-bright small mb-1">Age</label><input type="text" id="ab-age" class="form-control text-white-force border-secondary"></div>
      <div class="col-6"><label class="label-bright small mb-1">Gender</label><input type="text" id="ab-sex" class="form-control text-white-force border-secondary"></div>
    </div>
    
    <div class="row g-2 mb-3">
      <div class="col-6"><label class="label-bright small mb-1">Date *</label><input type="date" id="ab-date" class="form-control text-white-force border-secondary"></div>
      <div class="col-6"><label class="label-bright small mb-1">Time *</label><input type="time" id="ab-time" class="form-control text-white-force border-secondary"></div>
    </div>
    
    <div class="row g-2 mb-4">
      <div class="col-6">
        <label class="label-bright small mb-1">Purpose</label>
        <select id="ab-purpose" class="form-select text-white-force border-secondary">
          <option>Consultation</option>
          <option>Follow-up</option>
          <option>Emergency</option>
        </select>
      </div>
      <div class="col-6"><label class="label-bright small mb-1">Fee (₹)</label><input type="number" id="ab-fee" class="form-control text-white-force border-secondary" value="500"></div>
    </div>
    
    <button id="btn-admin-save" class="btn btn-success w-100 fw-bold py-2" onclick="saveAdminBooking()">Confirm Booking</button>
  </div>
</div>

<div id="workingHoursModal" class="d-none" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1050; display: flex; align-items: center; justify-content: center;">
  <div class="card p-4 border-secondary shadow-lg" style="width: 90%; max-width: 500px; background-color: #1a1d21; max-height: 90vh; overflow-y: auto;">
    
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-3">
      <h5 class="fw-bold text-white m-0"><i class="fa-solid fa-clock text-warning me-2"></i> Clinic Working Hours</h5>
      <button class="btn-close btn-close-white" onclick="closeWorkingHours()"></button>
    </div>
    
    <div class="mb-4">
      <p class="text-muted small mb-3">Standard operational timings for Valarmathi Clinic.</p>
      
      <div class="d-flex justify-content-between align-items-center border-bottom border-secondary py-3">
        <span class="text-white fw-bold"><i class="fa-regular fa-sun text-warning me-2"></i> Morning Session</span>
        <span class="badge" style="background-color: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.9rem;">10:00 AM - 01:00 PM</span>
      </div>
      
      <div class="d-flex justify-content-between align-items-center border-bottom border-secondary py-3">
        <span class="text-white fw-bold"><i class="fa-regular fa-moon text-info me-2"></i> Evening Session</span>
        <span class="badge" style="background-color: rgba(168, 85, 247, 0.2); color: #a855f7; font-size: 0.9rem;">05:00 PM - 09:00 PM</span>
      </div>

      <div class="d-flex justify-content-between align-items-center py-3">
        <span class="text-white fw-bold"><i class="fa-solid fa-calendar-xmark text-danger me-2"></i> Sunday</span>
        <span class="badge" style="background-color: rgba(239, 68, 68, 0.2); color: #ef4444; font-size: 0.9rem;">Emergencies Only</span>
      </div>
    </div>
    
    <button class="btn btn-outline-secondary w-100 fw-bold text-white py-2" onclick="closeWorkingHours()">Close</button>
  </div>
</div>
