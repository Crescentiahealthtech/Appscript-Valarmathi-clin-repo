  <!-- Styles.html has asked for 'Inter' since the first commit and nothing
       ever fetched it, so every screen fell through to 'Segoe UI' on Windows
       and to whatever the platform calls sans-serif everywhere else. Two
       machines in the same clinic therefore rendered the application in two
       different typefaces, at two different apparent sizes, and a heading set
       against a label looked mismatched because the two were being measured
       against different metrics. Loading the face the stylesheet names fixes
       the whole class at once. display=swap so a slow font never delays the
       first paint of a clinical screen. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

  <!-- Both are `defer`: they used to block parsing here in the head, and the
       document they were blocking is the whole application — every module's
       markup and scripts are inlined into this one page, so nothing could be
       parsed until Chart.js and Bootstrap had both been fetched AND executed.
       Deferred, they download in parallel with that parse and run before
       DOMContentLoaded, which is still well before anything needs them:
       every Chart.js call sits inside renderCharts/renderFootfall/
       paintAnalytics, and every `bootstrap.*` call inside an event handler.
       checkSession() — the first thing that runs — fires on DOMContentLoaded,
       after both have executed. Order between the two is preserved. -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* Apply the persisted theme before first paint. Running here - ahead of
       the body element - prevents the dark-theme flash that a post-load
       toggle caused. The class is mirrored onto the body as soon as it
       exists, because component rules are written against
       `body.light-theme`. With no stored choice the app keeps its dark
       default, unchanged from before. */
    (function () {
      var t;
      try { t = localStorage.getItem('cresrx_theme'); } catch (e) { t = null; }
      if (t === 'light') {
        document.documentElement.classList.add('light-theme');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('light-theme');
        });
      }
    })();
  </script>

<script>
  /* ==========================================================
     THEME UTILITIES (shared)
     Canvas-based widgets cannot resolve CSS variables, so charts
     must read the *computed* token value and repaint whenever the
     theme changes. Anything registered here is re-rendered on the
     `themechange` event dispatched by applyTheme().
     ========================================================== */
  window.cssVar = function (name, fallback) {
    try {
      var v = getComputedStyle(document.body).getPropertyValue(name).trim();
      if (v) return v;
    } catch (e) { /* pre-paint */ }
    return fallback || '#6366f1';
  };

  // Palette helpers so every chart in the app draws from one source.
  window.chartPalette = function () {
    return [cssVar('--chart-1'), cssVar('--chart-2'), cssVar('--chart-3'),
            cssVar('--chart-4'), cssVar('--chart-5'), cssVar('--chart-6')];
  };
  window.chartTheme = function () {
    return { grid: cssVar('--chart-grid'), tick: cssVar('--chart-tick'),
             text: cssVar('--text-muted'), accent: cssVar('--accent-purple') };
  };

  // Register a repaint callback; it fires on every theme switch.
  window.__themeRepainters = [];
  window.onThemeChange = function (fn) {
    if (typeof fn === 'function') window.__themeRepainters.push(fn);
  };
  window.addEventListener('themechange', function () {
    (window.__themeRepainters || []).forEach(function (fn) {
      try { fn(); } catch (e) { /* one bad repainter must not stop the rest */ }
    });
  });
</script>
