<div id="emr-workspace-ip-records" class="d-none hd-workspace mt-3 app-view h-100 flex-column px-2">

  <!-- ======================= LEDGER ======================= -->
  <div id="ip-records-ledger-view" class="h-100 flex-column">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2 pb-2 border-bottom border-secondary">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-secondary btn-sm py-1 px-3 me-3" onclick="returnToEMRMenu()">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <h5 class="m-0 text-white fw-bold"><i class="fa-solid fa-folder-tree text-info"></i> IP Master Records</h5>
        <span class="badge bg-dark border border-secondary text-secondary ms-3" id="ip-records-count">--</span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="btn-group btn-group-sm" role="group" id="ip-records-status-filter">
          <button type="button" class="btn btn-outline-secondary active" data-status="ALL"        onclick="setIPRecordFilter('ALL', this)">All</button>
          <button type="button" class="btn btn-outline-secondary"        data-status="ACTIVE"     onclick="setIPRecordFilter('ACTIVE', this)">Active</button>
          <button type="button" class="btn btn-outline-secondary"        data-status="DISCHARGED" onclick="setIPRecordFilter('DISCHARGED', this)">Discharged</button>
          <button type="button" class="btn btn-outline-warning"          data-status="GAPS"       onclick="setIPRecordFilter('GAPS', this)"
                  title="Records missing a casesheet or overdue a progress note">
            <i class="fa-solid fa-triangle-exclamation"></i> Needs attention
          </button>
        </div>

        <div class="input-group input-group-sm" style="width: 280px;">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control bg-dark border-secondary text-white" id="ip-record-search"
                 placeholder="Name, PID, IP no, ward, diagnosis..." onkeyup="filterIPRecords()">
          <button class="btn btn-outline-secondary" onclick="fetchIPRecordsLedger()" title="Refresh">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="hd-panel flex-grow-1 overflow-auto" style="max-height: calc(100vh - 130px);">
      <table class="table table-dark table-hover table-tight align-middle">
        <thead style="position: sticky; top: 0; z-index: 10;">
          <tr>
            <th style="width:16%;">Admitted</th>
            <th style="width:26%;">Patient</th>
            <th style="width:13%;">IP Number</th>
            <th style="width:14%;">Ward &amp; Bed</th>
            <th style="width:19%;">Record</th>
            <th class="text-end" style="width:12%;">Action</th>
          </tr>
        </thead>
        <tbody id="ip-records-tbody">
          <tr><td colspan="6" class="text-center text-secondary py-4">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ======================= DETAIL ======================= -->
  <div id="ip-records-detail-view" class="d-none h-100 flex-column">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2 pb-2 border-bottom border-secondary">
      <div class="d-flex align-items-center flex-wrap gap-2">
        <button class="btn btn-outline-secondary btn-sm py-1 px-3 me-2" onclick="closeIPRecordDetail()">
          <i class="fa-solid fa-arrow-left"></i> Ledger
        </button>
        <span class="fs-5 fw-bold text-white" id="ip-det-name">Patient Name</span>
        <span class="badge bg-dark border border-secondary text-light" id="ip-det-agesex">--</span>
        <span class="badge bg-dark border border-secondary text-light" id="ip-det-id">PID: --</span>
        <span class="badge bg-info text-dark fw-bold" id="ip-det-ipno">IP: --</span>
        <span class="badge bg-dark border border-secondary text-light" id="ip-det-bed">--</span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <!-- Switched by showIPRecordTab(), NOT by Bootstrap's pill data API.
             The detail view is revealed by removing .d-none from an ancestor,
             and a tab whose pane is measured while that ancestor is still
             hidden does not complete its transition: the first click on
             "Progress Notes" appeared to do nothing, and only worked once
             Casesheet had been clicked and the panes had been laid out. An
             explicit class swap has no transition to lose. -->
        <ul class="nav nav-pills" id="ip-record-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active py-1 px-3 text-white" type="button"
                    data-ip-tab="tab-casesheet" style="font-size: 0.8rem;">Casesheet</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link py-1 px-3 text-white" type="button"
                    data-ip-tab="tab-notes" style="font-size: 0.8rem;">
              Progress Notes <span class="badge bg-secondary ms-1" id="ip-det-notecount">0</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link py-1 px-3 text-white" type="button"
                    data-ip-tab="tab-discharge" style="font-size: 0.8rem;">Discharge</button>
          </li>
        </ul>

        <div class="dropdown">
          <button class="btn btn-info btn-sm fw-bold dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="fa-solid fa-print"></i> Print
          </button>
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
            <li><a class="dropdown-item" href="#" onclick="printIPRecord('full'); return false;">
              <i class="fa-solid fa-folder-open me-2 text-info"></i> Complete file</a></li>
            <li><a class="dropdown-item" href="#" onclick="printIPRecord('casesheet'); return false;">
              <i class="fa-solid fa-file-medical me-2 text-info"></i> Admission casesheet</a></li>
            <li><a class="dropdown-item" href="#" onclick="printIPRecord('notes'); return false;">
              <i class="fa-solid fa-clipboard-list me-2 text-success"></i> Progress notes</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="ip-det-gaps" class="mb-2"></div>

    <div class="tab-content flex-grow-1 overflow-auto pe-2" id="ip-record-tabContent" style="max-height: calc(100vh - 150px);">
      <div class="tab-pane fade show active" id="tab-casesheet" role="tabpanel">
        <div class="hd-panel border-info" id="det-casesheet-body">
          <div class="text-center text-secondary py-5">Loading...</div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-notes" role="tabpanel">
        <div class="hd-panel border-success">
          <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
            <h6 class="text-success fw-bold m-0"><i class="fa-solid fa-clipboard-list"></i> Progress Notes</h6>
            <select class="form-select form-select-sm bg-dark border-secondary text-white" style="width:190px;"
                    id="ip-note-role-filter" onchange="renderIPRecordNotes()">
              <option value="">All note types</option>
              <option value="DOCTOR">Progress notes</option>
              <option value="NURSE">Nursing notes</option>
              <option value="CONSULTANT">Consultant opinions</option>
              <option value="PROCEDURE">Procedure notes</option>
              <option value="HANDOVER">Handovers</option>
              <option value="QUICK">Quick notes</option>
            </select>
          </div>
          <div id="det-notes-timeline" class="d-flex flex-column gap-3"></div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-discharge" role="tabpanel">
        <div class="hd-panel border-warning">
          <h6 class="text-warning fw-bold mb-3 border-bottom border-secondary pb-2">
            <i class="fa-solid fa-house-medical"></i> Discharge
          </h6>
          <div id="det-ds-content" class="text-light small"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var IPRec = {
    ledger:   [],
    filter:   'ALL',
    file:     null,
    loadingKey: null
  };

  // ---- small helpers -----------------------------------------------------

  /** Every value from the sheet reaches the DOM through this. Patient names
   *  and clinical free text are user input and routinely contain "<" and "&". */
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escLines(v) { return esc(v).replace(/\r\n|\r|\n/g, '<br>'); }
  function s(v) { return String(v === null || v === undefined ? '' : v).trim(); }

  function toast(msg, kind) {
    if (typeof ipnToast === 'function') { ipnToast(msg, kind); return; }
    if (kind === 'err') { console.error(msg); } else { console.log(msg); }
    alert(msg);
  }

  function setText(id, txt) {
    var el = document.getElementById(id);
    if (el) el.innerText = txt;
  }
  function setHtml(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  /** A label/value pair, or "" so empty fields leave no blank row. */
  function kv(label, valueHtml, opts) {
    opts = opts || {};
    var v = s(valueHtml);
    if (!v && !opts.keepEmpty) return '';
    return '<div class="' + (opts.cls || 'col-md-6') + ' mb-2">' +
             '<span class="text-info small d-block">' + esc(label) + '</span>' +
             '<span class="text-white small" style="white-space:pre-wrap;">' +
               (v || '<span class="text-secondary">--</span>') + '</span>' +
           '</div>';
  }

  function panel(title, innerHtml, opts) {
    opts = opts || {};
    if (!s(innerHtml) && !opts.keepEmpty) return '';
    return '<div class="mb-3">' +
             '<h6 class="text-info fw-bold mb-2 border-bottom border-secondary pb-1" style="font-size:0.85rem;">' +
               esc(title) + '</h6>' +
             '<div class="row g-0">' + innerHtml + '</div>' +
           '</div>';
  }

  /** Structured complaint/history entries: {prefix, condition, duration}. */
  function clinicalList(arr) {
    if (!Array.isArray(arr) || !arr.length) return '';
    return arr.map(function (item) {
      if (typeof item === 'string') return esc(item);
      var t = esc(item.condition || item.text || '');
      if (!t) return '';
      if (item.prefix)   t = esc(item.prefix) + ' ' + t;
      if (item.duration) t += ' <span class="text-secondary">(' + esc(item.duration) + ')</span>';
      return t;
    }).filter(Boolean).join('<br>');
  }

  // ---- ledger ------------------------------------------------------------

  function fetchIPRecordsLedger() {
    setHtml('ip-records-tbody',
      '<tr><td colspan="6" class="text-center text-info py-4">' +
      '<i class="fa-solid fa-spinner fa-spin me-2"></i>Fetching records...</td></tr>');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          IPRec.ledger = [];
          setHtml('ip-records-tbody',
            '<tr><td colspan="6" class="text-center text-danger py-4">' +
            esc((res && res.message) || 'Could not load the records ledger.') + '</td></tr>');
          setText('ip-records-count', '--');
          return;
        }
        IPRec.ledger = res.data || [];
        filterIPRecords();
      })
      .withFailureHandler(function (e) {
        setHtml('ip-records-tbody',
          '<tr><td colspan="6" class="text-center text-danger py-4">' + esc(e.message) + '</td></tr>');
      })
      .getIPRecordsLedger(window.sessionToken);
  }

  function setIPRecordFilter(status, btn) {
    IPRec.filter = status;
    var group = document.getElementById('ip-records-status-filter');
    if (group) {
      group.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    }
    if (btn) btn.classList.add('active');
    filterIPRecords();
  }

  function filterIPRecords() {
    var input = document.getElementById('ip-record-search');
    var term = (input ? input.value : '').toLowerCase().trim();

    var rows = IPRec.ledger.filter(function (p) {
      if (IPRec.filter === 'ACTIVE'     && p.status !== 'ACTIVE')     return false;
      if (IPRec.filter === 'DISCHARGED' && p.status !== 'DISCHARGED') return false;
      if (IPRec.filter === 'GAPS'       && !(p.gaps && p.gaps.length)) return false;
      if (!term) return true;
      // Numeric IDs arrive as numbers; the old filter called .toLowerCase()
      // on them and threw, blanking the whole table.
      return [p.name, p.patientId, p.ipNumber, p.ward, p.bed, p.diagnosis, p.consultant]
        .map(function (v) { return String(v === null || v === undefined ? '' : v).toLowerCase(); })
        .some(function (v) { return v.indexOf(term) !== -1; });
    });

    renderIPRecordsTable(rows);
    setText('ip-records-count', rows.length + (rows.length === IPRec.ledger.length ? '' : ' of ' + IPRec.ledger.length));
  }

  function renderIPRecordsTable(data) {
    if (!data || !data.length) {
      setHtml('ip-records-tbody',
        '<tr><td colspan="6" class="text-center text-secondary py-4">No IP records match this view.</td></tr>');
      return;
    }

    // One innerHTML write; the old loop reparsed the whole table per row.
    setHtml('ip-records-tbody', data.map(function (p) {
      var statusBadge = p.status === 'ACTIVE'
        ? '<span class="badge bg-success-subtle text-success border border-success">Active</span>'
        : (p.status === 'DISCHARGED'
            ? '<span class="badge bg-dark border border-secondary text-secondary">Discharged</span>'
            : '<span class="badge bg-dark border border-secondary text-secondary">' + esc(p.status || '--') + '</span>');

      var gaps = (p.gaps || []).map(function (g) {
        return '<span class="badge bg-warning-subtle text-warning border border-warning me-1" ' +
               'style="font-size:0.62rem;">' + esc(g) + '</span>';
      }).join('');

      var notes = p.noteCount
        ? '<span class="text-light">' + esc(p.noteCount) + ' note' + (p.noteCount === 1 ? '' : 's') + '</span>' +
          (p.lastNoteOn ? '<span class="text-secondary"> &middot; last ' + esc(p.lastNoteOn) + '</span>' : '')
        : '<span class="text-secondary">No notes</span>';

      var version = (p.version > 1)
        ? '<span class="badge bg-dark border border-info text-info ms-1" style="font-size:0.62rem;" ' +
          'title="This casesheet has been amended">v' + esc(p.version) + '</span>' : '';

      return '<tr>' +
        '<td class="text-light" style="font-size:0.78rem;">' + esc(p.admittedOn || '--') +
          (p.dischargedOn ? '<div class="text-secondary" style="font-size:0.68rem;">Discharged ' + esc(p.dischargedOn) + '</div>' : '') +
        '</td>' +
        '<td>' +
          '<div class="fw-bold text-info">' + esc(p.name) + '</div>' +
          '<div class="text-secondary" style="font-size:0.7rem;">' +
            esc(p.patientId || '--') + (p.ageSex ? ' | ' + esc(p.ageSex) : '') + '</div>' +
          (p.diagnosis ? '<div class="text-warning" style="font-size:0.7rem;">' + esc(p.diagnosis) + '</div>' : '') +
        '</td>' +
        '<td class="text-warning fw-bold" style="font-size:0.78rem;">' + esc(p.ipNumber) + version + '</td>' +
        '<td class="text-light" style="font-size:0.78rem;">' +
          esc([p.ward, p.bed].filter(Boolean).join(' - ') || '--') +
          '<div class="mt-1">' + statusBadge + '</div>' +
        '</td>' +
        '<td style="font-size:0.7rem;">' + notes + (gaps ? '<div class="mt-1">' + gaps + '</div>' : '') + '</td>' +
        '<td class="text-end text-nowrap">' +
          '<button class="btn btn-outline-info btn-sm py-1 px-3 me-1" style="font-size:0.72rem;" ' +
            'data-record-key="' + esc(p.encounterId || p.ipNumber) + '">View File</button>' +
          // Opens the file straight onto the notes tab. Wanting the progress
          // notes is the commonest reason to open an IP record at all.
          '<button class="btn btn-outline-success btn-sm py-1 px-3" style="font-size:0.72rem;" ' +
            'title="Open the progress notes" ' +
            'data-record-key="' + esc(p.encounterId || p.ipNumber) + '" ' +
            'data-open-tab="tab-notes">Notes</button>' +
        '</td>' +
      '</tr>';
    }).join(''));

    // Bound here rather than inlined in onclick, so an apostrophe in a record
    // key can never break out of the attribute.
    var tbody = document.getElementById('ip-records-tbody');
    if (tbody) {
      tbody.querySelectorAll('button[data-record-key]').forEach(function (b) {
        b.addEventListener('click', function () {
          viewIPRecordDetail(b.dataset.recordKey, b.dataset.openTab || 'tab-casesheet');
        });
      });
    }
  }

  // ---- detail ------------------------------------------------------------

  /**
   * Shows one pane of the record detail view and lights its pill.
   * Deliberately not Bootstrap's Tab plugin — see the markup comment above.
   */
  function showIPRecordTab(paneId) {
    var wrap = document.getElementById('ip-record-tabContent');
    var tabs = document.getElementById('ip-record-tabs');
    if (!wrap || !tabs) return;

    wrap.querySelectorAll('.tab-pane').forEach(function (p) {
      var on = (p.id === paneId);
      p.classList.toggle('active', on);
      p.classList.toggle('show', on);
    });
    tabs.querySelectorAll('[data-ip-tab]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.ipTab === paneId);
    });
  }

  function wireIPRecordTabs() {
    var tabs = document.getElementById('ip-record-tabs');
    if (!tabs || tabs.dataset.wired === '1') return;
    tabs.dataset.wired = '1';
    tabs.querySelectorAll('[data-ip-tab]').forEach(function (b) {
      b.addEventListener('click', function () { showIPRecordTab(b.dataset.ipTab); });
    });
  }

  /**
   * @param {string} recordKey
   * @param {string} [openTab] pane to land on; defaults to the casesheet.
   */
  function viewIPRecordDetail(recordKey, openTab) {
    if (!recordKey) return;
    IPRec.loadingKey = recordKey;

    document.getElementById('ip-records-ledger-view').classList.add('d-none');
    document.getElementById('ip-records-detail-view').classList.remove('d-none');

    // Wire once the detail view is actually in the layout, and always start
    // from a known tab so the screen never opens on whatever was last open
    // for a different patient.
    wireIPRecordTabs();
    showIPRecordTab(openTab || 'tab-casesheet');

    setHtml('det-casesheet-body', '<div class="text-center text-secondary py-5">' +
      '<i class="fa-solid fa-spinner fa-spin me-2"></i>Loading the file...</div>');
    setHtml('det-notes-timeline', '<div class="text-center text-secondary py-3">Fetching timeline...</div>');
    setHtml('det-ds-content', '');
    setHtml('ip-det-gaps', '');

    google.script.run
      .withSuccessHandler(function (res) {
        if (IPRec.loadingKey !== recordKey) return;   // a later click won
        if (!res || !res.success) {
          var msg = esc((res && res.message) || 'Could not open this record.');
          setHtml('det-casesheet-body', '<div class="text-danger text-center py-5">' + msg + '</div>');
          setHtml('det-notes-timeline', '');
          return;
        }
        IPRec.file = res;
        renderIPRecordHeader(res);
        renderIPRecordCasesheet(res);
        renderIPRecordNotes();
        renderIPRecordDischarge(res);
      })
      .withFailureHandler(function (e) {
        setHtml('det-casesheet-body', '<div class="text-danger text-center py-5">' + esc(e.message) + '</div>');
      })
      .getIPRecordFile(recordKey, window.sessionToken);
  }

  function renderIPRecordHeader(f) {
    var p = f.patient || {};
    setText('ip-det-name',   p.name || 'Unknown');
    setText('ip-det-agesex', p.ageSex || '--');
    setText('ip-det-id',     'PID: ' + (p.pid || '--'));
    setText('ip-det-ipno',   'IP: ' + (p.ipNumber || '--'));
    setText('ip-det-bed',    p.wardBed || '--');
    setText('ip-det-notecount', String((f.notes || []).length));

    setHtml('ip-det-gaps', (f.gaps && f.gaps.length)
      ? '<div class="alert alert-warning py-1 px-3 mb-0 d-flex align-items-center gap-2" style="font-size:0.78rem;">' +
        '<i class="fa-solid fa-triangle-exclamation"></i><span>Record incomplete: ' +
        esc(f.gaps.join(' · ')) + '</span></div>'
      : '');
  }

  function renderIPRecordCasesheet(f) {
    var c = f.casesheet;
    if (!c) {
      setHtml('det-casesheet-body',
        '<div class="text-center text-secondary py-5">' +
        '<i class="fa-solid fa-file-circle-xmark fa-2xl mb-3"></i><br>' +
        'No admission casesheet has been recorded for this admission.</div>');
      return;
    }

    var v = c.vitals || {};
    var vitals = [
      (v.sys || v.dia) ? kv('Blood Pressure', esc((v.sys || '--') + '/' + (v.dia || '--') + ' mmHg'), { cls: 'col-6 col-md-3' }) : '',
      v.pr     ? kv('Pulse',  esc(v.pr) + ' bpm',   { cls: 'col-6 col-md-3' }) : '',
      v.spo2   ? kv('SpO2',   esc(v.spo2) + ' %',   { cls: 'col-6 col-md-3' }) : '',
      v.temp   ? kv('Temp',   esc(v.temp) + ' °F',  { cls: 'col-6 col-md-3' }) : '',
      v.height ? kv('Height', esc(v.height) + ' cm',{ cls: 'col-6 col-md-3' }) : '',
      v.weight ? kv('Weight', esc(v.weight) + ' kg',{ cls: 'col-6 col-md-3' }) : ''
    ].join('');

    var ge = c.genExam || {};
    var geHtml = [
      ge.positive && ge.positive.length
        ? kv('Positive findings', '<span class="text-warning fw-bold">' + esc(ge.positive.join(', ')) + '</span>') : '',
      ge.negative && ge.negative.length
        ? kv('Negative', '<span class="text-secondary">' + esc(ge.negative.join(', ')) + '</span>') : '',
      kv('Notes', escLines(ge.notes), { cls: 'col-12' })
    ].join('');

    var se = c.sysExam || {};
    var seHtml = [
      kv('CVS', esc(se.cvs), { cls: 'col-md-3' }),
      kv('RS',  esc(se.rs),  { cls: 'col-md-3' }),
      kv('P/A', esc(se.pa),  { cls: 'col-md-3' }),
      kv('CNS', esc(se.cns), { cls: 'col-md-3' })
    ].join('');

    var medsHtml = (c.meds && c.meds.length)
      ? '<div class="col-12 table-responsive"><table class="table table-sm table-dark table-bordered mb-0" ' +
        'style="font-size:0.78rem; border-color: var(--border-hover);"><thead><tr>' +
        '<th class="text-info" style="width:5%;">#</th><th class="text-info">Drug</th>' +
        '<th class="text-info text-center" style="width:22%;">Dose / Frequency</th>' +
        '<th class="text-info text-center" style="width:13%;">Route</th>' +
        '<th class="text-info text-center" style="width:14%;">Duration</th></tr></thead><tbody>' +
        c.meds.map(function (m, i) {
          var name = [m.type, m.drugName || m.name, m.strength].map(s).filter(Boolean).join(' ');
          var note = s(m.comment || m.instructions);
          return '<tr>' +
            '<td class="text-secondary">' + (i + 1) + '</td>' +
            '<td class="text-white fw-bold">' + esc(name || '--') +
              (note ? '<br><small class="text-secondary fw-normal">' + esc(note) + '</small>' : '') + '</td>' +
            '<td class="text-white text-center align-middle">' +
              esc([m.dose, m.freq || m.sig].map(s).filter(Boolean).join(' ') || '-') + '</td>' +
            '<td class="text-white text-center align-middle">' + esc(m.route || 'Oral') + '</td>' +
            '<td class="text-white text-center align-middle">' + esc(m.duration || m.days || '-') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="col-12 text-secondary small">No admission medication ordered.</div>';

    var orderedLabs = (c.labs || [])
      .filter(function (l) { return String(l.type || '').toUpperCase() === 'ORDER'; })
      .map(function (l) { return s(l.testName); }).filter(Boolean);
    var outside = (c.outsideLabs || []).map(function (l) {
      return s(l.test) ? esc(l.test) + ': <span class="text-white">' + esc(l.val || '--') + '</span>' : '';
    }).filter(Boolean).join('<br>');

    var provenance = (c.version > 1 || s(c.amendReason))
      ? panel('Record Provenance', [
          kv('Version', 'v' + esc(c.version), { cls: 'col-md-3' }),
          kv('Status',  esc(c.status),        { cls: 'col-md-3' }),
          kv('Amended', esc([c.amendedAt, c.amendedBy].filter(Boolean).join(' by ')), { cls: 'col-md-6' }),
          kv('Reason',  escLines(c.amendReason), { cls: 'col-12' })
        ].join(''))
      : '';

    setHtml('det-casesheet-body',
      '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 border-bottom border-secondary pb-2">' +
        '<h6 class="text-info fw-bold m-0"><i class="fa-solid fa-file-medical"></i> Admission Casesheet</h6>' +
        '<span class="text-secondary" style="font-size:0.72rem;">' +
          esc(c.recordedOn || '--') + (c.doctor ? ' &middot; ' + esc(c.doctor) : '') + '</span>' +
      '</div>' +
      panel('Provisional Diagnosis',
        kv('Primary Diagnosis',
           '<span class="text-warning fw-bold" style="font-size:0.95rem;">' + esc(c.diagnosis || '--') + '</span>',
           { cls: 'col-12', keepEmpty: true })) +
      panel('Vitals on Admission', vitals) +
      panel('Presenting Complaints & History', [
        kv('Chief Complaints', clinicalList(c.complaints), { cls: 'col-md-6', keepEmpty: true }),
        kv('History / Comorbidities', clinicalList(c.history), { cls: 'col-md-6', keepEmpty: true })
      ].join('')) +
      panel('General Examination', geHtml) +
      panel('Systemic Examination', seHtml) +
      panel('Admission Medication Orders', medsHtml, { keepEmpty: true }) +
      panel('Investigations', [
        kv('Lab Orders', esc(orderedLabs.join(', ')), { cls: 'col-md-6' }),
        kv('External Lab Results', outside, { cls: 'col-md-6' }),
        kv('Radiology / Scans', escLines(c.radiology), { cls: 'col-12' })
      ].join('')) +
      panel('Advice / Plan', kv('Advice', escLines(c.advice), { cls: 'col-12', keepEmpty: true })) +
      provenance);
  }

  function renderIPRecordNotes() {
    var f = IPRec.file;
    var container = document.getElementById('det-notes-timeline');
    if (!f || !container) return;

    var sel = document.getElementById('ip-note-role-filter');
    var wanted = sel ? sel.value : '';
    var notes = (f.notes || []).filter(function (n) { return !wanted || n.roleType === wanted; });

    if (!notes.length) {
      container.innerHTML = '<div class="text-center text-secondary py-4">' +
        (wanted ? 'No notes of this type.' : 'No progress notes recorded for this admission.') + '</div>';
      return;
    }

    var roleColour = {
      DOCTOR: 'info', NURSE: 'success', CONSULTANT: 'warning',
      PROCEDURE: 'danger', HANDOVER: 'secondary', QUICK: 'secondary'
    };

    container.innerHTML = notes.map(function (n) {
      var d = n.noteData || {};
      var colour = roleColour[n.roleType] || 'secondary';
      var parts = [];

      var add = function (label, html, cls) {
        if (!s(html)) return;
        parts.push('<div class="' + (cls || 'col-12') + ' mb-1">' +
          '<span class="text-secondary" style="font-size:0.68rem;">' + esc(label) + '</span>' +
          '<div class="text-white small" style="white-space:pre-wrap;">' + html + '</div></div>');
      };

      add('Subjective / Objective', escLines(d.subjectiveObjective));

      if (d.vitals) {
        var vit = [
          s(d.vitals.bp)    ? 'BP ' + esc(d.vitals.bp) : '',
          s(d.vitals.pulse) ? 'Pulse ' + esc(d.vitals.pulse) : '',
          s(d.vitals.spo2)  ? 'SpO2 ' + esc(d.vitals.spo2) + '%' : '',
          s(d.vitals.temp)  ? 'Temp ' + esc(d.vitals.temp) + '°F' : ''
        ].filter(Boolean).join(' &nbsp;·&nbsp; ');
        add('Vitals', vit);
      }

      // Systemic exam. Notes signed before the section name was canonicalised
      // still carry the old key, so both are read.
      var se = d.sysExam || d.systemExam;
      if (se) {
        var exam = [
          s(se.cvs) ? 'CVS: ' + esc(se.cvs) : '',
          s(se.rs)  ? 'RS: '  + esc(se.rs)  : '',
          s(se.pa)  ? 'P/A: ' + esc(se.pa)  : '',
          s(se.cns) ? 'CNS: ' + esc(se.cns) : ''
        ].filter(Boolean);
        if (exam.length) add('Systemic Examination', exam.join('<br>'));
      }

      add('Assessment',      escLines(d.assessment));
      add('Diagnosis',       escLines(d.diagnosis));
      add('Plan',            escLines(d.plan));
      add('Advice',          escLines(d.adviceText));
      add('Intervention',    escLines(d.intervention));
      add('Observations',    escLines(d.observations));
      add('Consultant',      esc(d.consultantName));
      add('Specialty',       esc(d.specialty));
      add('Findings',        escLines(d.findings));
      add('Recommendations', escLines(d.recommendations));
      add('Procedure',       esc(d.procedureName));
      add('Operator',        esc(d.operator));
      add('Complications',   escLines(d.complications));
      add('Note',            escLines(d.text));
      add('Handover',        escLines(d.handoverText));

      if (d.medOrders && d.medOrders.length) {
        add('Medication Orders', d.medOrders.map(function (m) {
          return esc((m.action || 'NEW') + ' — ' +
                     [m.drugName || m.newDrugName, m.dose, m.freq, m.route]
                       .map(s).filter(Boolean).join(' '));
        }).join('<br>'));
      }
      if (d.investigationOrders && d.investigationOrders.length) {
        add('Investigations', esc(d.investigationOrders.map(function (o) { return s(o.testName); })
          .filter(Boolean).join(', ')));
      }

      if (!parts.length) parts.push('<div class="col-12 text-secondary small">No content recorded.</div>');

      return '<div class="p-2 border border-secondary rounded" style="background-color: var(--surface-2);">' +
        '<div class="d-flex justify-content-between align-items-center flex-wrap gap-1 border-bottom border-dark pb-1 mb-2">' +
          '<span><span class="badge bg-' + colour + '-subtle text-' + colour + ' border border-' + colour +
            ' me-2" style="font-size:0.62rem;">' + esc(n.label) + '</span>' +
            '<span class="text-light" style="font-size:0.75rem;">' + esc(n.author || '--') + '</span>' +
            (n.signature && n.signature !== n.author
              ? '<span class="text-secondary" style="font-size:0.68rem;"> (' + esc(n.signature) + ')</span>' : '') +
          '</span>' +
          '<span class="text-secondary" style="font-size:0.7rem;">' + esc(n.timestamp) +
            (n.shift ? ' &middot; ' + esc(n.shift) : '') + '</span>' +
        '</div>' +
        '<div class="row g-0">' + parts.join('') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderIPRecordDischarge(f) {
    var ds = f.discharge;
    if (!ds) {
      setHtml('det-ds-content',
        '<div class="text-center text-secondary py-5">' +
        '<i class="fa-solid fa-lock fa-2xl mb-3"></i><br>' +
        'No discharge record. This admission is still open.</div>');
      return;
    }
    setHtml('det-ds-content',
      (ds.source === 'admission'
        ? '<div class="alert alert-secondary py-1 px-3 small mb-3">' +
          'Taken from the admission record — no written discharge summary has been filed.</div>'
        : '') +
      '<div class="row g-0">' +
        kv('Discharge Date',   esc(ds.date),      { cls: 'col-md-4', keepEmpty: true }) +
        kv('Outcome',          '<span class="text-warning">' + esc(ds.outcome) + '</span>', { cls: 'col-md-4', keepEmpty: true }) +
        kv('Final Diagnosis',  esc(ds.diagnosis), { cls: 'col-md-4' }) +
        kv('Summary',          escLines(ds.summary), { cls: 'col-12' }) +
      '</div>');
  }

  function closeIPRecordDetail() {
    IPRec.loadingKey = null;
    document.getElementById('ip-records-detail-view').classList.add('d-none');
    document.getElementById('ip-records-ledger-view').classList.remove('d-none');
  }

  // ---- print -------------------------------------------------------------

  /**
   * @param {'full'|'casesheet'|'notes'} scope
   * Rendered server-side, so the printed sheet is the stored record rather
   * than a screenshot of the screen.
   */
  function printIPRecord(scope) {
    var f = IPRec.file;
    if (!f || !f.success) { toast('Open a record first.', 'warn'); return; }

    if (scope === 'casesheet' && !f.casesheet) {
      toast('There is no casesheet on this admission to print.', 'warn');
      return;
    }

    var w = window.open('', '_blank', 'width=900,height=1100');
    if (!w) { toast('Pop-up blocked. Allow pop-ups for this site, then retry.', 'warn'); return; }
    w.document.write('<p style="font:14px sans-serif;padding:24px;">Preparing the record...</p>');

    var opts = (scope === 'casesheet') ? { notes: false, trend: false, discharge: false }
             : (scope === 'notes')     ? { casesheet: false }
             : {};

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          w.close();
          toast((res && res.message) || 'Could not build the record.', 'err');
          return;
        }
        w.document.open();
        w.document.write(res.html);
        w.document.close();
        w.focus();
        setTimeout(function () { try { w.print(); } catch (e) {} }, 500);
      })
      .withFailureHandler(function (e) { w.close(); toast('Print failed: ' + e.message, 'err'); })
      .getIPRecordPrintHtml(f.encounterId || f.ipNumber, window.sessionToken, opts);
  }

  // Exported: EMR_Cockpit and IP_Notes_UI call fetchIPRecordsLedger() by name,
  // and the markup above binds to the rest.
  window.fetchIPRecordsLedger  = fetchIPRecordsLedger;
  window.filterIPRecords       = filterIPRecords;
  window.setIPRecordFilter     = setIPRecordFilter;
  window.viewIPRecordDetail    = viewIPRecordDetail;
  window.showIPRecordTab       = showIPRecordTab;
  window.closeIPRecordDetail   = closeIPRecordDetail;
  window.renderIPRecordNotes   = renderIPRecordNotes;
  window.printIPRecord         = printIPRecord;
})();
</script>
