# Static checks for the Apps Script project. There is no package.json and no
# npm build here — the old template ran `npm ci`, which fails on every push
# with nothing to install. tools/check.sh is what a contributor runs locally.

name: Static checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - run: bash tools/check.sh
