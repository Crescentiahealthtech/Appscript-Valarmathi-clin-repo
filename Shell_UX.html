<!-- =====================================================================
     🧰 SHELL UX KIT — notifications, the blocking loader, and the guard
     that stops a second click becoming a second row.

     WHY THIS FILE EXISTS

     Three problems, one cause: every module grew its own copy of the same
     three helpers, so none of them could be fixed in one place.

     1. NOTIFICATIONS WERE WHERE NOBODY LOOKS. Nine modules each carried
        their own `function toast()`, every one of them pinned
        `bottom-0 end-0` — the far corner, below the floating action button
        on the pharmacy screens and off the fold entirely on a phone in
        landscape. A failed save announced itself where the eye never goes.
        There is now ONE toast, top-centre, over the work.

     2. THE WAIT WAS INVISIBLE AND THE PAGE STAYED LIVE. Of 226
        google.script.run calls in the project, 42 disabled their own
        button and the rest left the screen fully interactive while the
        round trip ran. Apps Script round trips are seconds, not
        milliseconds, so "nothing happened, click it again" is the normal
        user response — and the second click posts the row a second time.
        crescRun() puts a centred, blocking veil over the page for the
        duration and refuses a second call on the same key while the first
        is still out.

     3. THE GUARD HAD TO BE FREE TO ADOPT. A call site converts by
        swapping `google.script.run.withSuccessHandler(f)...fn(a)` for
        `crescRun({ fn:'fn', args:[a], key:'…', onSuccess:f })`. Nothing
        else changes, and an unconverted call site keeps working exactly
        as it does today.

     Include in Index.html AFTER Auth (which defines crescEsc) and BEFORE
     ScriptsMV, so every module — shell or lazy bundle — finds these
     already defined.
     ===================================================================== -->
<style>
  /* ------------------------------------------------------------------
     Layering, from the bottom up, against what is already in the app:
       1055  Bootstrap modal        1080  the lab's critical-value modal
       2000  .modal-overlay         4000  the lazy-bundle veil
       5000  the blocking loader — ABOVE every modal on purpose, because
             the button it has to stop being clicked twice is usually
             inside one.
       6000  the toast stack — above the loader, so the result of the
             call is readable the instant the veil lifts.
     ------------------------------------------------------------------ */

  #cresc-busy {
    position: fixed; inset: 0; z-index: 5000;
    display: flex; align-items: center; justify-content: center;
    background: var(--overlay-scrim, rgba(2, 6, 23, .55));
    backdrop-filter: blur(3px);
    /* The point of the veil: every click, tap, key and scroll lands here
       and goes nowhere until the server has answered. */
    cursor: progress;
  }
  #cresc-busy[hidden] { display: none !important; }

  #cresc-busy .cb-card {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 26px; border-radius: 14px;
    background: var(--bg-elevated, #131c31);
    color: var(--text-main, #f8fafc);
    border: 1px solid var(--border-color, #1e293b);
    box-shadow: var(--shadow-lg, 0 20px 50px rgba(0,0,0,.45));
    font-weight: 600; font-size: .95rem;
    max-width: min(420px, calc(100vw - 2rem));
  }
  #cresc-busy .cb-sub {
    display: block; font-weight: 400; font-size: .8rem;
    color: var(--text-muted, #94a3b8); margin-top: 2px;
  }

  /* The stack is centred and click-through; only the toasts themselves
     take pointer events, so a notification never blocks the button
     underneath it. */
  #cresc-toast-stack {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    z-index: 6000; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 1.25rem 1rem; pointer-events: none;
    width: min(480px, 100vw);
  }
  #cresc-toast-stack .cresc-toast {
    pointer-events: auto; cursor: pointer;
    width: 100%; padding: .75rem 1.1rem; border-radius: 12px;
    color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.35);
    animation: cresc-toast-in .18s ease-out;
  }
  #cresc-toast-stack .cresc-toast.leaving {
    animation: cresc-toast-out .16s ease-in forwards;
  }
  @keyframes cresc-toast-in  { from { opacity: 0; transform: translateY(-12px); } }
  @keyframes cresc-toast-out { to   { opacity: 0; transform: translateY(-12px); } }

  @media (prefers-reduced-motion: reduce) {
    #cresc-toast-stack .cresc-toast,
    #cresc-toast-stack .cresc-toast.leaving { animation: none; }
  }
</style>

<div id="cresc-busy" hidden role="status" aria-live="polite">
  <div class="cb-card">
    <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--accent-fg, #a5b4fc);"></i>
    <span>
      <span id="cresc-busy-label">Working…</span>
      <span class="cb-sub">Please wait — do not click again.</span>
    </span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var esc = function (s) {
    if (typeof window.crescEsc === 'function') return window.crescEsc(s);
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  // ==================================================================
  // 1. NOTIFICATIONS
  // ==================================================================

  var FILL = {
    success: 'var(--success, #10b981)',
    error:   'var(--danger,  #ef4444)',
    danger:  'var(--danger,  #ef4444)',
    warning: 'var(--warning, #f59e0b)',
    info:    'var(--info,    #0ea5e9)'
  };
  var ICON = {
    success: 'fa-circle-check', error: 'fa-circle-exclamation',
    danger: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation',
    info: 'fa-circle-info'
  };

  /**
   * How long a toast stays up.
   *
   * An error stays twice as long as a success: a success only confirms
   * what the user already intended, but an error is the one they have to
   * read and act on, and 3.5s was not enough to read a server message and
   * decide what to do about it. Either can be dismissed by clicking it.
   */
  function dwell(type) { return (type === 'error' || type === 'danger') ? 7000 : 3500; }

  function stack() {
    var el = document.getElementById('cresc-toast-stack');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cresc-toast-stack';
      document.body.appendChild(el);
    }
    return el;
  }

  function dismiss(t) {
    if (!t || t.__leaving) return;
    t.__leaving = true;
    t.classList.add('leaving');
    setTimeout(function () { if (t.parentNode) t.remove(); }, 180);
  }

  /**
   * The application's only notification.
   *
   * Top-centre, over the work, not in the corner behind the floating
   * action button. Identical consecutive messages collapse into one with
   * a count rather than stacking, so a loop that fails twelve times does
   * not push everything else off the screen.
   *
   * @param {string} title
   * @param {string} [message]
   * @param {'success'|'error'|'warning'|'info'} [type='info']
   */
  window.showToast = function (title, message, type) {
    var kind = FILL[type] ? type : 'info';
    var host = stack();
    var sig = kind + '\u0000' + title + '\u0000' + (message || '');

    var last = host.lastElementChild;
    if (last && last.__sig === sig && !last.__leaving) {
      last.__n = (last.__n || 1) + 1;
      var badge = last.querySelector('.cresc-toast-n');
      if (badge) badge.textContent = '×' + last.__n;
      clearTimeout(last.__timer);
      last.__timer = setTimeout(function () { dismiss(last); }, dwell(kind));
      return last;
    }

    var t = document.createElement('div');
    t.className = 'cresc-toast';
    t.__sig = sig;
    t.__n = 1;
    t.style.background = FILL[kind];
    t.setAttribute('role', (kind === 'error' || kind === 'danger') ? 'alert' : 'status');
    t.innerHTML =
      '<div class="d-flex align-items-start gap-2">' +
        '<i class="fa-solid ' + ICON[kind] + ' mt-1"></i>' +
        '<div class="flex-grow-1">' +
          '<div class="fw-bold small">' + esc(title) + '</div>' +
          (message ? '<div class="small" style="opacity:.92;">' + esc(message) + '</div>' : '') +
        '</div>' +
        '<span class="cresc-toast-n small fw-bold" style="opacity:.75;"></span>' +
      '</div>';
    t.addEventListener('click', function () { dismiss(t); });
    host.appendChild(t);
    t.__timer = setTimeout(function () { dismiss(t); }, dwell(kind));
    return t;
  };

  /** The (title, message, ok:boolean) shape the accounts modules used. */
  window.crescToast = function (message, ok) {
    return window.showToast(ok ? 'Done' : 'Could not complete', message, ok ? 'success' : 'error');
  };

  // ==================================================================
  // 2. THE BLOCKING LOADER
  // ==================================================================

  var depth = 0;         // reference count: nested calls raise it once each
  var failsafe = null;

  /**
   * Raises or lowers the centred veil.
   *
   * Reference-counted, because a screen that fires two fetches on arrival
   * would otherwise have the first to return clear the veil while the
   * second is still out.
   *
   * The failsafe is not optional. A google.script.run call whose page is
   * suspended by the browser can drop BOTH handlers, and a veil with no
   * handler left to lower it is a frozen application. After 45 seconds it
   * lifts itself and says so.
   *
   * @param {boolean} on
   * @param {string} [label]
   */
  window.crescBusy = function (on, label) {
    var el = document.getElementById('cresc-busy');
    if (!el) return;

    if (on) {
      depth++;
      var lbl = document.getElementById('cresc-busy-label');
      if (lbl && label) lbl.textContent = label;
      el.hidden = false;
      clearTimeout(failsafe);
      failsafe = setTimeout(function () {
        depth = 0;
        el.hidden = true;
        window.showToast('The server did not answer',
          'Nothing was saved. Check your connection and try again.', 'error');
      }, 45000);
      return;
    }

    depth = Math.max(0, depth - 1);
    if (depth === 0) {
      clearTimeout(failsafe);
      el.hidden = true;
    }
  };

  /** Lowers the veil whatever the reference count — for error recovery. */
  window.crescBusyReset = function () {
    depth = 0;
    clearTimeout(failsafe);
    var el = document.getElementById('cresc-busy');
    if (el) el.hidden = true;
  };

  // ==================================================================
  // 3. THE GUARD
  // ==================================================================

  var inFlight = {};

  /** Is a call on this key already out? Lets a caller draw its own state. */
  window.crescInFlight = function (key) { return !!inFlight[key]; };

  /**
   * One server call, guarded.
   *
   * Everything that makes a duplicate entry possible is closed here:
   *
   *   - the SAME KEY cannot be in flight twice. A second click while the
   *     first call is out is dropped, with a nudge rather than silence,
   *     so the user knows the first one is still working.
   *   - the PAGE IS BLOCKED for the duration, so the second click mostly
   *     never happens.
   *   - the BUTTON, if named, is disabled and spins.
   *   - the KEY IS RELEASED in a finally-equivalent on both handlers, so
   *     a failed call does not wedge the screen against a retry.
   *
   * Idempotency still belongs on the server for anything that writes —
   * this closes the window, it does not remove the need. See
   * _ipnRememberSavedNote_ in IP_Notes_Logic.gs for that half.
   *
   * @param {{
   *   fn: string,                  // the google.script.run function name
   *   args?: Array,                // its arguments
   *   key?: string,                // guard key; defaults to fn
   *   busy?: boolean|string,       // veil + label (default true, "Working…")
   *   button?: string|Element,     // disable and spin this button
   *   onSuccess?: function,
   *   onFailure?: function,
   *   success?: string,            // toast this on a truthy result
   *   error?: string               // toast prefix on failure
   * }} o
   * @return {boolean} false when the call was dropped as a duplicate
   */
  window.crescRun = function (o) {
    o = o || {};
    var name = o.fn;
    if (!name || typeof google === 'undefined' || !google.script || !google.script.run) {
      window.showToast('This screen is not connected',
        'Reload the page and try again.', 'error');
      return false;
    }

    var key = o.key || name;
    if (inFlight[key]) {
      window.showToast('Still working', 'That is already being saved — please wait.', 'info');
      return false;
    }
    inFlight[key] = true;

    var useVeil = o.busy !== false;
    if (useVeil) window.crescBusy(true, typeof o.busy === 'string' ? o.busy : 'Working…');

    var btn = (typeof o.button === 'string') ? document.getElementById(o.button) : o.button;
    if (btn && typeof window.crescBusyButton === 'function') window.crescBusyButton(btn, true);
    else if (btn) btn.disabled = true;

    var done = function () {
      delete inFlight[key];
      if (useVeil) window.crescBusy(false);
      if (btn && typeof window.crescBusyButton === 'function') window.crescBusyButton(btn, false);
      else if (btn) btn.disabled = false;
    };

    var runner = google.script.run
      .withSuccessHandler(function (res) {
        done();
        // google.script.run hands the SUCCESS handler null when the reply
        // could not be carried back, so null is a failure, not an answer.
        if (res === null || res === undefined) {
          window.showToast(o.error || 'Could not complete',
            'The server gave no answer. Nothing was saved.', 'error');
          if (typeof o.onFailure === 'function') o.onFailure(new Error('empty reply'));
          return;
        }
        var ok = (typeof res === 'object' && res !== null && 'success' in res) ? !!res.success : true;
        if (!ok) {
          window.showToast(o.error || 'Could not complete',
            (res && res.message) || 'The server refused the request.', 'error');
        } else if (o.success) {
          window.showToast(o.success, (res && res.message) || '', 'success');
        }
        if (typeof o.onSuccess === 'function') o.onSuccess(res);
      })
      .withFailureHandler(function (err) {
        done();
        var msg = (typeof window.crescExplainError === 'function')
          ? window.crescExplainError(err)
          : ((err && err.message) || String(err));
        window.showToast(o.error || 'Could not reach the server', msg, 'error');
        if (typeof o.onFailure === 'function') o.onFailure(err);
      });

    try {
      runner[name].apply(runner, o.args || []);
    } catch (e) {
      done();
      window.showToast('This screen is out of date',
        '"' + name + '" is not available on the server. Reload the page.', 'error');
      return false;
    }
    return true;
  };

  // ==================================================================
  // 3b. READING A REPLY THAT MAY OR MAY NOT BE WRAPPED
  //
  // A permission check on the server THROWS. Thrown out of a function the
  // browser reached through google.script.run, it lands in the FAILURE
  // handler — and a failure handler is where a screen says "network error".
  // So a session that had quietly expired was reported to the user as a
  // connection problem: they retried, got the same sentence, and nothing
  // anywhere suggested signing in.
  //
  // The fix is on the server — the guard moves inside the try and the
  // refusal comes back as { success:false, message } — but that changes the
  // SHAPE of the reply, and these endpoints used to return a bare value: an
  // array of slots, a JSON string of beds, a boolean, null. This project is
  // pasted into an Apps Script editor one file at a time, so a deployment
  // where the .gs file is new and the .html is old (or the reverse) is an
  // ordinary Tuesday, not a hypothetical.
  //
  // crescUnwrap reads both. A wrapped reply is unwrapped; a bare value is
  // passed through as the answer it used to be; a null reply — which is what
  // google.script.run hands the success handler when the round trip failed —
  // is a failure, not an empty answer.
  // ==================================================================

  /**
   * @param {*} res              whatever the success handler was given
   * @param {*} [fallback]       the value to report when the call was refused
   * @return {{ok:boolean, data:*, message:string}}
   */
  window.crescUnwrap = function (res, fallback) {
    if (res === null || res === undefined) {
      return { ok: false, data: fallback,
               message: 'The server gave no answer. This is usually a dropped ' +
                        'connection; nothing was changed.' };
    }
    var wrapped = (typeof res === 'object') && !Array.isArray(res) &&
                  Object.prototype.hasOwnProperty.call(res, 'success');
    if (!wrapped) return { ok: true, data: res, message: '' };
    if (!res.success) {
      var why = String(res.message || '').replace(/^FORBIDDEN:\s*/, '');
      return { ok: false, data: fallback,
               message: why || 'The server refused the request without saying why.' };
    }
    return {
      ok: true,
      data: Object.prototype.hasOwnProperty.call(res, 'data') ? res.data : undefined,
      message: res.message || ''
    };
  };

  /**
   * The same, for a call that reached the FAILURE handler.
   *
   * An exception really did escape the server — an older deployment of the
   * .gs file, or a fault the endpoint does not catch. Either way the error's
   * own message is worth more than "network error", and a FORBIDDEN reads as
   * a sentence once its prefix is off.
   */
  window.crescWhyFailed = function (err, what) {
    var raw = (err && err.message) ? String(err.message) : String(err || '');
    var msg = raw.replace(/^FORBIDDEN:\s*/, '');
    if (!msg) {
      return (what ? what + ' failed' : 'That failed') +
             ' and the server gave no reason. Check the connection and try again.';
    }
    if (/session/i.test(msg) && /expire|invalid|sign in/i.test(msg)) {
      return msg + ' Sign in again and repeat it.';
    }
    return (what ? what + ': ' : '') + msg;
  };

  // ==================================================================
  // 4. GO BACK
  // ==================================================================

  /**
   * The one back button.
   *
   * Several screens are reached from more than one place — the discharge
   * settlement desk from the Finance Hub and from the ward, the case
   * sheet from the cockpit and from the bed map — so "back" cannot be a
   * hardcoded destination on those. A screen records where it was opened
   * from; this returns there, and falls back to the given home when a
   * screen was opened cold (a reload, a deep link).
   */
  var trail = [];

  /** Call before navigating away, naming how to come back. */
  window.crescRemember = function (fn) {
    if (typeof fn === 'function') trail.push(fn);
    if (trail.length > 20) trail.shift();
  };

  /** Go back one step, or to `home()` when there is nothing to go back to. */
  window.crescBack = function (home) {
    var step = trail.pop();
    if (typeof step === 'function') { try { step(); return; } catch (e) {} }
    if (typeof home === 'function') home();
  };

  // ==================================================================
  // 5. THE CONSENT GATE AT THE COUNTER
  // ==================================================================

  /**
   * Turns a server refusal of `code: 'CONSENT_REQUIRED'` into the question it
   * is really asking, and sends again if the patient says yes.
   *
   * WHY THIS IS A DIALOG AND NOT AN ERROR
   *
   * Every dispatch endpoint now checks the patient's COMMUNICATION consent
   * (DPDP_Dispatch.gs). For the 23 of 25 patients with no consent record at
   * all, the honest answer is "we have never asked them" — and if the desk's
   * only option at that point is an error message, what the desk learns is
   * to stop using the WhatsApp button, not to ask the patient. The consent
   * never gets recorded and the clinic is no more compliant than before.
   *
   * So the refusal is turned into the conversation the Act actually wants:
   * the notice is on screen, in the words the patient hears, the person at
   * the counter reads it out, and the answer — either answer — is written to
   * the append-only register through recordDispatchConsent() before anything
   * is sent. A "no" is recorded too; that is the point of having a register
   * that can tell REFUSED from NOT_ASKED.
   *
   * It does NOT bypass the gate. The retry goes back through the same server
   * check, which now passes because the register says GIVEN.
   *
   * @param {Object} res      the failed server reply
   * @param {function} retry  called with no arguments to send again
   * @return {boolean} true if this was a consent refusal and has been handled
   */
  window.crescConsentGate = function (res, retry) {
    if (!res || res.code !== 'CONSENT_REQUIRED') return false;

    var pid = res.patientId || '';
    var asked = (res.consentState === 'REFUSED' || res.consentState === 'WITHDRAWN');

    // Already asked and told no. Re-asking at the counter every time a bill
    // is raised is pressure, not consent, so this one only explains.
    if (asked || !pid) {
      window.crescAlert(res.message || 'This cannot be sent.', 'warn',
                        'Not sent — no consent on record');
      return true;
    }

    var body =
      'We have not asked ' + pid + ' whether we may send their documents by ' +
      (res.label || 'this route') + '.\n\n' +
      'READ THIS TO THEM:\n\n' + (res.notice || '') + '\n\n' +
      'Then record their answer. Nothing has been sent.';

    window.crescDialog({
      mode: 'confirm', message: body, kind: 'warn',
      title: 'Ask the patient first',
      okLabel: 'They agree — send it',
      cancelLabel: 'They said no'
    }).then(function (agreed) {
      window.crescRun({
        fn: 'recordDispatchConsent',
        // crescRun does not attach the session token, so it travels in args
        // exactly as it does on every other call from this page.
        args: [{ patientId: pid, channel: res.channel || 'WHATSAPP',
                 agreed: agreed === true }, window.sessionToken],
        busy: 'Recording their answer…',
        error: 'The answer could not be recorded, so nothing was sent',
        onSuccess: function (r) {
          if (!r || !r.success) return;   // crescRun has already said why
          if (agreed === true && typeof retry === 'function') retry();
          else window.crescToast('Recorded. Nothing sent by ' +
                                 (res.label || 'that route') + '.', true);
        }
      });
    });
    return true;
  };
})();
</script>
<script>
/* ====================================================================
   AUTO-REFRESH — screens that keep themselves current

   window.crescAutoRefresh(key, { section, every, run })

     section  element id of the screen; it refreshes only while that
              element is actually on screen
     every    seconds between refreshes (default 60)
     run      the screen's own quiet reload

   One timer for the whole app. A refresh is skipped — not queued — while
   the browser tab is hidden, while a dialog is open, or while somebody is
   typing into the screen, so a list never redraws under a half-typed
   search or a half-filled form. Coming back to the tab catches up at once.
   ==================================================================== */
(function () {
  'use strict';
  var entries = {};
  var lastInput = 0;

  document.addEventListener('keydown', function () { lastInput = Date.now(); }, true);
  document.addEventListener('input', function () { lastInput = Date.now(); }, true);

  function onScreen(id) {
    var el = document.getElementById(id);
    if (!el) return false;
    // offsetParent is null for anything display:none, itself or via a parent.
    return el.offsetParent !== null || el.getClientRects().length > 0;
  }

  function dialogOpen() {
    return !!document.querySelector('.modal.show, [role="dialog"]:not([hidden]):not(.d-none)' +
                                    ':not(#cresc-labpeek):not(#cresc-exlab)[aria-modal="true"]');
  }

  function busyTyping(id) {
    var a = document.activeElement;
    var el = document.getElementById(id);
    if (!a || !el || !el.contains(a)) return false;
    var tag = (a.tagName || '').toUpperCase();
    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT' && !a.isContentEditable) return false;
    return (Date.now() - lastInput) < 20000;
  }

  function tick(force) {
    if (document.hidden) return;
    var now = Date.now();
    Object.keys(entries).forEach(function (k) {
      var e = entries[k];
      if (!onScreen(e.section)) { e.seen = false; return; }
      // Arriving on the screen runs its own loader; start the clock from there.
      if (!e.seen) { e.seen = true; e.last = now; return; }
      if (!force && now - e.last < e.every * 1000) return;
      if (dialogOpen() || busyTyping(e.section)) return;
      e.last = now;
      try { e.run(); } catch (err) { if (window.console) console.warn('auto-refresh ' + k, err); }
    });
  }

  window.crescAutoRefresh = function (key, opts) {
    if (!opts || !opts.section || typeof opts.run !== 'function') return;
    entries[key] = { section: opts.section, every: Math.max(20, opts.every || 60),
                     run: opts.run, last: Date.now(), seen: false };
  };

  setInterval(function () { tick(false); }, 5000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    // Back on the tab after a while: anything overdue refreshes now.
    tick(false);
  });
})();
</script>
