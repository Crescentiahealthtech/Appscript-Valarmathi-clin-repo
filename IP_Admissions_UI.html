<!-- =====================================================================
     IP_Admissions_UI.html — CresRx
     Full replacement.

     CRITICAL: the outer wrapper MUST be
       <div id="ip-ledger-view" class="page-section">
     Styles.html line 100 is `.page-section { display: none; }` and
     switchTab() adds `.active-section`. Without this wrapper the module
     is an always-visible sibling in .main-content and bleeds into every
     workspace. Opened by Admin_Appointments_Workspace.html:
       onclick="switchTab('ip-ledger-view'); loadIPLedger();"

     Data comes from getIPLedgerPage() — server-side filtered and paged.
     The client never holds more than one page.
     ===================================================================== -->

<div id="ip-ledger-view" class="page-section">

  <div class="d-flex justify-content-between align-items-center mb-3 mt-4 border-bottom pb-3">
    <div>
      <h4 class="m-0 fw-bold">
        <i class="fa-solid fa-folder-open me-2 text-primary"></i> IP Admissions Ledger
      </h4>
      <small class="text-body-secondary">Master log of all active and historical hospital admissions</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary fw-bold px-4"
              data-bs-toggle="modal" data-bs-target="#modalAdmitPatient" onclick="prepAdmitModal()">
        <i class="fa-solid fa-plus me-2"></i> New Admission
      </button>
      <button class="btn btn-outline-secondary fw-bold px-4"
              onclick="switchTab('workspace-appointments')">
        <i class="fa-solid fa-arrow-left me-2"></i> Go Back
      </button>
    </div>
  </div>

  <!-- Quick status pills: the ward-round view first, history behind a click -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-sm btn-primary" id="ipl-pill-ACTIVE"
              onclick="iplSetStatus('ACTIVE')">
        In Ward <span class="badge text-bg-light ms-1" id="ipl-active-count">0</span>
      </button>
      <button type="button" class="btn btn-sm btn-outline-primary" id="ipl-pill-DISCHARGED"
              onclick="iplSetStatus('DISCHARGED')">Discharged</button>
      <button type="button" class="btn btn-sm btn-outline-primary" id="ipl-pill-ALL"
              onclick="iplSetStatus('ALL')">All</button>
    </div>

    <button class="btn btn-sm btn-outline-secondary" type="button"
            data-bs-toggle="collapse" data-bs-target="#ipl-advanced">
      <i class="fa-solid fa-sliders me-1"></i> Filters
    </button>

    <button class="btn btn-sm btn-outline-secondary" onclick="iplResetFilters()">
      <i class="fa-solid fa-eraser me-1"></i> Clear
    </button>

    <div class="flex-grow-1"></div>

    <span class="text-body-secondary small" id="ipl-summary"></span>
    <button class="btn btn-sm btn-outline-secondary" onclick="loadIPLedger()">
      <i class="fa-solid fa-rotate me-1"></i> Refresh
    </button>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" id="ipl-search" class="form-control"
               placeholder="Search IP No, Patient ID, or Name..." oninput="iplDebouncedSearch()">
      </div>
    </div>
    <div class="col-md-3">
      <select id="ipl-page-size" class="form-select" onchange="iplSetPageSize()">
        <option value="25" selected>25 per page</option>
        <option value="50">50 per page</option>
        <option value="100">100 per page</option>
      </select>
    </div>
  </div>

  <div class="collapse mb-3" id="ipl-advanced">
    <div class="card card-body bg-body-tertiary">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label small text-body-secondary">Ward</label>
          <select id="ipl-ward" class="form-select form-select-sm" onchange="iplApply()">
            <option value="">All wards</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-body-secondary">Consultant</label>
          <select id="ipl-consultant" class="form-select form-select-sm" onchange="iplApply()">
            <option value="">All consultants</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-body-secondary">Admitted from</label>
          <input type="date" id="ipl-from" class="form-control form-control-sm" onchange="iplApply()">
        </div>
        <div class="col-md-3">
          <label class="form-label small text-body-secondary">Admitted to</label>
          <input type="date" id="ipl-to" class="form-control form-control-sm" onchange="iplApply()">
        </div>
      </div>
    </div>
  </div>

  <div class="border rounded overflow-auto" style="max-height: 60vh;">
    <table class="table table-hover align-middle m-0">
      <thead class="sticky-top bg-body-tertiary">
        <tr class="small text-body-secondary">
          <th>IP Number</th>
          <th>Patient Details</th>
          <th>Admitted On</th>
          <th>Ward / Bed</th>
          <th>Consultant</th>
          <th>Diagnosis</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody id="ipl-tbody">
        <tr><td colspan="8" class="text-center py-5 text-body-secondary">
          <div class="spinner-border text-primary"></div><br>Loading Ledger...
        </td></tr>
      </tbody>
    </table>
  </div>

  <nav class="d-flex justify-content-between align-items-center mt-3">
    <span class="text-body-secondary small" id="ipl-page-label"></span>
    <div class="btn-group" id="ipl-pager"></div>
  </nav>
</div>


<!-- ===================== ADMIT MODAL =================================== -->
<div class="modal fade" id="modalAdmitPatient" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-body-tertiary">
        <h5 class="modal-title fw-bold text-primary">
          <i class="fa-solid fa-bed-pulse me-2"></i> New Patient Admission
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="adm-alert" class="alert d-none"></div>

        <form id="form-admission">
          <h6 class="text-body-secondary small fw-bold mb-3 border-bottom pb-1">1. PATIENT IDENTITY</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label small text-body-secondary">Patient ID</label>
              <div class="input-group">
                <input type="text" class="form-control" id="adm-pat-id" placeholder="LMTVS0001">
                <button class="btn btn-outline-primary" type="button" onclick="fetchAdmitPatientDetails()">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </button>
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-body-secondary">Patient Name</label>
              <input type="text" class="form-control" id="adm-pat-name" readonly>
            </div>
            <div class="col-md-2">
              <label class="form-label small text-body-secondary">Age</label>
              <input type="text" class="form-control" id="adm-pat-age" readonly>
            </div>
            <div class="col-md-2">
              <label class="form-label small text-body-secondary">Sex</label>
              <input type="text" class="form-control" id="adm-pat-sex" readonly>
            </div>
          </div>

          <h6 class="text-body-secondary small fw-bold mb-3 border-bottom pb-1">2. ADMISSION DETAILS</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label small text-body-secondary">Date of Admission</label>
              <input type="date" class="form-control" id="adm-doa">
            </div>
            <div class="col-md-3">
              <label class="form-label small text-body-secondary">Time of Admission</label>
              <input type="time" class="form-control" id="adm-toa">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-body-secondary">Admission Type</label>
              <select class="form-select" id="adm-type">
                <option value="Elective">Elective</option>
                <option value="Emergency">Emergency</option>
                <option value="Day Care">Day Care</option>
                <option value="Observation">Observation</option>
              </select>
            </div>
          </div>

          <h6 class="text-body-secondary small fw-bold mb-3 border-bottom pb-1">3. BED &amp; CLINICAL</h6>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label small text-body-secondary">Ward</label>
              <select class="form-select" id="adm-ward" onchange="loadAvailableBeds('adm-ward','adm-bed')">
                <option value="">Loading wards...</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-body-secondary">Available Bed</label>
              <select class="form-select" id="adm-bed">
                <option value="">Select Ward First...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-body-secondary">Consultant</label>
              <input type="text" class="form-control" id="adm-doctor" placeholder="Dr. ...">
            </div>
            <div class="col-12">
              <label class="form-label small text-body-secondary">Provisional Diagnosis</label>
              <textarea class="form-control" id="adm-diagnosis" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer bg-body-tertiary">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary px-4 fw-bold" id="btn-submit-admit" onclick="submitAdmission()">
          Admit &amp; Generate IP
        </button>
      </div>
    </div>
  </div>
</div>


<!-- ===================== TRANSFER MODAL ================================ -->
<div class="modal fade" id="modalChangeBed" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-body-tertiary">
        <h5 class="modal-title fw-bold text-warning">
          <i class="fa-solid fa-right-left me-2"></i> Transfer Bed
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="transfer-ip-no">
        <input type="hidden" id="transfer-old-bed">
        <div class="mb-3">
          <label class="form-label small text-body-secondary">Current Ward / Bed</label>
          <input type="text" class="form-control" id="transfer-current" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label small text-body-secondary">New Ward</label>
          <select class="form-select" id="transfer-ward" onchange="loadAvailableBeds('transfer-ward','transfer-bed')">
            <option value="">Loading wards...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small text-body-secondary fw-bold">New Available Bed</label>
          <select class="form-select" id="transfer-bed">
            <option value="">Select Ward First...</option>
          </select>
        </div>
      </div>
      <div class="modal-footer bg-body-tertiary">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning px-4 fw-bold" id="btn-submit-transfer" onclick="submitBedTransfer()">
          Confirm Transfer
        </button>
      </div>
    </div>
  </div>
</div>


<script>
(function () {
  'use strict';

  // Current query state. The client caches nothing but this.
  var iplQuery = {
    status: 'ACTIVE', search: '', ward: '', consultant: '',
    fromDate: '', toDate: '', page: 1, pageSize: 25
  };
  var iplFacetsLoaded = false;
  var iplSearchTimer = null;
  var iplInFlight = false;

  // ---- small helpers ------------------------------------------------------

  function $(id) { return document.getElementById(id); }

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function setBody(html) { var tb = $('ipl-tbody'); if (tb) tb.innerHTML = html; }

  function message(inner, tone) {
    setBody('<tr><td colspan="8" class="text-center py-5 ' +
            (tone === 'error' ? 'text-danger' : 'text-body-secondary') + '">' + inner + '</td></tr>');
  }

  function retryBtn() {
    return '<br><button class="btn btn-sm btn-outline-secondary mt-3" onclick="loadIPLedger()">Retry</button>';
  }

  function bridgeReady() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  // ---- filter controls ----------------------------------------------------

  function iplSetStatus(status) {
    iplQuery.status = status;
    iplQuery.page = 1;
    ['ACTIVE', 'DISCHARGED', 'ALL'].forEach(function (s) {
      var b = $('ipl-pill-' + s);
      if (!b) return;
      b.className = 'btn btn-sm ' + (s === status ? 'btn-primary' : 'btn-outline-primary');
    });
    loadIPLedger();
  }

  function iplApply() {
    iplQuery.ward       = $('ipl-ward') ? $('ipl-ward').value : '';
    iplQuery.consultant = $('ipl-consultant') ? $('ipl-consultant').value : '';
    iplQuery.fromDate   = $('ipl-from') ? $('ipl-from').value : '';
    iplQuery.toDate     = $('ipl-to') ? $('ipl-to').value : '';
    iplQuery.page = 1;
    loadIPLedger();
  }

  function iplDebouncedSearch() {
    clearTimeout(iplSearchTimer);
    iplSearchTimer = setTimeout(function () {
      iplQuery.search = $('ipl-search') ? $('ipl-search').value.trim() : '';
      iplQuery.page = 1;
      loadIPLedger();
    }, 350);
  }

  function iplSetPageSize() {
    iplQuery.pageSize = parseInt($('ipl-page-size').value, 10) || 25;
    iplQuery.page = 1;
    loadIPLedger();
  }

  function iplResetFilters() {
    iplQuery.search = ''; iplQuery.ward = ''; iplQuery.consultant = '';
    iplQuery.fromDate = ''; iplQuery.toDate = ''; iplQuery.page = 1;
    ['ipl-search', 'ipl-ward', 'ipl-consultant', 'ipl-from', 'ipl-to'].forEach(function (id) {
      if ($(id)) $(id).value = '';
    });
    loadIPLedger();
  }

  function iplGoPage(n) {
    iplQuery.page = n;
    loadIPLedger();
  }

  // ---- load ---------------------------------------------------------------

  function loadIPLedger() {
    if (iplInFlight) return;           // stop rapid clicks stacking requests
    message('<div class="spinner-border text-primary"></div><br>Fetching Live Ledger...');

    if (!bridgeReady()) {
      message('&#9888; Backend bridge unavailable on this page.' + retryBtn(), 'error');
      return;
    }

    iplInFlight = true;
    google.script.run
      .withSuccessHandler(function (payload) {
        iplInFlight = false;
        try {
          renderLedgerPage(payload);
        } catch (err) {
          message('&#9888; Render error: ' + esc(err && err.message) + retryBtn(), 'error');
        }
      })
      .withFailureHandler(function (err) {
        iplInFlight = false;
        message('&#9888; Server Error: ' + esc(err && err.message) + retryBtn(), 'error');
      })
      .getIPLedgerPage(iplQuery);
  }

  function renderLedgerPage(p) {
    if (!p) {
      message('&#9888; Backend returned nothing. Check for a duplicate ' +
              '<code>getIPLedgerPage</code> in another .gs file.' + retryBtn(), 'error');
      return;
    }
    if (p.success === false) {
      message('&#9888; ' + esc(p.message || 'Could not load ledger.') + retryBtn(), 'error');
      return;
    }

    if ($('ipl-active-count')) $('ipl-active-count').textContent = p.activeCount || 0;
    populateFacets(p.facets);

    var rows = Array.isArray(p.data) ? p.data : [];

    if ($('ipl-summary')) {
      $('ipl-summary').textContent = p.total
        ? p.total + ' matching admission' + (p.total === 1 ? '' : 's')
        : '';
    }

    if (!rows.length) {
      renderPager(p);
      var filtered = iplQuery.search || iplQuery.ward || iplQuery.consultant ||
                     iplQuery.fromDate || iplQuery.toDate || iplQuery.status !== 'ALL';
      message('<i class="fa-solid fa-folder-open fa-2x mb-3 d-block opacity-50"></i>' +
        (filtered
          ? 'No admissions match these filters.<br>' +
            '<button class="btn btn-sm btn-outline-secondary mt-3" onclick="iplResetFilters()">Clear filters</button>'
          : 'No admissions recorded yet.<br><small>Use <strong>New Admission</strong> to admit the first patient.</small>'));
      return;
    }

    var html = '';
    rows.forEach(function (row) {
      var isLive = (row.status === 'ACTIVE' || row.status === 'ADMITTED');

      var badge = isLive
        ? '<span class="badge text-bg-success">Active</span>'
        : '<span class="badge text-bg-secondary">Discharged</span>' +
          (row.dod ? '<br><small class="text-body-secondary">' + esc(row.dod) + '</small>' : '');

      var warn = row.dataWarning
        ? ' <i class="fa-solid fa-triangle-exclamation text-warning" title="' + esc(row.dataWarning) + '"></i>'
        : '';

      var args = '&#39;' + esc(row.ipNumber) + '&#39;,&#39;' + esc(row.bed) +
                 '&#39;,&#39;' + esc(row.ward) + '&#39;';

      var actions = isLive
        ? '<button class="btn btn-sm btn-outline-warning me-1" title="Transfer bed" ' +
            'onclick="openChangeBedModal(' + args + ')"><i class="fa-solid fa-right-left"></i></button>' +
          '<button class="btn btn-sm btn-outline-danger" title="Discharge" ' +
            'onclick="confirmDischarge(' + args + ')"><i class="fa-solid fa-door-open"></i></button>'
        : '<span class="text-body-secondary small">&mdash;</span>';

      html += '<tr>' +
        '<td class="fw-bold">' + esc(row.ipNumber) + '</td>' +
        '<td>' + esc(row.patientName) +
          '<br><small class="text-body-secondary">' + esc(row.patientId) +
          ' &middot; ' + esc(row.ageSex) + '</small></td>' +
        '<td>' + esc(row.doa) +
          (row.toa ? '<br><small class="text-body-secondary">' + esc(row.toa) + '</small>' : '') + '</td>' +
        '<td>' + ((row.ward || row.bed)
                    ? esc(row.ward) + ' / ' + esc(row.bed) + warn
                    : '<span class="text-body-secondary">Unassigned</span>') + '</td>' +
        '<td>' + esc(row.consultant) + '</td>' +
        '<td>' + (row.diagnosis ? esc(row.diagnosis)
                                : '<span class="text-body-secondary">Pending</span>') + '</td>' +
        '<td>' + badge + '</td>' +
        '<td class="text-end text-nowrap">' + actions + '</td>' +
        '</tr>';
    });

    setBody(html);
    renderPager(p);
  }

  function populateFacets(facets) {
    if (iplFacetsLoaded || !facets) return;

    var fill = function (id, values, allLabel) {
      var el = $(id);
      if (!el) return;
      var current = el.value;
      el.innerHTML = '<option value="">' + allLabel + '</option>' +
        (values || []).map(function (v) {
          return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
        }).join('');
      el.value = current;
    };

    fill('ipl-ward', facets.wards, 'All wards');
    fill('ipl-consultant', facets.consultants, 'All consultants');
    iplFacetsLoaded = true;
  }

  function renderPager(p) {
    var pager = $('ipl-pager');
    var label = $('ipl-page-label');
    if (!pager) return;

    var total = p.total || 0;
    var totalPages = p.totalPages || 0;
    var page = p.page || 1;

    if (label) {
      if (!total) { label.textContent = ''; }
      else {
        var first = (page - 1) * p.pageSize + 1;
        var last = Math.min(page * p.pageSize, total);
        label.textContent = 'Showing ' + first + '\u2013' + last + ' of ' + total;
      }
    }

    if (totalPages <= 1) { pager.innerHTML = ''; return; }

    // Windowed page numbers: never render 40 buttons.
    var btn = function (n, text, disabled, active) {
      return '<button class="btn btn-sm ' +
             (active ? 'btn-primary' : 'btn-outline-secondary') + '"' +
             (disabled ? ' disabled' : ' onclick="iplGoPage(' + n + ')"') + '>' +
             text + '</button>';
    };

    var out = btn(page - 1, '&laquo;', page <= 1, false);
    var from = Math.max(1, page - 2);
    var to = Math.min(totalPages, from + 4);
    from = Math.max(1, to - 4);

    if (from > 1) out += btn(1, '1', false, false) +
                         (from > 2 ? '<button class="btn btn-sm btn-outline-secondary" disabled>&hellip;</button>' : '');
    for (var n = from; n <= to; n++) out += btn(n, String(n), false, n === page);
    if (to < totalPages) out += (to < totalPages - 1 ? '<button class="btn btn-sm btn-outline-secondary" disabled>&hellip;</button>' : '') +
                                btn(totalPages, String(totalPages), false, false);

    out += btn(page + 1, '&raquo;', page >= totalPages, false);
    pager.innerHTML = out;
  }

  // ---- wards --------------------------------------------------------------

  function loadWardOptions() {
    if (!bridgeReady()) return;
    google.script.run
      .withSuccessHandler(function (res) {
        var wards = (res && Array.isArray(res.data)) ? res.data : [];
        var opts = '<option value="">Select Ward...</option>' +
          wards.map(function (w) {
            return '<option value="' + esc(w) + '">' + esc(w) + '</option>';
          }).join('');
        ['adm-ward', 'transfer-ward'].forEach(function (id) {
          if ($(id)) $(id).innerHTML = wards.length ? opts : '<option value="">No wards configured</option>';
        });
      })
      .withFailureHandler(function () {
        ['adm-ward', 'transfer-ward'].forEach(function (id) {
          if ($(id)) $(id).innerHTML = '<option value="">Error loading wards</option>';
        });
      })
      .getWardList();
  }

  function loadAvailableBeds(wardSelectId, bedSelectId) {
    var wardEl = $(wardSelectId), bedEl = $(bedSelectId);
    if (!wardEl || !bedEl) return;

    if (!wardEl.value) { bedEl.innerHTML = '<option value="">Select Ward First...</option>'; return; }
    bedEl.innerHTML = '<option value="">Loading beds...</option>';

    google.script.run
      .withSuccessHandler(function (res) {
        var beds = (res && Array.isArray(res.data)) ? res.data : [];
        bedEl.innerHTML = beds.length
          ? '<option value="">Select Bed...</option>' +
            beds.map(function (b) { return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('')
          : '<option value="">No beds available in this ward</option>';
      })
      .withFailureHandler(function (err) {
        bedEl.innerHTML = '<option value="">Error loading beds</option>';
        alert('Bed lookup failed: ' + err.message);
      })
      .getAvailableBedsByWard(wardEl.value);
  }

  // ---- admit --------------------------------------------------------------

  function admAlert(msg, level) {
    var box = $('adm-alert');
    if (!box) return;
    if (!msg) { box.className = 'alert d-none'; box.textContent = ''; return; }
    box.className = 'alert alert-' + (level || 'warning') + ' py-2 small mb-3';
    box.textContent = msg;
  }

  function prepAdmitModal() {
    var form = $('form-admission');
    if (form) form.reset();
    ['adm-pat-name', 'adm-pat-age', 'adm-pat-sex'].forEach(function (id) { if ($(id)) $(id).value = ''; });
    admAlert('');

    var now = new Date();
    if ($('adm-doa')) $('adm-doa').value = now.toISOString().slice(0, 10);
    if ($('adm-toa')) $('adm-toa').value =
      ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);

    loadWardOptions();
  }

  function fetchAdmitPatientDetails() {
    var idEl = $('adm-pat-id');
    if (!idEl || !idEl.value.trim()) { admAlert('Enter a Patient ID first.'); return; }
    admAlert('');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.success === false) {
          admAlert((res && res.message) || 'Patient not found.', 'danger');
          return;
        }
        idEl.value = res.data.patientId;
        if ($('adm-pat-name')) $('adm-pat-name').value = res.data.name || '';
        if ($('adm-pat-age'))  $('adm-pat-age').value  = res.data.age || '';
        if ($('adm-pat-sex'))  $('adm-pat-sex').value  = res.data.sex || '';

        if (res.activeAdmission) {
          admAlert('This patient is already admitted under ' + res.activeAdmission +
                   '. Discharge that admission before creating a new one.', 'danger');
        }
      })
      .withFailureHandler(function (err) { admAlert('Lookup failed: ' + err.message, 'danger'); })
      .fetchPatientForAdmit(idEl.value.trim());
  }

  function submitAdmission() {
    var val = function (id) { return $(id) ? $(id).value.trim() : ''; };

    if (!val('adm-pat-id') || !val('adm-pat-name')) { admAlert('Look up a valid Patient ID first.'); return; }
    if (!val('adm-ward')) { admAlert('Select a ward.'); return; }
    if (!val('adm-bed'))  { admAlert('Select an available bed.'); return; }
    admAlert('');

    var payload = {
      patientId: val('adm-pat-id'),
      patientName: val('adm-pat-name'),
      ageSex: val('adm-pat-age') + ' / ' + val('adm-pat-sex'),
      doa: val('adm-doa'), toa: val('adm-toa'), type: val('adm-type'),
      ward: val('adm-ward'), bed: val('adm-bed'),
      consultant: val('adm-doctor'), diagnosis: val('adm-diagnosis')
    };

    var btn = $('btn-submit-admit');
    var reset = function () { if (btn) { btn.innerHTML = 'Admit &amp; Generate IP'; btn.disabled = false; } };
    if (btn) {
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
      btn.disabled = true;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        reset();
        if (!res || res.success === false) { admAlert((res && res.message) || 'Admission failed.', 'danger'); return; }
        var inst = bootstrap.Modal.getInstance($('modalAdmitPatient'));
        if (inst) inst.hide();
        alert(res.message);
        iplFacetsLoaded = false;   // a new ward or consultant may now exist
        iplSetStatus('ACTIVE');
      })
      .withFailureHandler(function (err) { reset(); admAlert('Error saving admission: ' + err.message, 'danger'); })
      .saveNewAdmissionLedger(payload);
  }

  // ---- transfer -----------------------------------------------------------

  function openChangeBedModal(ipNumber, currentBed, currentWard) {
    if ($('transfer-ip-no'))   $('transfer-ip-no').value = ipNumber;
    if ($('transfer-old-bed')) $('transfer-old-bed').value = currentBed;
    if ($('transfer-current')) $('transfer-current').value = (currentWard || '?') + ' / ' + (currentBed || '?');
    if ($('transfer-bed'))     $('transfer-bed').innerHTML = '<option value="">Select Ward First...</option>';
    loadWardOptions();
    new bootstrap.Modal($('modalChangeBed')).show();
  }

  function submitBedTransfer() {
    var val = function (id) { return $(id) ? $(id).value.trim() : ''; };
    if (!val('transfer-ward')) { alert('Select a destination ward.'); return; }
    if (!val('transfer-bed'))  { alert('Select a destination bed.'); return; }

    var btn = $('btn-submit-transfer');
    var reset = function () { if (btn) { btn.innerText = 'Confirm Transfer'; btn.disabled = false; } };
    if (btn) { btn.innerText = 'Transferring...'; btn.disabled = true; }

    google.script.run
      .withSuccessHandler(function (res) {
        reset();
        if (!res || res.success === false) { alert((res && res.message) || 'Transfer failed.'); return; }
        var inst = bootstrap.Modal.getInstance($('modalChangeBed'));
        if (inst) inst.hide();
        alert(res.message);
        loadIPLedger();
      })
      .withFailureHandler(function (err) { reset(); alert('Transfer failed: ' + err.message); })
      .processBedTransfer(val('transfer-ip-no'), val('transfer-old-bed'),
                          val('transfer-ward'), val('transfer-bed'));
  }

  // ---- discharge ----------------------------------------------------------

  function confirmDischarge(ipNumber, bedId) {
    if (!confirm('Discharge ' + ipNumber + '?\n\nThis frees bed ' + bedId + ' and closes the admission.')) return;
    message('<div class="spinner-border text-primary"></div><br>Processing discharge...');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.success === false) alert((res && res.message) || 'Discharge failed.');
        loadIPLedger();
      })
      .withFailureHandler(function (err) { alert('Discharge failed: ' + err.message); loadIPLedger(); })
      .processPatientDischarge(ipNumber, bedId);
  }

  // ---- exports ------------------------------------------------------------

  window.loadIPLedger             = loadIPLedger;
  window.iplSetStatus             = iplSetStatus;
  window.iplApply                 = iplApply;
  window.iplDebouncedSearch       = iplDebouncedSearch;
  window.iplSetPageSize           = iplSetPageSize;
  window.iplResetFilters          = iplResetFilters;
  window.iplGoPage                = iplGoPage;
  window.prepAdmitModal           = prepAdmitModal;
  window.fetchAdmitPatientDetails = fetchAdmitPatientDetails;
  window.loadAvailableBeds        = loadAvailableBeds;
  window.submitAdmission          = submitAdmission;
  window.openChangeBedModal       = openChangeBedModal;
  window.submitBedTransfer        = submitBedTransfer;
  window.confirmDischarge         = confirmDischarge;

  // Backwards compatibility: older callers may still invoke filterLedger().
  window.filterLedger = loadIPLedger;
})();
</script>
