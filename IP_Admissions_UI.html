<!-- ===================== (B) SCRIPT BLOCK ============================== -->
<script>
let ledgerDataMaster = [];
 
/** Escape user/DB text before it touches innerHTML. */
function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
 
function ledgerMessage(html, tone) {
  const tbody = document.getElementById('ip-ledger-tbody');
  if (!tbody) return;
  const cls = tone === 'error' ? 'text-danger' : 'text-body-secondary';
  tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5 ${cls}">${html}</td></tr>`;
}
 
function loadIPLedger() {
  ledgerMessage('<div class="spinner-border text-primary"></div><br>Fetching Live Ledger...');
 
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    ledgerMessage('&#9888; Backend bridge unavailable on this page.', 'error');
    return;
  }
 
  google.script.run
    .withSuccessHandler(function (payload) {
      // Wrapped: an exception here would otherwise leave the spinner forever
      // with NO failure handler firing and NO console error.
      try {
        renderLedgerTable(payload);
      } catch (err) {
        ledgerMessage('&#9888; Render error: ' + esc(err && err.message) +
          '<br><button class="btn btn-sm btn-outline-secondary mt-3" onclick="loadIPLedger()">Retry</button>',
          'error');
      }
    })
    .withFailureHandler(function (err) {
      ledgerMessage('&#9888; Server Error: ' + esc(err && err.message) +
        '<br><button class="btn btn-sm btn-outline-secondary mt-3" onclick="loadIPLedger()">Retry</button>',
        'error');
    })
    .getIPLedgerData();
}
 
function renderLedgerTable(payload) {
  // Guard the three ways this used to blow up.
  if (!payload) {
    ledgerMessage('&#9888; Backend returned nothing. Check for a duplicate ' +
      '<code>getIPLedgerData</code> definition in another .gs file.', 'error');
    return;
  }
  if (payload.success === false) {
    ledgerMessage('&#9888; ' + esc(payload.message || 'Could not load ledger.'), 'error');
    return;
  }
  ledgerDataMaster = Array.isArray(payload.data) ? payload.data : [];
  filterLedger();
}
 
function filterLedger() {
  const tbody = document.getElementById('ip-ledger-tbody');
  if (!tbody) return; // module not in the DOM yet — bail, don't throw
 
  const searchEl = document.getElementById('ledger-search');
  const statusEl = document.getElementById('ledger-filter-status');
  const query = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const statusFilter = statusEl ? statusEl.value : 'ALL';
 
  let html = '';
  let count = 0;
 
  ledgerDataMaster.forEach(function (row) {
    const ip = String(row.ipNumber || '').toLowerCase();
    const pid = String(row.patientId || '').toLowerCase();
    const nm = String(row.patientName || '').toLowerCase();
    const matchSearch = !query || ip.indexOf(query) > -1 ||
                        pid.indexOf(query) > -1 || nm.indexOf(query) > -1;
 
    const rowStat = String(row.status || '').toUpperCase();
    const isLive = (rowStat === 'ACTIVE' || rowStat === 'ADMITTED');
 
    let matchStatus = false;
    if (statusFilter === 'ALL') matchStatus = true;
    else if (statusFilter === 'ACTIVE' && isLive) matchStatus = true;
    else if (statusFilter === 'DISCHARGED' && rowStat === 'DISCHARGED') matchStatus = true;
 
    if (!matchSearch || !matchStatus) return;
    count++;
 
    const statusBadge = isLive
      ? '<span class="badge text-bg-success">Active</span>'
      : '<span class="badge text-bg-secondary">Discharged</span>' +
        (row.dod ? '<br><small class="text-body-secondary">' + esc(row.dod) + '</small>' : '');
 
    const args = "'" + esc(row.ipNumber) + "','" + esc(row.bed) + "','" + esc(row.ward) + "'";
    const actions = isLive
      ? '<button class="btn btn-sm btn-outline-warning me-1" onclick="openChangeBedModal(' + args + ')">' +
        '<i class="fa-solid fa-right-left"></i></button>' +
        '<button class="btn btn-sm btn-outline-danger" onclick="confirmDischarge(' + args + ')">' +
        '<i class="fa-solid fa-door-open"></i></button>'
      : '<span class="text-body-secondary small">&mdash;</span>';
 
    html += '<tr>' +
      '<td class="fw-bold">' + esc(row.ipNumber) + '</td>' +
      '<td>' + esc(row.patientName) +
        '<br><small class="text-body-secondary">' + esc(row.patientId) + ' &middot; ' + esc(row.ageSex) + '</small></td>' +
      '<td>' + esc(row.doa) + '<br><small class="text-body-secondary">' + esc(row.toa) + '</small></td>' +
      '<td>' + (row.ward || row.bed ? esc(row.ward) + ' / ' + esc(row.bed) : '<span class="text-body-secondary">Unassigned</span>') + '</td>' +
      '<td>' + esc(row.consultant) + '</td>' +
      '<td>' + (row.diagnosis ? esc(row.diagnosis) : '<span class="text-body-secondary">Pending</span>') + '</td>' +
      '<td>' + statusBadge + '</td>' +
      '<td class="text-end">' + actions + '</td>' +
      '</tr>';
  });
 
  const countEl = document.getElementById('ledger-count');
  if (countEl) countEl.textContent = count + ' of ' + ledgerDataMaster.length + ' shown';
 
  if (count === 0) {
    const empty = ledgerDataMaster.length === 0
      ? 'No admissions recorded yet.<br><small>Use <strong>New Admission</strong> to admit the first patient.</small>'
      : 'No admissions match this search or filter.';
    ledgerMessage('<i class="fa-solid fa-folder-open fa-2x mb-3 d-block opacity-50"></i>' + empty);
    return;
  }
  tbody.innerHTML = html;
}
 
// ---- Admit modal ---------------------------------------------------------
 
function prepAdmitModal() {
  const form = document.getElementById('form-admission');
  if (form) form.reset();
  ['adm-pat-name', 'adm-pat-age', 'adm-pat-sex'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
}
 
function fetchAdmitPatientDetails() {
  const idEl = document.getElementById('adm-pat-id');
  if (!idEl || !idEl.value.trim()) { alert('Enter a Patient ID first.'); return; }
 
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.success === false) {
        alert((res && res.message) || 'Patient not found.');
        return;
      }
      const setVal = function (id, v) {
        const el = document.getElementById(id);
        if (el) el.value = v || '';
      };
      setVal('adm-pat-name', res.data.name);
      setVal('adm-pat-age', res.data.age);
      setVal('adm-pat-sex', res.data.sex);
    })
    .withFailureHandler(function (err) { alert('Lookup failed: ' + err.message); })
    .fetchPatientForAdmit(idEl.value.trim());
}
 
function loadAvailableBeds(wardSelectId, bedSelectId) {
  const wardEl = document.getElementById(wardSelectId);
  const bedEl = document.getElementById(bedSelectId);
  if (!wardEl || !bedEl) return;
 
  if (!wardEl.value) { bedEl.innerHTML = '<option value="">Select Ward First...</option>'; return; }
  bedEl.innerHTML = '<option value="">Loading beds...</option>';
 
  google.script.run
    .withSuccessHandler(function (res) {
      const beds = (res && Array.isArray(res.data)) ? res.data : [];
      if (!beds.length) { bedEl.innerHTML = '<option value="">No beds available</option>'; return; }
      bedEl.innerHTML = '<option value="">Select Bed...</option>' +
        beds.map(function (b) { return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('');
    })
    .withFailureHandler(function (err) {
      bedEl.innerHTML = '<option value="">Error loading beds</option>';
      alert('Bed lookup failed: ' + err.message);
    })
    .getAvailableBedsByWard(wardEl.value);
}
 
function submitAdmission() {
  const val = function (id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
 
  const pid = val('adm-pat-id');
  const name = val('adm-pat-name');
  const bed = val('adm-bed');
  if (!pid || !name) { alert('Look up a valid Patient ID first.'); return; }
  if (!bed) { alert('Select an available bed.'); return; }
 
  const payload = {
    patientId: pid,
    patientName: name,
    ageSex: val('adm-pat-age') + ' / ' + val('adm-pat-sex'),
    doa: val('adm-doa'),
    toa: val('adm-toa'),
    type: val('adm-type'),
    ward: val('adm-ward'),
    bed: bed,
    consultant: val('adm-doctor'),
    diagnosis: val('adm-diagnosis')
  };
 
  const btn = document.getElementById('btn-submit-admit');
  const reset = function () {
    if (btn) { btn.innerHTML = 'Admit &amp; Generate IP'; btn.disabled = false; }
  };
  if (btn) {
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
    btn.disabled = true;
  }
 
  google.script.run
    .withSuccessHandler(function (res) {
      reset();
      if (!res || res.success === false) { alert((res && res.message) || 'Admission failed.'); return; }
      alert(res.message);
      const modalEl = document.getElementById('modalAdmitPatient');
      const inst = modalEl ? bootstrap.Modal.getInstance(modalEl) : null;
      if (inst) inst.hide();
      loadIPLedger();
    })
    .withFailureHandler(function (err) { reset(); alert('Error saving admission: ' + err.message); })
    .saveNewAdmissionLedger(payload);
}
 
// ---- Bed transfer --------------------------------------------------------
 
function openChangeBedModal(ipNumber, currentBed, currentWard) {
  const set = function (id, v) { const el = document.getElementById(id); if (el) el.value = v; };
  set('transfer-ip-no', ipNumber);
  set('transfer-old-bed', currentBed);
  set('transfer-current', currentWard + ' - ' + currentBed);
  set('transfer-ward', '');
  const bedEl = document.getElementById('transfer-bed');
  if (bedEl) bedEl.innerHTML = '<option value="">Select Ward First...</option>';
  new bootstrap.Modal(document.getElementById('modalChangeBed')).show();
}
 
function submitBedTransfer() {
  const val = function (id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const newBed = val('transfer-bed');
  if (!newBed) { alert('Please select a new bed.'); return; }
 
  const btn = document.getElementById('btn-submit-transfer');
  const reset = function () { if (btn) { btn.innerText = 'Confirm Transfer'; btn.disabled = false; } };
  if (btn) { btn.innerText = 'Transferring...'; btn.disabled = true; }
 
  google.script.run
    .withSuccessHandler(function (res) {
      reset();
      if (!res || res.success === false) { alert((res && res.message) || 'Transfer failed.'); return; }
      alert(res.message);
      const inst = bootstrap.Modal.getInstance(document.getElementById('modalChangeBed'));
      if (inst) inst.hide();
      loadIPLedger();
    })
    .withFailureHandler(function (err) { reset(); alert('Transfer failed: ' + err.message); })
    .processBedTransfer(val('transfer-ip-no'), val('transfer-old-bed'), val('transfer-ward'), newBed);
}
 
// ---- Discharge -----------------------------------------------------------
 
function confirmDischarge(ipNumber, bedId) {
  if (!confirm('Discharge ' + ipNumber + '? This frees bed ' + bedId + '.')) return;
  ledgerMessage('<div class="spinner-border text-primary"></div><br>Processing discharge...');
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.success === false) { alert((res && res.message) || 'Discharge failed.'); }
      loadIPLedger();
    })
    .withFailureHandler(function (err) { alert('Discharge failed: ' + err.message); loadIPLedger(); })
    .processPatientDischarge(ipNumber, bedId);
}
</script>
