<style>
  /* Custom Static Labels */
  .custom-label-dark {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    display: inline-block;
  }
  
  /* Custom Inputs with Soft Glow on Focus */
  .custom-input-dark {
    background-color: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 0.6rem 0.75rem;
    border-radius: 0.375rem;
    transition: all 0.3s ease;
  }
  .custom-input-dark:focus {
    background-color: var(--surface-3);
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 3px var(--accent-glow);
    outline: none;
  }
  .custom-input-dark::placeholder {
    color: var(--text-muted);
  }
</style>

<div id="pharmacy-inventory-view" class="page-section d-none animate-fade-in w-100">
  <div class="container-fluid py-3 pb-5 mb-5">
    
    <div class="d-flex align-items-center mb-4">
      <button class="btn btn-outline-secondary me-3" onclick="switchTab('tab-admin-pharmacy'); loadPharmacyInventory();">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h4 class="text-light fw-bold mb-0">
        <i class="fa-solid fa-boxes-stacked text-info me-2"></i>Pharmacy Stock Entry
      </h4>
    </div>

    <div class="card bg-dark border-secondary shadow-lg">
      <div class="card-body p-4">
        <form id="pharmacyStockForm" onsubmit="event.preventDefault(); submitPharmacyStock();">
          
          <div class="row g-4">
            <div class="col-md-6 col-12">
              <div>
                <label class="custom-label-dark" for="medicineName">Medicine Name (Brand)</label>
                <input type="text" class="form-control custom-input-dark" id="medicineName" placeholder="e.g. Dolo 650" required>
              </div>
            </div>
            <div class="col-md-6 col-12">
              <div>
                <label class="custom-label-dark" for="genericName">Drug Name (Generic / Composition)</label>
                <input type="text" class="form-control custom-input-dark" id="genericName" placeholder="e.g. Paracetamol" required>
              </div>
            </div>

            <div class="col-md-4 col-12">
              <div>
                <label class="custom-label-dark" for="drugType">Drug Type</label>
                <select class="form-select custom-input-dark" id="drugType" required>
                  <option value="" disabled selected>Select Type...</option>
                  <option value="Tablet">Tablet (Tab)</option>
                  <option value="Capsule">Capsule (Cap)</option>
                  <option value="Syrup">Syrup (Syp)</option>
                  <option value="Injection">Injection (Inj)</option>
                  <option value="Ointment">Ointment (Oint)</option>
                  <option value="Drops">Drops</option>
                  <option value="Consumable">Consumable</option>
                </select>
              </div>
            </div>
            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="stockQty">Stock Quantity</label>
                <input type="number" class="form-control custom-input-dark" id="stockQty" placeholder="e.g. 100" min="1" required>
              </div>
            </div>
            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="stockUnit">Unit</label>
                <select class="form-select custom-input-dark" id="stockUnit" required>
                  <option value="" disabled selected>Select Unit...</option>
                  <option value="Strips">Strips</option>
                  <option value="Tablets">Tablets</option>
                  <option value="Bottles">Bottles</option>
                  <option value="Vials">Vials</option>
                  <option value="Ampoulles">Ampoulles</option>
                  <option value="Tubes">Tubes</option>
                  <option value="Pieces">Pieces</option>
                </select>
              </div>
            </div>

            <div class="col-md-4 col-12">
              <div>
                <label class="custom-label-dark" for="batchNo">Batch Number</label>
                <input type="text" class="form-control custom-input-dark text-uppercase" id="batchNo" placeholder="e.g. AB1234" required>
              </div>
            </div>
            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="expiryDate">Expiry Date</label>
                <input type="month" class="form-control custom-input-dark" id="expiryDate" required>
              </div>
            </div>
            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="rackLocation">Rack / Shelf Location</label>
                <input type="text" class="form-control custom-input-dark text-uppercase" id="rackLocation" placeholder="e.g. RACK-A1">
              </div>
            </div>

            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="buyPrice">Buy Price (₹)</label>
                <input type="number" step="0.01" class="form-control custom-input-dark" id="buyPrice" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-4 col-6">
              <div>
                <label class="custom-label-dark" for="mrp">M.R.P (₹)</label>
                <input type="number" step="0.01" class="form-control custom-input-dark" id="mrp" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-4 col-12">
              <div>
                <label class="custom-label-dark" for="gstPercent">GST (%)</label>
                <input type="number" step="0.1" class="form-control custom-input-dark" id="gstPercent" placeholder="12" required>
              </div>
            </div>

            <div class="col-md-6 col-12">
              <div>
                <label class="custom-label-dark" for="manufacturer">Manufacturer</label>
                <input type="text" class="form-control custom-input-dark" id="manufacturer" placeholder="e.g. Cipla" required>
              </div>
            </div>
            <div class="col-md-6 col-12">
              <div>
                <label class="custom-label-dark" for="supplierName">Supplier / Vendor Name</label>
                <input type="text" class="form-control custom-input-dark" id="supplierName" placeholder="e.g. Apollo Distributors">
              </div>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>

  <button id="fab-save-stock" type="submit" form="pharmacyStockForm" class="btn btn-info rounded-circle shadow-lg position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center transition-all" style="width: 65px; height: 65px; z-index: 1050; border: 3px solid var(--border-color);">
    <i class="fa-solid fa-check fs-3 text-dark"></i>
  </button>
</div>

<script>
  function submitPharmacyStock() {
    const form = document.getElementById('pharmacyStockForm');
    const fabBtn = document.getElementById('fab-save-stock');
    
    // FAB Loading State
    const originalIcon = '<i class="fa-solid fa-check fs-3 text-dark"></i>';
    fabBtn.innerHTML = '<span class="spinner-border spinner-border-sm text-dark" style="width: 1.5rem; height: 1.5rem;" role="status"></span>';
    fabBtn.disabled = true;

    // Construct Payload
    const payload = {
      timestamp: new Date().toISOString(),
      medicineName: document.getElementById('medicineName').value.trim(),
      genericName: document.getElementById('genericName').value.trim(),
      drugType: document.getElementById('drugType').value,
      qty: document.getElementById('stockQty').value,
      unit: document.getElementById('stockUnit').value,
      batchNo: document.getElementById('batchNo').value.trim().toUpperCase(),
      expiryDate: document.getElementById('expiryDate').value,
      rackLocation: document.getElementById('rackLocation').value.trim().toUpperCase() || 'N/A',
      buyPrice: document.getElementById('buyPrice').value,
      mrp: document.getElementById('mrp').value,
      gst: document.getElementById('gstPercent').value,
      manufacturer: document.getElementById('manufacturer').value.trim(),
      supplier: document.getElementById('supplierName').value.trim() || 'N/A'
    };

    // Dispatch to Backend
    google.script.run
      .withSuccessHandler((response) => {
        if(response.success) {
          form.reset();
          showToast('Stock added', response.message, 'success');
        } else {
          alert('Failed to add stock: ' + response.message);
        }
        fabBtn.innerHTML = originalIcon;
        fabBtn.disabled = false;
      })
      .withFailureHandler((error) => {
        alert('Connection Error: ' + error.message);
        fabBtn.innerHTML = originalIcon;
        fabBtn.disabled = false;
      })
      .savePharmacyInventory(payload);
  }
</script>
