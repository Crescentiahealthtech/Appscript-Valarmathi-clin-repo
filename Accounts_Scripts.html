<!-- 💰 CRESCENTIA ACCOUNTS — FRONTEND (Phase 1 corrected + Phase 2).       -->
<!-- Include after Modals.html. window.AccX + Hub-and-Spoke globals.        -->
<!-- ===================================================================== -->
<script>
var AccX = (function () {
  const $ = (id) => document.getElementById(id);
  const inr = (n) => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const who = () => (window.currentUser || window.loggedInUser || window.userName || 'STAFF');

  /**
   * Every screen in the accounts area, hub first.
   *
   * The list used to name 'workspace-accounts-tax' twice and to carry
   * 'workspace-accounts-discharges' — PLURAL — which is a different id
   * from the settlement desk's 'workspace-accounts-discharge' and has no
   * markup anywhere in the project. That was the Receivables screen: its
   * controller (loadReceivables / settle, below) is intact, its tile was
   * deleted, and its markup went with the tile, so switchPage would hide
   * every other screen and then show nothing. Nothing routes to it now;
   * see the note above loadReceivables().
   */
  const PAGES = [
    'workspace-accounts',
    'workspace-accounts-dashboard',
    'workspace-accounts-ledger',
    'workspace-accounts-drawer',
    'workspace-accounts-payables',
    'workspace-accounts-tpa',
    'workspace-accounts-insurance',
    'workspace-accounts-iptab',        // Running IP Tabs — mid-stay, read-only
    'workspace-accounts-discharge',    // Discharge Settlement — the final bill
    'workspace-accounts-tax'
  ];

  let CURRENT_PERIOD = '', LEDGER_CACHE = [], CURRENT_FILTER = 'ALL';
  let modalsInjected = false;

  function busy(on) {
    let o = $('acc-overlay');
    if (on) {
      if (!o) {
        o = document.createElement('div');
        o.id = 'acc-overlay'; o.className = 'modal-overlay';
        o.innerHTML = '<div class="text-center text-light"><i class="fas fa-circle-notch fa-spin fa-2x mb-2"></i><div class="small">Working…</div></div>';
        document.body.appendChild(o);
      }
      o.style.display = 'flex';
    } else if (o) o.style.display = 'none';
  }
  /**
   * Delegates to the one toast in Shell_UX.html (top-centre).
   *
   * This module used to build its own bottom-right div. Nine modules did,
   * each a copy of the same eight lines, all of them in the corner the
   * eye never reaches — behind the floating action button on the pharmacy
   * screens, and off the fold on a phone in landscape. Keeping the local
   * name means the call sites below did not have to change.
   */
  function toast(msg, ok) {
    if (typeof window.showToast === 'function') {
      window.showToast(ok ? 'Done' : 'Could not complete', msg, ok ? 'success' : 'error');
      return;
    }
    if (typeof crescAlert === 'function') crescAlert(msg);
  }

  function switchPage(pageId) {
    // Tell the shell's router that navigation has moved on. Without this a
    // deep link into a sub-page was undone one tick later by the hub's own
    // landing init — see the NAVIGATION GENERATION note in ScriptsMV.html.
    if (typeof window.crescNavMoved === 'function') window.crescNavMoved();

    PAGES.forEach(function (id) {
      const el = $(id); if (!el) return;
      const show = (id === pageId);
      el.classList.toggle('d-none', !show);
      el.classList.toggle('active-section', show);
    });
    if (pageId === 'workspace-accounts-ledger') renderLedger();
    window.scrollTo(0, 0);
  }

  /**
   * Back to the Finance Hub, from any spoke.
   *
   * Six of the nine accounts screens had no way back at all: the Cash
   * Drawer, Payables, Tax & Audit, the Insurance Desk, Running IP Tabs and
   * the settlement desk each ended in a dead end, and the only way out was
   * the rail — which drops you at the Dashboard, not where you came from.
   */
  function backToHub() { switchPage('workspace-accounts'); load(); }

  // ---------- modals (expense + settle) ----------
  function injectModals() {
    if (modalsInjected) return; modalsInjected = true;
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal fade" id="acc-entry-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content premium-card border-0 rounded-4">
        <div class="modal-header border-bottom border-secondary border-opacity-25">
          <h6 class="modal-title fw-bold text-main">Record Expense</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="row g-3">
          <div class="col-6"><label class="form-label small text-muted">Amount (₹)</label>
            <input type="number" min="0" step="0.01" class="form-control" id="acc-entry-amount" placeholder="0.00"></div>
          <div class="col-6"><label class="form-label small text-muted">Mode</label>
            <select class="form-select" id="acc-entry-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div>
          <div class="col-6"><label class="form-label small text-muted">Category</label>
            <input class="form-control" id="acc-entry-category" placeholder="e.g. Utilities"></div>
          <\!-- Department decides WHICH DRAWER this comes out of. A cash
               expense with no department is a clinic-level payment and is
               charged to no single till, rather than to whichever one
               happens to close first. -->
          <div class="col-6"><label class="form-label small text-muted">Paid from</label>
            <select class="form-select" id="acc-entry-department">
              <option value="">Clinic-wide (no single till)</option>
              <option value="Reception">Reception drawer</option>
              <option value="Pharmacy">Pharmacy drawer</option>
              <option value="Lab">Lab drawer</option>
              <option value="Admin">Admin</option>
            </select></div>
          <div class="col-6"><label class="form-label small text-muted">Payee</label>
            <input class="form-control" id="acc-entry-entity" placeholder="Vendor / party"></div>
          <div class="col-6"><label class="form-label small text-muted">Reference ID</label>
            <input class="form-control" id="acc-entry-ref" placeholder="Invoice / bill no."></div>
          <div class="col-12"><label class="form-label small text-muted">Notes</label>
            <input class="form-control" id="acc-entry-notes" placeholder="Optional"></div></div></div>
        <div class="modal-footer border-top border-secondary border-opacity-25">
          <button class="btn btn-secondary btn-sm rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm rounded-pill px-4" id="acc-entry-save">Save Expense</button></div>
      </div></div></div>

    <div class="modal fade" id="acc-settle-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content premium-card border-0 rounded-4">
        <div class="modal-header border-bottom border-secondary border-opacity-25">
          <h6 class="modal-title fw-bold text-main">Settle Bill</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="acc-settle-source"><input type="hidden" id="acc-settle-bill">
          <p class="small text-muted mb-3" id="acc-settle-info"></p>
          <label class="form-label small text-muted">Payment Mode (cash received)</label>
          <select class="form-select" id="acc-settle-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select>
        </div>
        <div class="modal-footer border-top border-secondary border-opacity-25">
          <button class="btn btn-secondary btn-sm rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success btn-sm rounded-pill px-4" id="acc-settle-confirm">Mark Paid</button></div>
      </div></div></div>`);
    $('acc-entry-save').addEventListener('click', saveEntry);
    $('acc-settle-confirm').addEventListener('click', confirmSettle);
  }

  function openEntry() {
    injectModals();
    ['acc-entry-amount','acc-entry-category','acc-entry-entity','acc-entry-ref','acc-entry-notes']
      .forEach(id => { const e = $(id); if (e) e.value = ''; });
    if ($('acc-entry-department')) $('acc-entry-department').value = '';
    new bootstrap.Modal($('acc-entry-modal')).show();
  }
  function saveEntry() {
    const payload = {
      direction: 'OUT', amount: $('acc-entry-amount').value, mode: $('acc-entry-mode').value,
      category: $('acc-entry-category').value, department: $('acc-entry-department').value,
      entity: $('acc-entry-entity').value, refId: $('acc-entry-ref').value,
      notes: $('acc-entry-notes').value, loggedBy: who()
    };
    if (!(Number(payload.amount) > 0)) { toast('Enter a valid amount.', false); return; }
    busy(true);
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false); toast(res.message, !!res.success);
        if (res.success) { bootstrap.Modal.getInstance($('acc-entry-modal')).hide(); load(); }
      })
      .withFailureHandler(function (err) { busy(false); toast(err.message || 'Server error.', false); })
      .recordLedgerEntry(payload, window.sessionToken);
  }

  // ---------- unified ledger ----------
  /* THE DATE RANGE, as yyyy-MM-dd strings or ''. Both ends are optional:
     from alone means "everything since", to alone "everything up to". */
  let LEDGER_FROM = '', LEDGER_TO = '';

  /* A row's date as yyyy-MM-dd, for comparing against the two boxes.

     r.ts is whatever the server formatted it as, so this reads a date out of
     it rather than assuming a shape: dd-MMM-yyyy, yyyy-MM-dd and
     dd/MM/yyyy all reach the same key. A row whose date cannot be read is
     KEPT, never hidden — dropping a transaction because its timestamp is
     oddly formatted is how money goes missing from a report. */
  const MON = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06',
                jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
  function rowDateKey(row) {
    const t = String(row.ts || '').trim();
    if (!t) return '';
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = t.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{4})/);
    if (m) return m[3] + '-' + (MON[m[2].toLowerCase()] || '01') + '-' + ('0' + m[1]).slice(-2);
    m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    return '';
  }

  function matchesDate(row) {
    if (!LEDGER_FROM && !LEDGER_TO) return true;
    const k = rowDateKey(row);
    if (!k) return true;                       // unreadable date: keep it
    if (LEDGER_FROM && k < LEDGER_FROM) return false;
    if (LEDGER_TO && k > LEDGER_TO) return false;
    return true;
  }

  function dateRange() {
    LEDGER_FROM = ($('acc-ledger-from') || {}).value || '';
    LEDGER_TO   = ($('acc-ledger-to') || {}).value || '';
    if (LEDGER_FROM && LEDGER_TO && LEDGER_FROM > LEDGER_TO) {
      toast('The "from" date is after the "to" date.', false);
      return;
    }
    renderLedger();
  }

  function clearDateRange() {
    const a = $('acc-ledger-from'), b = $('acc-ledger-to');
    if (a) a.value = ''; if (b) b.value = '';
    LEDGER_FROM = ''; LEDGER_TO = '';
    renderLedger();
  }

  function matchesFilter(row) {
    if (!matchesSearch(row)) return false;
    if (!matchesDate(row)) return false;
    if (CURRENT_FILTER === 'ALL') return true;
    const cat = (row.category || '').toLowerCase().replace(/_/g, ' ');
    if (CURRENT_FILTER === 'OP_Consultation') return /op|ip|consult/.test(cat);
    return cat.indexOf(CURRENT_FILTER.toLowerCase().replace(/_/g, ' ')) !== -1;
  }

  /* Free-text search across the columns an accountant actually looks things
     up by. The ledger had category buttons and nothing else, so finding one
     transaction meant scrolling a list capped at a hundred rows. */
  let LEDGER_SEARCH = '';
  function matchesSearch(row) {
    if (!LEDGER_SEARCH) return true;
    return (String(row.txnId || '') + ' ' + String(row.entity || '') + ' ' +
            String(row.category || '') + ' ' + String(row.mode || '') + ' ' +
            String(row.ts || '')).toLowerCase().indexOf(LEDGER_SEARCH) !== -1;
  }
  function search(text) {
    LEDGER_SEARCH = String(text || '').toLowerCase().trim();
    renderLedger();
  }

  /* The running totals of what is ON SCREEN. A filtered or searched view
     with no total under it is a list; with one it answers the question that
     sent you to the ledger. */
  function renderLedgerTotals(rows) {
    const el = $('acc-ledger-totals');
    if (!el) return;
    let tin = 0, tout = 0;
    rows.forEach(function (r) { tin += Number(r.amtIn) || 0; tout += Number(r.amtOut) || 0; });
    el.innerHTML = rows.length
      ? rows.length + ' row' + (rows.length === 1 ? '' : 's') +
        ' &nbsp;·&nbsp; In <span class="text-success fw-bold">' + inr(tin) + '</span>' +
        ' &nbsp;·&nbsp; Out <span class="text-danger fw-bold">' + inr(tout) + '</span>' +
        ' &nbsp;·&nbsp; Net <span class="fw-bold">' + inr(tin - tout) + '</span>'
      : '';
  }

  function renderLedger() {
    const tb = $('master-ledger-tbody'); if (!tb) return;
    const rows = LEDGER_CACHE.filter(matchesFilter);
    renderLedgerTotals(rows);
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">' +
        (LEDGER_SEARCH ? 'Nothing matches &ldquo;' + esc(LEDGER_SEARCH) + '&rdquo;.'
                       : 'No transactions found.') + '</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(function (r) {
      const lk = r.locked ? ' <i class="fas fa-lock text-warning ms-1" title="Locked"></i>' : '';
      const ic = r.amtIn > 0 ? '<span class="text-success fw-semibold">' + inr(r.amtIn) + '</span>' : '<span class="text-muted">—</span>';
      const oc = r.amtOut > 0 ? '<span class="text-danger fw-semibold">' + inr(r.amtOut) + '</span>' : '<span class="text-muted">—</span>';
      return '<tr><td class="px-4 small">' + esc(r.ts) + '</td><td class="small font-monospace">' + esc(r.txnId) + lk +
        '</td><td class="small">' + esc(r.category) + '</td><td class="small">' + esc(r.entity) +
        '</td><td class="small">' + esc(r.mode) + '</td><td class="text-end px-4">' + ic +
        '</td><td class="text-end px-4">' + oc + '</td></tr>';
    }).join('');
  }
  function filter(cat) { CURRENT_FILTER = cat || 'ALL'; renderLedger(); }

  /**
   * Downloads what the ledger is currently showing, as CSV.
   *
   * The Export button has been on this toolbar from the start with NO
   * handler behind it at all - an accountant pressed it and nothing
   * happened, every time.
   *
   * It exports the FILTERED view rather than everything, because the filter
   * and the search are how the view was narrowed to what is wanted. Built
   * and downloaded in the browser: the rows are already here, so a server
   * round trip would only add a way for it to fail.
   */
  function exportLedger() {
    const rows = LEDGER_CACHE.filter(matchesFilter);
    if (!rows.length) { toast('Nothing to export in this view.', false); return; }

    // A field starting with =, +, - or @ is run as a FORMULA by Excel and by
    // Sheets when the file is opened. Entity names come from vendor and
    // patient records, so they are prefixed out of harm's way.
    const cell = function (v) {
      let t = String(v === null || v === undefined ? '' : v);
      if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
      return '"' + t.replace(/"/g, '""') + '"';
    };
    // Amounts are written UNQUOTED so the spreadsheet reads them as numbers.
    // Quoted, they import as text and the first thing anyone does with an
    // exported ledger - select the column and look at the sum - gives zero.
    const num = function (v) { const n = Number(v); return isFinite(n) ? String(n) : '0'; };
    const head = ['Date & Time', 'Txn ID', 'Category', 'Entity', 'Mode', 'In (INR)', 'Out (INR)', 'Locked'];
    const body = rows.map(function (r) {
      return [cell(r.ts), cell(r.txnId), cell(r.category), cell(r.entity), cell(r.mode),
              num(r.amtIn), num(r.amtOut), cell(r.locked ? 'YES' : '')].join(',');
    });
    // The BOM makes Excel read it as UTF-8, so a rupee sign in a note is not
    // mangled on the accountant's machine.
    const csv = '\ufeff' + head.map(cell).join(',') + '\r\n' + body.join('\r\n') + '\r\n';

    const stamp = (window.crescDateInputValue ? window.crescDateInputValue(new Date())
                                              : new Date().toISOString().slice(0, 10));
    // The range goes in the filename, so three exports in a morning are
    // three distinguishable files rather than "ledger-all (2).csv".
    const span = (LEDGER_FROM || LEDGER_TO)
      ? '-' + (LEDGER_FROM || 'start') + '_to_' + (LEDGER_TO || 'today')
      : '-' + stamp;
    const name = 'ledger-' + (CURRENT_FILTER === 'ALL' ? 'all' : CURRENT_FILTER.toLowerCase()) +
                 span + '.csv';
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast(rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' exported.', true);
  }

  /* ---------- receivables — ORPHANED CONTROLLER -----------------------
     This is the third per-patient money screen, and the one nobody can
     reach. Running IP Tabs answers "what has THIS bed run up so far";
     Discharge Settlement turns one stay into a final bill; Receivables
     answers "who owes us money across pharmacy, lab and billing" — the
     merged view the patient banner needs to show one outstanding balance
     at every counter.

     Its backend (getReceivables in Accounts_Receivables.gs) works. Its
     markup — #acc-receivables-body, #acc-receivables-summary — was
     deleted with the empty tile that used to open it, so every element
     lookup below returns null and the whole function is a no-op against a
     live server call.

     Left in place, and no longer routed, because restoring the screen is
     worth doing and throwing the controller away would mean writing it
     twice. Nothing calls it until the markup comes back.
     ------------------------------------------------------------------ */
  function loadReceivables() {
    const box = $('acc-receivables-body');
    if (box) box.innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-circle-notch fa-spin me-2"></i>Loading running tabs…</div>';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { if (box) box.innerHTML = '<div class="text-center text-danger py-5">' + esc((res && res.message) || 'Load failed.') + '</div>'; return; }
        const sum = $('acc-receivables-summary');
        if (sum) sum.textContent = res.count + ' open tab' + (res.count === 1 ? '' : 's') + ' · ' + inr(res.totalOpen) + ' outstanding';
        renderReceivables(res.groups || []);
      })
      .withFailureHandler(function (err) { if (box) box.innerHTML = '<div class="text-center text-danger py-5">' + esc(err.message || 'Server error.') + '</div>'; })
      .getReceivables(window.sessionToken);
  }
  function renderReceivables(groups) {
    const box = $('acc-receivables-body'); if (!box) return;
    if (!groups.length) { box.innerHTML = '<div class="text-center text-muted py-5">No pending settlements. Everything is cleared.</div>'; return; }
    box.innerHTML = groups.map(function (g) {
      const aging = g.agingDays > 60 ? 'text-danger' : (g.agingDays > 30 ? 'text-warning' : 'text-muted');
      const bills = g.bills.map(function (b) {
        return '<tr><td class="small">' + esc(b.source) + '</td><td class="small font-monospace">' + esc(b.billId) +
          '</td><td class="small">' + esc(b.date) + '</td><td class="text-end small">' + inr(b.amount) +
          '</td><td class="text-end"><button class="btn btn-success btn-sm rounded-pill px-3" onclick="AccX.settle(\'' +
          esc(b.source) + '\',\'' + esc(b.billId) + '\',' + (b.amount || 0) + ')">Settle</button></td></tr>';
      }).join('');
      return '<div class="card premium-card border-0 rounded-3 mb-3"><div class="card-body p-3">' +
        '<div class="d-flex justify-content-between align-items-center mb-2">' +
        '<div><span class="fw-bold text-white">' + esc(g.name || g.patientId || 'Unknown') + '</span>' +
        ' <span class="badge bg-secondary bg-opacity-25 ms-1">' + esc(g.type) + '</span>' +
        (g.admissionId ? ' <span class="small text-muted font-monospace ms-1">' + esc(g.admissionId) + '</span>' : '') +
        '</div><div class="text-end"><div class="fw-bold text-danger">' + inr(g.totalDue) + '</div>' +
        '<div class="small ' + aging + '">' + g.agingDays + ' days</div></div></div>' +
        '<table class="table table-sm align-middle mb-0 custom-table"><tbody class="text-light">' + bills + '</tbody></table>' +
        '</div></div>';
    }).join('');
  }
  // The outstanding amount is remembered alongside the bill: a hospital
  // invoice can be part-paid, so its settler needs to be told how much is
  // being collected, not just which bill.
  let SETTLE_AMOUNT = 0;
  function settle(source, billId, amount) {
    injectModals();
    SETTLE_AMOUNT = Number(amount) || 0;
    $('acc-settle-source').value = source;
    $('acc-settle-bill').value = billId;
    $('acc-settle-info').textContent = source + ' bill ' + billId + ' · collecting ' + inr(amount);
    new bootstrap.Modal($('acc-settle-modal')).show();
  }
  function confirmSettle() {
    const payload = { source: $('acc-settle-source').value, billId: $('acc-settle-bill').value,
                      payMode: $('acc-settle-mode').value, loggedBy: who(),
                      amount: SETTLE_AMOUNT, balance: SETTLE_AMOUNT,
                      sessionToken: window.sessionToken || '' };
    busy(true);
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false); toast(res.message, !!res.success);
        if (res.success) { bootstrap.Modal.getInstance($('acc-settle-modal')).hide(); loadReceivables(); load(); }
      })
      .withFailureHandler(function (err) { busy(false); toast(err.message || 'Server error.', false); })
      .settleReceivableBill(payload, window.sessionToken);
  }

  // ---------- dashboard ----------
  function setText(id, t) { const e = $(id); if (e) e.textContent = t; }

  /* A tile's count, styled by whether it means "attend to this".
     Was three raw numbers in three different hard-coded colours, one of
     which ("0 Mismatches") was painted danger-red even when it said zero. */
  function setFlag(id, n, oneLabel, manyLabel) {
    const e = $(id); if (!e) return;
    const count = Number(n) || 0;
    e.textContent = count + ' ' + (count === 1 ? oneLabel : manyLabel);
    e.classList.toggle('is-flagged', count > 0);
    e.classList.toggle('is-clear', count === 0);
  }

  /* The hub's own busy state. The refresh button spins and a chip appears
     beside the subtitle; nothing is covered over. */
  function hubBusy(on) {
    const chip = $('acc-busy'); if (chip) chip.hidden = !on;
    const btn = $('acc-refresh');
    if (btn) { btn.disabled = on; const i = btn.querySelector('i'); if (i) i.classList.toggle('fa-spin', on); }
  }

  /**
   * Says on the hub itself why it is empty.
   *
   * A toast is gone in four seconds and the hub then looks merely idle:
   * three em-dashes in the KPI strip and "No transactions found" under them,
   * which is exactly what a quiet month looks like. A hub that FAILED has to
   * say so where the eye lands, and stay saying it.
   */
  function hubProblem(text) {
    const el = $('acc-hub-problem');
    if (!el) return;
    if (!text) { el.classList.add('d-none'); el.innerHTML = ''; return; }
    el.classList.remove('d-none');
    el.innerHTML = '<i class="fas fa-triangle-exclamation me-2"></i>' + esc(text) +
      ' <button class="btn btn-sm btn-outline-light ms-2 py-0" onclick="AccX.load()">Retry</button>';
  }

  function load() {
    const tb = $('master-ledger-tbody');
    if (tb) tb.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5"><i class="fas fa-circle-notch fa-spin me-2"></i>Loading financial data…</td></tr>';
    hubBusy(true);
    hubProblem('');
    google.script.run
      .withSuccessHandler(function (res) {
        hubBusy(false);
        if (!res || !res.success) {
          const why = (res && res.message) || 'the server did not reply';
          toast('The Finance Hub could not load: ' + why, false);
          hubProblem('The Finance Hub could not load: ' + why);
          LEDGER_CACHE = []; renderLedger();
          return;
        }
        CURRENT_PERIOD = res.currentPeriod; LEDGER_CACHE = res.ledger || [];

        // Rows the server could not read. Silently dropping them is what made
        // a month's expenses quietly shrink, so they are named here.
        if (res.warningCount) {
          hubProblem(res.warningCount + ' record(s) could not be read and are ' +
                     'missing from these figures — ' + (res.warnings || []).join('; '));
        }

        // These four write into the KPI strip at the top of the hub. Until
        // that strip existed in the markup, setText() found no element and
        // every one of these numbers was computed and discarded.
        const k = res.kpis || {};
        setText('acc-kpi-revenue', inr(k.collectedMTD));
        setText('acc-kpi-expense', inr(k.paidMTD));
        setText('acc-kpi-cash', inr(k.drawerCash));
        // Net is the number anyone actually asks for, and it is the only one
        // the hub did not show. It is derived, so no backend change is needed.
        setText('acc-kpi-net', inr((Number(k.collectedMTD) || 0) - (Number(k.paidMTD) || 0)));

        // The three tills, each reconciled against its own billing source.
        loadDrawerSplit();

        const f = res.flags || {};
        setFlag('acc-flag-mismatch', f.cashMismatch, 'mismatch', 'mismatches');
        setFlag('acc-flag-claims', f.delayedClaims, 'claim delayed', 'claims delayed');
        setFlag('acc-flag-discharges', f.pendingDischarges, 'pending', 'pending');
        renderLedger();
      })
      .withFailureHandler(function (err) { hubBusy(false); LEDGER_CACHE = []; renderLedger(); toast(err.message || 'Server error.', false); })
      .getAccountsDashboard();
  }
  /**
   * The per-counter cash breakdown under the drawer KPI.
   *
   * The hub's single "cash in drawer" number was computed by adding every
   * open shift's float and then every cash transaction in the clinic since
   * the EARLIEST of them — so it matched no till in the building and told
   * nobody which drawer to go and count. getAllDrawerStates() reconciles
   * each counter against its own billing source and totals them.
   *
   * Fails quietly: the KPI above it is still useful without this.
   */
  function loadDrawerSplit() {
    const el = $('acc-kpi-cash-split');
    if (!el) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.drawers) { el.innerHTML = ''; return; }
        const t = res.totals || {};
        if (t.expected !== undefined) setText('acc-kpi-cash', inr(t.expected));
        el.innerHTML = res.drawers.map(function (d) {
          return d.open
            ? '<div class="text-muted">' + esc(d.counter) +
              ' <span class="fw-bold text-main">' + inr(d.expected) + '</span></div>'
            : '<div class="text-muted" style="opacity:.6;">' + esc(d.counter) + ' &mdash; closed</div>';
        }).join('');
      })
      .withFailureHandler(function () { el.innerHTML = ''; })
      .getAllDrawerStates(window.sessionToken);
  }

  /* lockPeriod() WAS HERE. It froze a month's rows against editing —
     an audit control this clinic has no use for, one press from permanent,
     and not what anybody came to this toolbar for. The date range above
     replaced it. lockFinancialPeriod() remains in Accounts.gs, unreferenced
     by any screen, so a clinic that wants period locking can put a button
     back without the backend having to be rewritten. */

  return { load, openEntry, switchPage, backToHub, filter, search,
           dateRange, clearDateRange,
           exportLedger, loadReceivables, settle };
})();

function switchAccountsPage(pageId) { AccX.switchPage(pageId); }
function filterLedger(cat) { AccX.filter(cat); }
function showAccounts() { AccX.switchPage('workspace-accounts'); AccX.load(); }

/** The Back to Hub every accounts spoke calls. */
function backToAccountsHub() { AccX.backToHub(); }
</script>
