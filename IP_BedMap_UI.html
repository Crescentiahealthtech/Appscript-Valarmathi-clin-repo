<style>
  /* Bed Map Visual Styles */
  .bed-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .bed-card {
    background-color: var(--bg-input);
    border: 2px solid var(--border-strong);
    border-radius: 0.5rem;
    padding: 1rem;
    position: relative;
    transition: transform 0.2s, border-color 0.2s;
  }
  .bed-card:hover {
    transform: translateY(-3px);
  }
  
  /* Status Colors */
  .bed-status-available { border-color: var(--success); box-shadow: 0 0 10px rgba(25, 135, 84, 0.2); }
  .bed-status-occupied { border-color: var(--danger); box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }
  .bed-status-reserved { border-color: var(--warning); box-shadow: 0 0 10px rgba(255, 193, 7, 0.2); }
  .bed-status-cleaning { border-color: var(--info); }
  .bed-status-maintenance { border-color: var(--border-strong); }
  .bed-status-isolation { border-color: var(--warning); }

  /* Typography for Bed Map */
  .bed-id { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.2rem; }
  .bed-patient-info { font-size: 0.8rem; color: var(--text-muted); min-height: 40px; }
  .los-badge { position: absolute; top: 0.5rem; right: 0.5rem; font-size: 0.7rem; }
  
  /* Select Overrides for Dark UI */
  .bed-status-select {
    background-color: transparent;
    color: var(--text-main);
    border: 1px solid var(--border-strong);
    border-radius: 0.25rem;
    font-size: 0.8rem;
    padding: 0.2rem;
    width: 100%;
    margin-top: 0.5rem;
  }
  .bed-status-select option { background-color: var(--bg-input); }
</style>

<style>
  /* 1. Modal Theme Corrections for Text Visibility */
  .modal-content, #form-admission {
    background-color: var(--surface-2) !important;
    color: var(--text-main) !important;
  }
  
  .modal-body label,
  .modal-body .form-label,
  .modal-body h6,
  .modal-body .text-muted {
    color: var(--text-main) !important; /* Forces Labels to Bright High-Clear White */
    font-weight: 600 !important;
  }

  .modal-body .form-control,
  .modal-body .form-select {
    background-color: var(--surface-3) !important;
    border: 1px solid var(--border-strong) !important;
    color: var(--text-main) !important;
  }

  .modal-body .form-control[readonly] {
    background-color: var(--surface-3) !important;
    color: var(--text-secondary) !important;
  }

  /* 2. Structured Box Grid Layout for Bed Maps */
  .bed-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
    gap: 1.25rem !important;
    margin-top: 1rem;
    margin-bottom: 2rem;
  }
  
  .bed-card {
    background-color: var(--bg-input) !important;
    border: 2px solid var(--border-strong) !important;
    border-radius: 0.5rem !important;
    padding: 1.25rem !important;
    box-shadow: 0 4px 6px rgba(var(--shadow-rgb), 0.4) !important;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .bed-card:hover {
    transform: translateY(-3px) !important;
  }

  /* Distinct Top Borders Representing Realtime Statuses */
  .bed-status-available { border-top: 5px solid var(--success) !important; }
  .bed-status-occupied { border-top: 5px solid var(--danger) !important; }
  .bed-status-reserved { border-top: 5px solid var(--warning) !important; }
  .bed-status-cleaning { border-top: 5px solid var(--info) !important; }
  .bed-status-maintenance { border-top: 5px solid var(--border-strong) !important; }
  .bed-status-isolation { border-top: 5px solid var(--warning) !important; }

  .bed-id {
    font-size: 1.35rem !important;
    font-weight: 800 !important;
    color: var(--text-main) !important;
    margin-bottom: 0.5rem;
  }

  .bed-patient-info {
    font-size: 0.85rem !important;
    color: var(--text-secondary) !important;
    min-height: 45px;
    line-height: 1.4;
  }
</style>

<div id="ip-bed-management-view" class="app-view page-section d-none h-100 flex-column px-2">
  
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
    <div>
      <h4 class="m-0 text-white fw-bold"><i class="fa-solid fa-map-location-dot me-2 text-info"></i> Bed Command Center</h4>
      <small class="text-muted">Real-time occupancy and admission management</small>
    </div>
    <button class="btn btn-outline-light fw-bold shadow px-4" onclick="switchTab('workspace-appointments', document.getElementById('nav-tab-appt'))">
  <i class="fa-solid fa-arrow-left me-2"></i> Go Back
</button>
  </div>

  <div class="d-flex flex-wrap gap-3 mb-4 small fw-bold">
    <span class="text-success"><i class="fa-solid fa-square me-1"></i> Available</span>
    <span class="text-danger"><i class="fa-solid fa-square me-1"></i> Occupied</span>
    <span class="text-warning"><i class="fa-solid fa-square me-1"></i> Reserved</span>
    <span class="text-info"><i class="fa-solid fa-square me-1"></i> Cleaning</span>
    <span style="color: var(--warning-fg);"><i class="fa-solid fa-square me-1"></i> Isolation</span>
    <span class="text-secondary"><i class="fa-solid fa-square me-1"></i> Maintenance</span>
  </div>

  <div class="flex-grow-1 overflow-auto pe-2" id="bed-map-container">
    <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div><br>Loading Bed Map...</div>
  </div>
</div>

<script>
  let globalBedData = [];

  function initBedMap() {
    document.querySelectorAll('.app-view').forEach(v => v.classList.add('d-none')); 
    document.getElementById('ip-bed-management-view').classList.remove('d-none');
    google.script.run.withSuccessHandler(renderBedGrid).getBedStatuses();
  }

  function renderBedGrid(dataStr) {
    const container = document.getElementById('bed-map-container');
    try {
      globalBedData = JSON.parse(dataStr);
      let html = '';
      const wards = ['A', 'B', 'ICU'];
      
      wards.forEach(ward => {
        html += `<h5 class="text-white mt-4 mb-3 border-bottom border-secondary pb-2"><i class="fa-solid fa-layer-group me-2 text-muted"></i> Ward ${ward}</h5>`;
        html += `<div class="bed-grid">`;
        
        const wardBeds = globalBedData.filter(b => b.ward === ward);
        
        wardBeds.forEach(bed => {
          let statusClass = `bed-status-${bed.status.toLowerCase()}`;
          let losBadge = '';
          let patientText = '<span class="text-muted fst-italic">Empty</span>';
          
          if(bed.status === 'Occupied' && bed.doa) {
             const admitDate = new Date(bed.doa);
             const today = new Date();
             const diffTime = Math.abs(today - admitDate);
             const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
             losBadge = `<span class="badge bg-danger los-badge">LOS: ${diffDays} Days</span>`;
             patientText = `<strong class="text-light">${bed.patientName}</strong><br>${bed.patientId} | IP: ${bed.ipNumber}`;
          }

          html += `
            <div class="bed-card ${statusClass}">
              ${losBadge}
              <div class="d-flex justify-content-between align-items-start">
                <div class="bed-id text-white">${bed.bedId}</div>
              </div>
              <div class="bed-patient-info mt-2">
                ${patientText}
              </div>
              <select class="bed-status-select mt-3" onchange="updateSingleBedStatus('${bed.bedId}', this.value)">
                <option value="Available" ${bed.status === 'Available' ? 'selected' : ''}>Available</option>
                <option value="Occupied" ${bed.status === 'Occupied' ? 'selected' : ''} disabled>Occupied</option>
                <option value="Reserved" ${bed.status === 'Reserved' ? 'selected' : ''}>Reserved</option>
                <option value="Cleaning" ${bed.status === 'Cleaning' ? 'selected' : ''}>Cleaning</option>
                <option value="Maintenance" ${bed.status === 'Maintenance' ? 'selected' : ''}>Maintenance</option>
                <option value="Isolation" ${bed.status === 'Isolation' ? 'selected' : ''}>Isolation</option>
              </select>
            </div>
          `;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    } catch(e) {
      container.innerHTML = `<div class="alert alert-danger">Error loading bed map configuration.</div>`;
    }
  }

  function updateSingleBedStatus(bedId, newStatus) {
    google.script.run.withSuccessHandler(() => {
      google.script.run.withSuccessHandler(renderBedGrid).getBedStatuses();
    }).updateBedStatusInDB(bedId, newStatus);
  }
</script>
