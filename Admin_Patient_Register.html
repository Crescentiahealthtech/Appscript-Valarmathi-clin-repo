<div id="tab-admin-reg" class="page-section d-none">
  <div class="d-flex align-items-center gap-3 mb-4 mt-4">
    <button class="btn btn-sm btn-outline-secondary label-bright rounded-circle px-2 py-1" onclick="switchTab('workspace-patients')" title="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h3 class="fw-bold m-0 text-white">Register Patient</h3>
  </div>
  
  <div class="card p-4 bg-dark-subtle border-secondary shadow-sm" style="max-width: 1000px; border-radius: 12px;">
    
    <!-- Section: Personal Information -->
    <h6 class="text-uppercase text-muted fw-bold mb-3" style="letter-spacing: 1px; font-size: 0.8rem;">Personal Information</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Salutation</label>
        <select id="reg-salutation" class="form-select text-white-force bg-dark border-secondary">
          <option value="" disabled selected>Select...</option>
          <option value="Mr.">Mr.</option>
          <option value="Mrs.">Mrs.</option>
          <option value="Ms.">Ms.</option>
          <option value="Master">Master</option>
          <option value="Baby">Baby</option>
        </select>
      </div>
      <div class="col-md-9">
        <label class="form-label small text-muted mb-1">Full Name <span class="text-danger">*</span></label>
        <input type="text" id="reg-name" class="form-control text-white-force bg-dark border-secondary" placeholder="e.g., Jane Doe">
      </div>
      
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Date of Birth <span class="text-danger">*</span></label>
        <input type="date" id="reg-dob" class="form-control text-white-force bg-dark border-secondary" onchange="calculateAge()">
      </div>
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Age</label>
        <input type="number" id="reg-age" class="form-control text-white-force bg-dark border-secondary" placeholder="Auto-calculated" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Gender</label>
        <select id="reg-gender" class="form-select text-white-force bg-dark border-secondary">
          <option value="" disabled selected>Select...</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Marital Status</label>
        <select id="reg-marital" class="form-select text-white-force bg-dark border-secondary">
          <option value="" disabled selected>Select...</option>
          <option value="Single">Single</option>
          <option value="Married">Married</option>
          <option value="Divorced">Divorced</option>
          <option value="Widowed">Widowed</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Blood Group</label>
        <select id="reg-blood" class="form-select text-white-force bg-dark border-secondary">
          <option value="" disabled selected>Select...</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Occupation</label>
        <input type="text" id="reg-occupation" class="form-control text-white-force bg-dark border-secondary" placeholder="e.g., Software Engineer">
      </div>
    </div>

    <!-- Section: Contact Details -->
    <hr class="border-secondary mb-4">
    <h6 class="text-uppercase text-muted fw-bold mb-3" style="letter-spacing: 1px; font-size: 0.8rem;">Contact Details</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Mobile Number <span class="text-danger">*</span></label>
        <input type="tel" id="reg-mobile" class="form-control text-white-force bg-dark border-secondary" placeholder="Primary contact" oninput="syncWhatsApp()">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">WhatsApp Number</label>
        <input type="tel" id="reg-whatsapp" class="form-control text-white-force bg-dark border-secondary" placeholder="For notifications">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Email Address</label>
        <input type="email" id="reg-email" class="form-control text-white-force bg-dark border-secondary" placeholder="patient@example.com">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Educational Qualification</label>
        <input type="text" id="reg-education" class="form-control text-white-force bg-dark border-secondary" placeholder="e.g., BSc, PhD">
      </div>
      <div class="col-12">
        <label class="form-label small text-muted mb-1">Residential Address</label>
        <textarea id="reg-address" class="form-control text-white-force bg-dark border-secondary" placeholder="Full street address..." rows="2"></textarea>
      </div>
    </div>

    <!-- Section: Emergency & Family -->
    <hr class="border-secondary mb-4">
    <h6 class="text-uppercase text-muted fw-bold mb-3" style="letter-spacing: 1px; font-size: 0.8rem;">Emergency & Family</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label small text-muted mb-1">Relation Type</label>
        <select id="reg-relation-type" class="form-select text-white-force bg-dark border-secondary">
          <option value="" disabled selected>Select...</option>
          <option value="Father">Father</option>
          <option value="Mother">Mother</option>
          <option value="Spouse">Spouse</option>
          <option value="Guardian">Guardian</option>
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label small text-muted mb-1">Name of Relative/Guardian</label>
        <input type="text" id="reg-relation-name" class="form-control text-white-force bg-dark border-secondary" placeholder="Relative's full name">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Emergency Contact Person</label>
        <input type="text" id="reg-emergency-name" class="form-control text-white-force bg-dark border-secondary" placeholder="Who to call in emergency">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Emergency Contact Number</label>
        <input type="tel" id="reg-emergency-number" class="form-control text-white-force bg-dark border-secondary" placeholder="Emergency phone">
      </div>
    </div>

    <!-- Section: Medical & Referral -->
    <hr class="border-secondary mb-4">
    <h6 class="text-uppercase text-muted fw-bold mb-3" style="letter-spacing: 1px; font-size: 0.8rem;">Medical & Referral</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Referred By</label>
        <input type="text" id="reg-referred" class="form-control text-white-force bg-dark border-secondary" placeholder="Doctor or clinic name">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted mb-1">Known Conditions / Co-morbidities</label>
        <input type="text" id="reg-comorb" class="form-control text-white-force bg-dark border-secondary" placeholder="e.g., DM, HTN, Asthma">
      </div>
    </div>

    <!-- Status Message Area -->
    <div id="reg-status-msg" class="mb-3 small fw-bold d-none"></div>
    <!-- Card printing lives outside the status banner: that banner self-hides
         after 5 seconds, which is not long enough to print a patient card. -->
    <div id="reg-card-actions" class="mb-3"></div>

    <button id="btn-admin-reg" class="btn text-white w-100 fw-bold py-3 mt-2 on-accent" style="background-color: var(--accent-purple); border-radius: 8px;" onclick="adminRegisterPatient()">
      <span id="btn-text">Create Patient ID</span>
      <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin d-none ms-2"></i>
    </button>
  </div>
</div>

<script>
  function calculateAge() {
    const dobInput = document.getElementById('reg-dob').value;
    if (dobInput) {
      const dob = new Date(dobInput);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
        age--;
      }
      document.getElementById('reg-age').value = age > 0 ? age : 0;
    }
  }

  function syncWhatsApp() {
    const mob = document.getElementById('reg-mobile').value;
    const wa = document.getElementById('reg-whatsapp');
    if(wa.value === "" || wa.value.length < mob.length) {
       wa.value = mob;
    }
  }

  function showStatus(message, isError = false) {
    const statusDiv = document.getElementById('reg-status-msg');
    statusDiv.className = `mb-3 small fw-bold p-2 rounded ${isError ? 'bg-danger text-white' : 'bg-success text-white'}`;
    statusDiv.innerText = message;
    statusDiv.classList.remove('d-none');
    
    // Auto hide after 5 seconds
    setTimeout(() => {
        statusDiv.classList.add('d-none');
    }, 5000);
  }

  function adminRegisterPatient() {
    const btn = document.getElementById('btn-admin-reg');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    
    const data = {
      salutation: document.getElementById('reg-salutation').value,
      name: document.getElementById('reg-name').value.trim(),
      dob: document.getElementById('reg-dob').value,
      age: document.getElementById('reg-age').value,
      gender: document.getElementById('reg-gender').value,
      maritalStatus: document.getElementById('reg-marital').value,
      bloodGroup: document.getElementById('reg-blood').value,
      occupation: document.getElementById('reg-occupation').value.trim(),
      education: document.getElementById('reg-education').value.trim(),
      mobile: document.getElementById('reg-mobile').value.trim(),
      whatsapp: document.getElementById('reg-whatsapp').value.trim(),
      email: document.getElementById('reg-email').value.trim(),
      address: document.getElementById('reg-address').value.trim(),
      relationType: document.getElementById('reg-relation-type').value,
      relationName: document.getElementById('reg-relation-name').value.trim(),
      emergencyName: document.getElementById('reg-emergency-name').value.trim(),
      emergencyNumber: document.getElementById('reg-emergency-number').value.trim(),
      referredBy: document.getElementById('reg-referred').value.trim(),
      comorb: document.getElementById('reg-comorb').value.trim()
    };
    
    // Frontend Validation
    if (!data.name || !data.dob || !data.mobile) { 
      showStatus("Name, Date of Birth, and Mobile Number are required fields.", true);
      return; 
    }
    
    // Loading State
    const cardHost = document.getElementById('reg-card-actions');
    if (cardHost) cardHost.innerHTML = '';
    btnText.innerText = "Generating ID...";
    btnSpinner.classList.remove('d-none');
    btn.disabled = true;

    // Google Apps Script Call
    google.script.run.withSuccessHandler(res => {
      // Reset Button State
      btnText.innerText = "Create Patient ID"; 
      btnSpinner.classList.add('d-none');
      btn.disabled = false;
      
      if (res.success) { 
        showStatus(res.message || "Patient successfully registered!");
        // Offer the barcode card straight away — the one moment the patient is
        // still at the desk to receive it.
        offerPatientCard(res.patientId);
        // Clear all inputs
        document.querySelectorAll('#tab-admin-reg input, #tab-admin-reg textarea, #tab-admin-reg select').forEach(el => {
          if(el.type !== 'button') el.value = '';
        });
      } else {
        showStatus(res.message || "Registration failed. Please try again.", true);
      }
    }).withFailureHandler(err => {
      btnText.innerText = "Create Patient ID"; 
      btnSpinner.classList.add('d-none');
      btn.disabled = false;
      showStatus("An error occurred connecting to the server.", true);
    }).registerPatient(data); 
  }

  /**
   * Post-registration card printing. The QR on the card carries the patient ID
   * and nothing else — no name, date of birth or diagnosis ever goes into the
   * code itself.
   */
  function offerPatientCard(patientId) {
    if (!patientId) return;
    const host = document.getElementById('reg-card-actions');
    if (!host || !window.CrescLabel) return;
    host.innerHTML = '';

    const bar = document.createElement('div');
    bar.className = 'd-flex gap-2 align-items-center flex-wrap';

    const note = document.createElement('span');
    note.className = 'small';
    note.style.color = 'var(--text-muted)';
    note.textContent = patientId + ' registered —';
    bar.appendChild(note);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-sm fw-semibold';
    btn.style.cssText = 'background:var(--accent-purple);border:none;color:#fff;';
    btn.innerHTML = '<i class="fa-solid fa-id-card me-1"></i>Print patient card';
    btn.onclick = function () { printCardFor(patientId, btn); };

    const sticker = document.createElement('button');
    sticker.type = 'button';
    sticker.className = 'btn btn-sm';
    sticker.style.cssText = 'border:1px solid var(--border-color);color:var(--text-main);background:transparent;';
    sticker.innerHTML = '<i class="fa-solid fa-tag me-1"></i>Chart sticker';
    sticker.onclick = function () { printCardFor(patientId, sticker, true); };

    bar.appendChild(btn);
    bar.appendChild(sticker);
    host.appendChild(bar);
  }

  function printCardFor(patientId, btn, asSticker) {
    const label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Preparing…';
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false; btn.innerHTML = label;
        if (!r || !r.success) { alert((r && r.message) || 'Could not build the card.'); return; }
        if (asSticker) CrescLabel.printPatientSticker(r.patient);
        else CrescLabel.printPatientCard(r.patient);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.innerHTML = label;
        alert('Could not reach the server: ' + (err && err.message ? err.message : err));
      })
      .getPatientLabelData(patientId, window.sessionToken);
  }
</script>
