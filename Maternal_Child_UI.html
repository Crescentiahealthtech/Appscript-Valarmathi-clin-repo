<!-- =====================================================================
     ANTENATAL CARD AND IMMUNISATION CARD

     The patient portal is asked to show a pregnant patient her gestation,
     her next checkup and the baby's growth, and to show a parent how far
     through the immunisation schedule their child is. None of that can be
     shown unless somebody records it, and before Maternal_Child.gs there was
     nowhere to record it: antenatal visits were written as free-text progress
     notes and vaccinations went on the card the parent carries.

     This is where the clinic enters both. It is IN THE SHELL rather than in
     the OP bundle because the same two cards are wanted from the OP consult,
     from the ward and from the patient screens — three separate lazy bundles
     — and a partial reaching across a bundle boundary for a function is what
     produced "Invoice print template not loaded on this page."

         CrescMC.open('LMTVS0007', 'Kavitha R', 'anc');
         CrescMC.open('LMTVS0031', 'Baby of Kavitha', 'imm');

     WHAT IT DOES NOT DO

     It does not decide anything. It does not flag a pregnancy high-risk, and
     it does not say whether a vaccine may be given today. It records what the
     clinician writes, and the dates it shows are arithmetic on dates.
     ===================================================================== -->
<style>
  #cresc-mc { position: fixed; inset: 0; z-index: 3100; display: none;
              align-items: flex-start; justify-content: center;
              background: var(--overlay-scrim, rgba(2,6,23,.6)); overflow: auto;
              padding: 24px 12px; }
  #cresc-mc.on { display: flex; }
  #cresc-mc .mc-sheet { background: var(--bg-card); border: 1px solid var(--border-color);
                        border-radius: 14px; width: 100%; max-width: 780px;
                        box-shadow: var(--shadow-lg); }
  #cresc-mc .mc-head { padding: 14px 18px; border-bottom: 1px solid var(--border-color);
                       display: flex; align-items: center; gap: 10px; }
  #cresc-mc .mc-body { padding: 16px 18px; }
  #cresc-mc label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .4px;
                    color: var(--text-muted); font-weight: 600; margin-bottom: 2px;
                    display: block; }
  #cresc-mc input, #cresc-mc select, #cresc-mc textarea {
    background: var(--bg-input) !important; color: var(--text-main) !important;
    border: 1px solid var(--border-color) !important; border-radius: 6px;
    box-shadow: none !important; font-size: var(--fs-sm); padding: 6px 8px; width: 100%; }
  #cresc-mc .mc-note { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.5; }
  #cresc-mc .mc-row { display: flex; justify-content: space-between; align-items: center;
                      gap: 10px; padding: 6px 0;
                      border-bottom: 1px solid var(--border-color); }
  #cresc-mc .mc-row:last-child { border-bottom: 0; }
  #cresc-mc .mc-pill { font-size: var(--fs-2xs); font-weight: 700; padding: 2px 8px;
                       border-radius: 999px; text-transform: uppercase;
                       letter-spacing: .4px; white-space: nowrap; }
  #cresc-mc .mc-ok   { background: var(--success-bg); color: var(--success-fg); }
  #cresc-mc .mc-due  { background: var(--warning-bg); color: var(--warning-fg); }
  #cresc-mc .mc-late { background: var(--danger-bg);  color: var(--danger-fg); }
  #cresc-mc .mc-soon { background: var(--info-bg);    color: var(--info-fg); }
  #cresc-mc .mc-tile { border: 1px solid var(--border-color); border-radius: 8px;
                       padding: 8px 10px; background: var(--bg-elevated); }
</style>

<div id="cresc-mc" role="dialog" aria-modal="true" aria-labelledby="mc-title">
  <div class="mc-sheet">
    <div class="mc-head">
      <i class="fa-solid fa-notes-medical" style="color: var(--accent-fg);"></i>
      <strong id="mc-title" style="color: var(--text-main); font-size: var(--fs-md);">Card</strong>
      <span class="mc-note ms-2" id="mc-who"></span>
      <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="CrescMC.close()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="mc-body" id="mc-body"></div>
  </div>
</div>

<script>
window.CrescMC = (function () {
  'use strict';

  var S = { pid: '', name: '', mode: 'anc', anc: null, imm: null, busy: false };

  function el(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function val(id) { var e = el(id); return e ? e.value.trim() : ''; }
  function say(msg, ok) {
    if (typeof window.showToast === 'function') {
      window.showToast(ok ? 'Done' : 'Could not complete', msg, ok ? 'success' : 'error');
    } else if (typeof window.crescAlert === 'function') {
      window.crescAlert(msg);
    }
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
           '-' + ('0' + d.getDate()).slice(-2);
  }
  function body(html) { var e = el('mc-body'); if (e) e.innerHTML = html; }
  function spin(what) {
    body('<div class="mc-note"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>' +
         esc(what) + '</div>');
  }

  /** One place that calls the server, so every call has a failure path. */
  function call(fn, args, onOk) {
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        S.busy = false;
        onOk(res);
      })
      .withFailureHandler(function (err) {
        S.busy = false;
        say('Could not reach the server: ' + ((err && err.message) || err), false);
      });
    if (typeof runner[fn] !== 'function') {
      S.busy = false;
      say('This build has no server function called ' + fn + '().', false);
      return;
    }
    S.busy = true;
    runner[fn].apply(runner, args);
  }

  // ------------------------------------------------------------------
  // ANTENATAL
  // ------------------------------------------------------------------

  function loadAnc() {
    spin('Reading the antenatal card…');
    call('mcGetAntenatal', [S.pid, window.sessionToken], function (res) {
      if (!res) { body('<div class="mc-note">The server gave no answer.</div>'); return; }
      if (!res.success) { body('<div class="mc-note">' + esc(res.message) + '</div>'); return; }
      S.anc = res.antenatal;
      renderAnc(res.message);
    });
  }

  function renderAnc(msg) {
    var a = S.anc;
    if (!a) { body(ancOpenForm(msg)); return; }

    var last = a.lastVisit || {};
    body(
      '<div class="row g-2 mb-3">' +
        tile('Gestation', a.gestationText || '—') +
        tile('EDD', a.eddText || '—') +
        tile('Visits', String(a.visitCount)) +
        tile('Next checkup', a.nextVisitText || 'not set',
             a.nextVisitOverdue ? 'mc-late' : (a.nextVisitText ? 'mc-ok' : 'mc-due')) +
      '</div>' +

      (a.riskNotes
        ? '<div class="mc-note mb-3"><strong style="color:var(--warning-fg);">Noted at booking:</strong> ' +
          esc(a.riskNotes) + '</div>'
        : '') +

      '<div style="font-weight:700; font-size:.85rem; color:var(--text-main); margin-bottom:8px;">' +
        'Record today\'s visit</div>' +

      '<div class="row g-2">' +
        field('mc-v-date', 'Visit date', 'date', today()) +
        field('mc-v-wt', 'Weight (kg)', 'number', last.weightKg || '') +
        field('mc-v-sys', 'BP systolic', 'number', '') +
        field('mc-v-dia', 'BP diastolic', 'number', '') +
        field('mc-v-hb', 'Haemoglobin (g/dL)', 'number', last.haemoglobin || '') +
        field('mc-v-fh', 'Fundal height (cm)', 'number', '') +
        field('mc-v-fhr', 'Fetal heart rate (/min)', 'number', '') +
        '<div class="col-6 col-md-3"><label>Presentation</label>' +
          '<select id="mc-v-pres">' +
            ['', 'Cephalic', 'Breech', 'Transverse', 'Not yet determined'].map(function (o) {
              return '<option' + (o === (last.presentation || '') ? ' selected' : '') +
                     '>' + esc(o) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="col-6 col-md-3"><label>Urine albumin</label>' +
          '<select id="mc-v-alb">' + ['', 'Nil', 'Trace', '+', '++', '+++']
            .map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="col-6 col-md-3"><label>Urine sugar</label>' +
          '<select id="mc-v-sug">' + ['', 'Nil', 'Trace', '+', '++', '+++']
            .map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="col-6 col-md-3"><label>Oedema</label>' +
          '<select id="mc-v-oed">' + ['', 'Nil', 'Pedal', 'Generalised']
            .map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="col-6 col-md-3"><label>Fetal movements</label>' +
          '<select id="mc-v-mov">' + ['', 'Felt well', 'Reduced', 'Not yet felt']
            .map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="col-12 col-md-6"><label>Complaints</label>' +
          '<input type="text" id="mc-v-cc"></div>' +
        '<div class="col-12 col-md-6"><label>Advice</label>' +
          '<input type="text" id="mc-v-adv"></div>' +
        // The single most useful field on the card, and the one the patient
        // sees in the portal. Last, so it is the thing in front of the
        // clinician when they finish.
        '<div class="col-12 col-md-4"><label style="color:var(--warning-fg);">Next visit date</label>' +
          '<input type="date" id="mc-v-next"></div>' +
      '</div>' +

      '<div class="d-flex gap-2 mt-3 flex-wrap">' +
        '<button class="btn btn-sm text-white fw-bold on-accent" ' +
          'style="background-color:var(--accent-purple)" onclick="CrescMC.saveVisit()">' +
          'Save visit</button>' +
        '<button class="btn btn-sm btn-outline-secondary" onclick="CrescMC.loadAnc()">' +
          'Reload</button>' +
        '<button class="btn btn-sm btn-outline-danger ms-auto" onclick="CrescMC.closeAnc()">' +
          'Pregnancy ended…</button>' +
      '</div>' +

      (a.trend && a.trend.length
        ? '<div class="mt-4"><div style="font-weight:700; font-size:.82rem; color:var(--text-main); margin-bottom:6px;">' +
          'Visits so far</div>' + a.trend.slice().reverse().map(function (v) {
            var bits = [];
            if (v.weightKg) bits.push(v.weightKg + ' kg');
            if (v.sysBp && v.diaBp) bits.push('BP ' + v.sysBp + '/' + v.diaBp);
            if (v.haemoglobin) bits.push('Hb ' + v.haemoglobin);
            if (v.fundalHeightCm) bits.push('FH ' + v.fundalHeightCm + ' cm');
            if (v.fetalHeartRate) bits.push('FHR ' + v.fetalHeartRate);
            return '<div class="mc-row"><span class="mc-note">' + esc(v.dateText) +
              (v.weeks !== null ? ' · ' + v.weeks + 'w' : '') + '</span>' +
              '<span class="mc-note">' + esc(bits.join(' · ') || 'nothing recorded') +
              '</span></div>';
          }).join('') + '</div>'
        : '')
    );
  }

  function ancOpenForm(msg) {
    return '<div class="mc-note mb-3">' + esc(msg || 'No antenatal record is open ' +
      'for this patient.') + '</div>' +
      '<div style="font-weight:700; font-size:.85rem; color:var(--text-main); margin-bottom:8px;">' +
        'Open an antenatal record</div>' +
      '<div class="row g-2">' +
        field('mc-a-lmp', 'Last menstrual period', 'date', '') +
        field('mc-a-edd', 'EDD from a scan (optional)', 'date', '') +
        field('mc-a-g', 'Gravida', 'number', '') +
        field('mc-a-p', 'Para', 'number', '') +
        field('mc-a-l', 'Living', 'number', '') +
        field('mc-a-ab', 'Abortions', 'number', '') +
        field('mc-a-ht', 'Height (cm)', 'number', '') +
        field('mc-a-wt', 'Booking weight (kg)', 'number', '') +
        '<div class="col-6 col-md-3"><label>Blood group</label>' +
          '<select id="mc-a-bg">' +
            ['', 'O+', 'O-', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-']
              .map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="col-12"><label>Anything to watch for</label>' +
          '<input type="text" id="mc-a-risk" placeholder="previous LSCS, anaemia, GDM in last pregnancy…"></div>' +
      '</div>' +
      '<div class="mc-note mt-2">The EDD is worked out from the LMP unless you ' +
        'give a scan date, which wins — a scan EDD legitimately differs from ' +
        'the menstrual one.</div>' +
      '<button class="btn btn-sm text-white fw-bold on-accent mt-3" ' +
        'style="background-color:var(--accent-purple)" onclick="CrescMC.openAnc()">' +
        'Open the record</button>';
  }

  function field(id, label, type, value) {
    return '<div class="col-6 col-md-3"><label>' + esc(label) + '</label>' +
      '<input type="' + type + '" id="' + id + '" value="' + esc(value) + '"></div>';
  }
  function tile(label, value, pill) {
    return '<div class="col-6 col-md-3"><div class="mc-tile">' +
      '<label>' + esc(label) + '</label>' +
      (pill
        ? '<span class="mc-pill ' + pill + '">' + esc(value) + '</span>'
        : '<span style="font-weight:700; color:var(--text-main); font-size:.9rem;">' +
          esc(value) + '</span>') +
      '</div></div>';
  }

  // ------------------------------------------------------------------
  // IMMUNISATION
  // ------------------------------------------------------------------

  function loadImm() {
    spin('Reading the immunisation card…');
    call('mcGetImmunisation', [S.pid, window.sessionToken], function (res) {
      if (!res) { body('<div class="mc-note">The server gave no answer.</div>'); return; }
      if (!res.success) { body('<div class="mc-note">' + esc(res.message) + '</div>'); return; }
      S.imm = res.immunisation;
      renderImm(res.message);
    });
  }

  function renderImm(msg) {
    var im = S.imm;
    if (!im) { body('<div class="mc-note">' + esc(msg) + '</div>'); return; }

    // Past the age the card covers there is nothing to show and nothing to do.
    if (im.eligible === false) {
      body('<div class="mc-tile"><div style="font-weight:600;">' +
           esc(im.message || 'Outside the age this card covers.') + '</div>' +
           '<div class="mc-note mt-1">The immunisation card is a child\'s ' +
           'document. Nothing on the schedule falls after this age, so there ' +
           'is nothing here to keep.</div></div>');
      return;
    }

    var pill = { GIVEN: 'mc-ok', PRESUMED: 'mc-ok', DUE: 'mc-due',
                 MISSED: 'mc-late', UPCOMING: 'mc-soon' };
    var word = { GIVEN: 'given', PRESUMED: 'taken as given', DUE: 'due now',
                 MISSED: 'not given', UPCOMING: 'later' };

    // THE HEADLINE. The card exists to tell the mother when to come back, so
    // that answer is the first thing on it rather than something she has to
    // find by reading down a list of twenty-seven rows.
    var next = im.nextDue;
    var group = im.nextDueGroup || [];
    var nextHtml = next
      ? '<div class="mc-tile mb-3" style="border-color:var(--accent-purple);">' +
          '<div class="mc-note">Next vaccination</div>' +
          '<div style="font-size:1.05rem;font-weight:700;color:var(--text-main);">' +
            esc(group.map(function (d) { return d.label; }).join(', ') || next.label) +
          '</div>' +
          '<div style="font-size:.85rem;color:var(--text-main);">' +
            'due ' + esc(next.dueText) +
            (next.at ? ' · ' + esc(next.at) : '') +
            (next.dueInDays > 0
              ? ' <span class="mc-note">(in ' + next.dueInDays + ' days)</span>'
              : ' <span class="mc-pill mc-due">due now</span>') +
          '</div>' +
        '</div>'
      : '<div class="mc-tile mb-3"><div class="mc-note">Nothing further is due on ' +
        'the schedule.</div></div>';

    var missedHtml = (im.missed && im.missed.length)
      ? '<div class="mc-tile mb-3" style="border-color:var(--danger-fg);">' +
          '<div class="mc-note">To catch up</div>' +
          '<div style="font-size:.9rem;font-weight:600;color:var(--text-main);">' +
            esc(im.missed.map(function (d) { return d.label; }).join(', ')) +
          '</div></div>'
      : '';

    body(
      '<div class="row g-2 mb-3">' +
        tile('Age', im.ageText) +
        tile('Date of birth', im.dobText) +
        tile('Had so far', im.hadSoFar + ' of ' + im.dueSoFar) +
        tile('Not given', String(im.missed.length),
             im.missed.length ? 'mc-late' : 'mc-ok') +
      '</div>' +
      nextHtml + missedHtml +
      '<div class="mc-note mb-3">Doses whose date has passed are taken as ' +
        'given. That is what a child of this age will ordinarily have had. ' +
        'Mark one <strong>not given</strong> only when the mother has told you ' +
        'it was missed — that is what puts it on the catch-up list.</div>' +

      im.doses.map(function (d) {
        var sub;
        if (d.state === 'GIVEN') {
          sub = 'given ' + esc(d.givenOnText) + (d.givenBy ? ' · ' + esc(d.givenBy) : '');
        } else if (d.state === 'PRESUMED') {
          sub = 'due ' + esc(d.dueText) + ' · taken as given';
        } else if (d.state === 'MISSED') {
          sub = 'missed' + (d.missedNote ? ' · ' + esc(d.missedNote) : '');
        } else {
          sub = 'due ' + esc(d.dueText) + (d.at ? ' · ' + esc(d.at) : '');
        }

        // What each row offers to do, and nothing more than that.
        //   had it       -> say it was missed
        //   missed/due   -> record that it has now been given
        var actions = '';
        if (d.state === 'PRESUMED' || d.state === 'GIVEN') {
          if (!d.offSchedule) {
            actions = '<button class="btn btn-sm btn-outline-danger py-0 px-2" ' +
              'style="font-size:.7rem;" onclick="CrescMC.markNotGiven(\'' +
              esc(d.code) + '\',\'' + esc(d.label) + '\')">Not given</button>';
          }
        } else if (d.state !== 'UPCOMING') {
          actions = '<button class="btn btn-sm btn-outline-primary py-0 px-2" ' +
            'style="font-size:.7rem;" onclick="CrescMC.giveDose(\'' +
            esc(d.code) + '\',\'' + esc(d.label) + '\')">Record</button>';
        }

        return '<div class="mc-row">' +
          '<div><div style="font-size:.84rem; font-weight:600; color:var(--text-main);">' +
            esc(d.label) + (d.offSchedule ? ' <span class="mc-note">(not in the schedule)</span>' : '') +
            '</div><div class="mc-note">' + sub + '</div></div>' +
          '<div class="d-flex align-items-center gap-2">' +
            '<span class="mc-pill ' + pill[d.state] + '">' + word[d.state] + '</span>' +
            actions +
          '</div></div>';
      }).join('')
    );
  }

  // ------------------------------------------------------------------
  // WRITES
  // ------------------------------------------------------------------

  return {
    /**
     * @param {string} patientId
     * @param {string} patientName
     * @param {string} mode  'anc' | 'imm'
     */
    open: function (patientId, patientName, mode) {
      S.pid = String(patientId || '').trim().toUpperCase();
      S.name = String(patientName || '');
      S.mode = (mode === 'imm') ? 'imm' : 'anc';
      S.anc = null; S.imm = null;
      if (!S.pid) { say('Open a patient first.', false); return; }

      el('mc-title').textContent = (S.mode === 'imm')
        ? 'Immunisation card' : 'Antenatal card';
      el('mc-who').textContent = S.name ? (S.name + ' · ' + S.pid) : S.pid;
      el('cresc-mc').classList.add('on');
      if (S.mode === 'imm') loadImm(); else loadAnc();
    },

    close: function () { el('cresc-mc').classList.remove('on'); },

    loadAnc: loadAnc,
    loadImm: loadImm,

    openAnc: function () {
      if (S.busy) return;
      if (!val('mc-a-lmp') && !val('mc-a-edd')) {
        return say('Give the last menstrual period, or an EDD from a scan.', false);
      }
      call('mcOpenAntenatal', [{
        patientId: S.pid,
        lmp: val('mc-a-lmp'), edd: val('mc-a-edd'),
        gravida: val('mc-a-g'), para: val('mc-a-p'),
        living: val('mc-a-l'), abortions: val('mc-a-ab'),
        heightCm: val('mc-a-ht'), bookingWeightKg: val('mc-a-wt'),
        bloodGroup: val('mc-a-bg'), riskNotes: val('mc-a-risk')
      }, window.sessionToken], function (res) {
        say((res && res.message) || 'Could not open the record.', !!(res && res.success));
        if (res && res.success) loadAnc();
      });
    },

    saveVisit: function () {
      if (S.busy) return;
      // Nothing recorded at all is a visit row that says the patient came and
      // nothing was measured, which is worse than no row.
      var any = ['mc-v-wt', 'mc-v-sys', 'mc-v-dia', 'mc-v-hb', 'mc-v-fh',
                 'mc-v-fhr', 'mc-v-cc', 'mc-v-adv'].some(function (id) { return val(id); });
      if (!any) return say('Record at least one measurement or note for this visit.', false);

      call('mcRecordAntenatalVisit', [{
        patientId: S.pid,
        ancId: S.anc ? S.anc.ancId : '',
        visitDate: val('mc-v-date') || today(),
        weightKg: val('mc-v-wt'),
        sysBp: val('mc-v-sys'), diaBp: val('mc-v-dia'),
        haemoglobin: val('mc-v-hb'),
        urineAlbumin: val('mc-v-alb'), urineSugar: val('mc-v-sug'),
        fundalHeightCm: val('mc-v-fh'), fetalHeartRate: val('mc-v-fhr'),
        presentation: val('mc-v-pres'), fetalMovements: val('mc-v-mov'),
        oedema: val('mc-v-oed'),
        complaints: val('mc-v-cc'), advice: val('mc-v-adv'),
        nextVisitDate: val('mc-v-next')
      }, window.sessionToken], function (res) {
        say((res && res.message) || 'Could not save the visit.', !!(res && res.success));
        if (res && res.success) loadAnc();
      });
    },

    closeAnc: function () {
      if (!S.anc) return;
      var ask = (typeof window.crescPrompt === 'function')
        ? window.crescPrompt(
            'How did the pregnancy end?\n\nType one of: LIVE_BIRTH, STILLBIRTH, ' +
            'ABORTION, REFERRED_OUT, LOST_TO_FOLLOW_UP',
            'LIVE_BIRTH', { title: 'Close the antenatal record', okLabel: 'Close it' })
        : Promise.resolve('LIVE_BIRTH');
      ask.then(function (outcome) {
        if (!outcome) return;
        call('mcCloseAntenatal', [{
          ancId: S.anc.ancId, outcome: outcome, outcomeDate: today()
        }, window.sessionToken], function (res) {
          say((res && res.message) || 'Could not close the record.', !!(res && res.success));
          if (res && res.success) loadAnc();
        });
      });
    },

    /**
     * Records a dose as given, today.
     *
     * IT NO LONGER ASKS FOR A BATCH NUMBER. That prompt stood between a nurse
     * and the one action this card is for, on every single dose, to collect a
     * field nothing in the application reads back — batch tracking is stock
     * control and it belongs in the pharmacy, where batches already are.
     */
    giveDose: function (code, label) {
      if (S.busy) return;
      call('mcRecordImmunisation', [{
        patientId: S.pid, vaccineCode: code, doseLabel: label,
        givenOn: today()
      }, window.sessionToken], function (res) {
        say((res && res.message) || 'Could not record the dose.', !!(res && res.success));
        if (res && res.success) loadImm();
      });
    },

    /**
     * Records that the mother says a dose was missed.
     *
     * The reason is required by the server, so this asks for it rather than
     * sending a blank and reporting a refusal.
     */
    markNotGiven: function (code, label) {
      if (S.busy) return;
      if (typeof window.crescPrompt !== 'function') {
        say('This screen needs the shared dialog, which has not loaded.', false);
        return;
      }
      window.crescPrompt(
        'What did the mother say about ' + label + '?\n\n' +
        'For example: not given, child was unwell; given elsewhere, no card; refused.',
        '', { title: label + ' — not given', okLabel: 'Mark not given' }
      ).then(function (reason) {
        if (!reason) return;
        call('mcMarkDoseNotGiven', [{
          patientId: S.pid, vaccineCode: code, doseLabel: label, reason: reason
        }, window.sessionToken], function (res) {
          say((res && res.message) || 'Could not record that.', !!(res && res.success));
          if (res && res.success) loadImm();
        });
      });
    }
  };
})();
</script>
