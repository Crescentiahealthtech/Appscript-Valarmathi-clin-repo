<div id="emr-workspace-records" class="d-none mt-4 app-view h-100 flex-column px-2">

<style>
  /* ---------------------------------------------------------------------
     This screen carried Bootstrap's fixed dark utilities on top of surfaces
     and tables Styles.html already resolves to tokens, so the markup claimed
     a palette it was not actually getting. Those are gone.

     What remains is the part no global rule can supply: the type scale. The
     stream cards size themselves in `em`, so with no base here 1.05em meant
     "larger than the browser default" and the whole card stack ran a size
     above the consult and the case sheet. One base font-size rescales them
     together, and 1.05em goes back to meaning "slightly larger than the app".
     ------------------------------------------------------------------ */
  #emr-workspace-records                { font-size: 0.85rem; }
  #emr-workspace-records h4             { font-size: 1.05rem; }
  #emr-workspace-records h5             { font-size: 0.95rem; }
  #emr-workspace-records .emr-rec-panel { background-color: var(--bg-card);
                                          border: 1px solid var(--border-color);
                                          border-radius: 10px; }
  #emr-workspace-records .emr-rec-scroll { background-color: var(--bg-card);
                                          border: 1px solid var(--border-color);
                                          border-radius: 10px; }
  #emr-workspace-records .emr-rec-divider     { border-bottom: 1px solid var(--border-color) !important; }
  #emr-workspace-records .emr-rec-divider-end { border-right: 1px solid var(--border-color) !important; }
</style>
    
    <!-- ========================================================= -->

        <!-- HARDCODED STICKY HEADER WITH BUTTONS -->

            <div class="card-body d-flex justify-content-between align-items-center py-2">
                <div>
                    <h5 class="m-0 fw-bold" id="tl-pat-name">Loading...</h5>

                </div>
                <div class="d-flex align-items-center gap-2">
                    
                    <!-- THE PERMANENT NEW OPD BUTTON -->

                        <i class="fa-solid fa-stethoscope me-1"></i> New OPD
                    </button>
                               
                    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 ms-2" onclick="closeTimelineView()">

</div>

<script>
  // =========================================================================
  // 1. STATE MANAGEMENT & INITIALIZATION
  // =========================================================================
  var masterLedgerData = [];
  var currentActivePatientId = "";
  /** The last patient the timeline loaded, as the server sent it. */
  var currentPatientRecord = null;
  var currentPatientEvents = []; 

  /* The directory used to be fetched from a DOMContentLoaded listener. This
     module is downloaded on demand now, so that event has long since fired
     by the time this runs and the listener would never have been called —
     the ledger would have sat on its spinner for ever.

     openEMRWorkspace('records') calls loadMasterLedger() instead, which is
     how every other EMR workspace already starts, and it refreshes the
     directory each time Patient Records is opened rather than once per page
     load. */

  function loadMasterLedger() {
    document.getElementById('emr-timeline-ledger-tbody').innerHTML = '<tr><td colspan="5" class="text-center py-4" style="color: var(--text-main) !important; font-weight: bold;"><div class="spinner-border text-light mb-2"></div><br>Synchronizing Database...</td></tr>';
    google.script.run
      .withSuccessHandler(renderMasterLedger)
      .withFailureHandler(err => {
         mtLedgerProblem(window.crescWhyFailed
           ? window.crescWhyFailed(err, 'Reading the patient directory')
           : ((err && err.message) || 'The directory could not be read.'));
      })
      .getMasterPatientDirectory(window.sessionToken);
  }

  /** One place the ledger says it has nothing and why. */
  function mtLedgerProblem(msg) {
    const tbody = document.getElementById('emr-timeline-ledger-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4" ' +
      'style="color: var(--danger-fg) !important; font-weight: bold;"></td></tr>';
    tbody.querySelector('td').textContent = msg;
  }

  /**
   * The directory now arrives wrapped, so a refusal is an answer rather than
   * an exception thrown past this handler and reported as a transport fault.
   * `data` is still the JSON string it always was. See crescUnwrap in
   * Shell_UX.html.
   */
  function renderMasterLedger(res) {
    const r = window.crescUnwrap ? window.crescUnwrap(res, '[]')
                                 : { ok: true, data: res, message: '' };
    if (!r.ok) { mtLedgerProblem(r.message); return; }
    try {
      masterLedgerData = JSON.parse(r.data || '[]');
    } catch (e) {
      mtLedgerProblem('The directory came back in a form this screen could not read.');
      return;
    }
    filterMasterLedger();
  }

  function filterMasterLedger() {
    const query = (document.getElementById('master-search-input').value || "").toLowerCase();
    const tbody = document.getElementById('emr-timeline-ledger-tbody');
    let html = '';
    let sno = 1;

    masterLedgerData.forEach(pt => {
      if (pt.id.toLowerCase().includes(query) || pt.name.toLowerCase().includes(query) || pt.mobile.includes(query)) {
        html += `
          <tr style="border-bottom: 1px solid var(--border-hover);">
            <td style="color: var(--text-main) !important; font-weight: bold;" class="sno-col">${sno++}</td>
            <td style="color: var(--text-main) !important; font-weight: bold;">${pt.id}</td>
            <td style="color: var(--text-main) !important; font-weight: 600;">${pt.name}</td>
            <td style="color: var(--text-main) !important; font-weight: 500;">${pt.age} / ${pt.sex}</td>
            <td class="text-end pe-4">
              <button class="btn btn-sm rounded-pill px-3 fw-bold shadow-sm" style="background-color: var(--success-solid); color: var(--text-on-accent); border: none;" onclick="openPatientTimeline('${pt.id}')">
                View Records
              </button>
            </td>
          </tr>`;
      }
    });
    tbody.innerHTML = html || '<tr><td colspan="5" class="text-center py-4" style="color: var(--text-main) !important; font-weight: bold;">No files matched query.</td></tr>';
  }

  // =========================================================================
  // 3. TIMELINE CONTROLLER
  // =========================================================================
  function openPatientTimeline(patientId) {
    currentActivePatientId = patientId; 
    document.getElementById('timeline-ledger-section').classList.add('d-none');
    document.getElementById('timeline-stream-section').classList.remove('d-none');
    document.getElementById('clinical-stream-container').innerHTML = '<div class="text-center mt-5" style="color: var(--text-main) !important; font-weight: 500;"><div class="spinner-border mb-2 text-light"></div><br>Compiling clinical history stream...</div>';
    
    google.script.run
      .withSuccessHandler(renderTimeline)
      .withFailureHandler(err => {
        mtStreamProblem(window.crescWhyFailed
          ? window.crescWhyFailed(err, 'Compiling the history')
          : ((err && err.message) || 'The history could not be compiled.'));
      })
      .buildLongitudinalTimeline(patientId, window.sessionToken);
  }

  function closeTimelineView() {
    currentActivePatientId = "";
    currentPatientEvents = [];
    document.getElementById('timeline-stream-section').classList.add('d-none');
    document.getElementById('timeline-ledger-section').classList.remove('d-none');
  }

  // =========================================================================
  // 4. DATA FORMATTERS (Clean White/Gray Monotone with Restored Icons)
  // =========================================================================
  /**
   * Clinical free text goes into these cards through template literals, so it
   * has to be escaped.
   *
   * This is not only an injection concern. "SpO2 <90% on air" is a perfectly
   * ordinary diagnosis, and unescaped it opens a tag the browser never closes
   * — the rest of that card, and sometimes the rest of the timeline, simply
   * vanishes from the page with no error anywhere.
   */
  function mtEsc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  window.mtEsc = mtEsc;

  function safeJSONParse(str, fallback) {
    try { return JSON.parse(str); } catch(e) { return fallback; }
  }

  function formatVitals(vitalsStr) {
    const v = safeJSONParse(vitalsStr, {});
    let parts = [];
    
    // Icons restored and separated from the text span to guarantee visibility
    if(v.bp) parts.push(`<i class="fa-solid fa-droplet text-muted me-1"></i><span style="color:var(--text-muted);">BP:</span> <strong style="color:var(--text-main) !important;">${v.bp}</strong>`);
    if(v.hr) parts.push(`<i class="fa-solid fa-heart-pulse text-muted me-1"></i><span style="color:var(--text-muted);">HR:</span> <strong style="color:var(--text-main) !important;">${v.hr} bpm</strong>`);
    if(v.spo2) parts.push(`<i class="fa-solid fa-wind text-muted me-1"></i><span style="color:var(--text-muted);">SpO2:</span> <strong style="color:var(--text-main) !important;">${v.spo2}%</strong>`);
    if(v.temp) parts.push(`<i class="fa-solid fa-temperature-half text-muted me-1"></i><span style="color:var(--text-muted);">Temp:</span> <strong style="color:var(--text-main) !important;">${v.temp}°F</strong>`);
    if(v.weight) parts.push(`<i class="fa-solid fa-weight-scale text-muted me-1"></i><span style="color:var(--text-muted);">Wt:</span> <strong style="color:var(--text-main) !important;">${v.weight}kg</strong>`);
    if(v.bmi) parts.push(`<i class="fa-solid fa-calculator text-muted me-1"></i><span style="color:var(--text-muted);">BMI:</span> <strong style="color:var(--text-main) !important;">${v.bmi}</strong>`);
    
    return parts.length > 0 ? parts.join(' <span style="color:var(--text-faint); margin: 0 8px;">|</span> ') : '<span style="color:var(--text-muted) !important; font-style:italic;">No vitals recorded.</span>';
  }

  function formatExams(examStr, isSystemic = false) {
    const exams = safeJSONParse(examStr, {});
    let abnormalParts = [];
    
    const normalTerms = [
      "nad", "normal", "no", "nil", "clear", "unremarkable",
      "s1s2+", "no murmur", "murmur",
      "b/l nvbs", "no added sounds", "wheeze",
      "soft", "non-tender", "non tender", "no organomegaly", 
      "conscious", "oriented", "nfnd"
    ];

    for (const [key, value] of Object.entries(exams)) {
      if (!value) continue;
      const parts = value.toLowerCase().split(',').map(s => s.trim());
      const isNormal = parts.every(p => normalTerms.includes(p) || p === "");

      if (!isNormal) {
        // Change "Yes" to "Present" for professional clinical charting
        let displayValue = value === "Yes" ? "Present" : value;
        abnormalParts.push(`<span style="color: var(--text-main) !important; font-weight: 500;">${key}: ${displayValue}</span>`);
      }
    }
    
    if (abnormalParts.length > 0) return abnormalParts.join('<span style="color: var(--text-muted); margin: 0 6px;">|</span>');
    return isSystemic ? '<span style="color:var(--text-main) !important; font-weight: 500;">Systemic Examination : Normal</span>' : '<span style="color:var(--text-muted) !important; font-style:italic;">Normal</span>';
  }

  function formatRx(rxStr) {
    const rxList = safeJSONParse(rxStr, []);
    if(!Array.isArray(rxList) || rxList.length === 0) return '<span style="color:var(--text-muted) !important; font-style:italic;">No medications prescribed.</span>';
    
    let html = '<ul style="margin-bottom:0; padding-left:1.2rem; color:var(--text-main) !important; font-size:1em; font-weight: 500;">';
    rxList.forEach(rx => {
      let drugName = (rx.drugName || '').trim();
      let sig = (rx.sig || '').trim();
      let days = (rx.duration || '').trim();
      // An IV order's rate is half the instruction; without it the history
      // shows a volume that was apparently infused at no particular speed.
      const isIV = String(rx.type || rx.strength || '').toUpperCase() === 'IV';
      if (isIV && (rx.rate || '').trim()) sig = `${sig} @ ${String(rx.rate).trim()}`.trim();
      let durationText = days ? ` X ${days} DAYS` : '';
      let sigText = sig ? `${sig}${durationText}` : (days ? `${durationText}` : '');
      html += `<li style="margin-bottom:6px;"><strong style="color:var(--text-main) !important; font-size: 1.05em;">${drugName}</strong> <span style="color:var(--text-secondary);">${sigText}</span></li>`;
    });
    return html + '</ul>';
  }

  function formatLabs(labsStr) {
    if (!labsStr || labsStr === "None" || labsStr === "[]") return "None";
    const labs = safeJSONParse(labsStr, null);
    if (!Array.isArray(labs)) return `<span style="color:var(--text-main) !important; font-weight: 500;">${labsStr}</span>`;
    
    let formatted = labs.map(lab => (lab.type === "Result" && lab.result) ? `${lab.testName} (${lab.result})` : lab.testName).filter(Boolean);
    return formatted.length === 0 ? "None" : `<span style="color:var(--text-main) !important; font-weight: 500;">${formatted.join(', ')}</span>`;
  }

 // =========================================================================
// 5. MODULAR CARD BUILDERS (Clean Monochrome Icons)
// =========================================================================
function buildOPCard(ev) {
  return `
    <div class="timeline-node">
      <div class="timeline-badge badge-op" style="background-color: var(--success); border-color: var(--border-color);"></div>
      <div class="timeline-card" style="background-color: var(--surface-2); border: 1px solid var(--border-hover) !important;">
        
        <div class="d-flex justify-content-between align-items-center mb-2 emr-rec-divider pb-2" style="cursor: pointer; user-select: none;" onclick="toggleTimelineCard('body-${ev.apptId}', 'chev-${ev.apptId}')">
          <div>
            <strong style="color: var(--success-fg); font-size: 1.15em;"><i class="fa-solid fa-stethoscope me-1"></i> OPD Consult</strong>
            <span style="border: 1px solid var(--border-hover); color: var(--text-main) !important; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 10px; background-color: var(--bg-main);">${ev.apptId}</span>
          </div>
          <div class="d-flex align-items-center gap-3">
            <\!-- Nothing on this timeline was printable on its own. The whole
                 file could be printed, and a prescription could be printed
                 from the consult while it was open, but "the paper from my
                 visit in March" had no route. See mtPrintOPEncounter. -->
            <button class="btn btn-sm btn-outline-light py-0 px-3 rounded-pill fw-bold"
                    title="Print this consultation on its own"
                    onclick="event.stopPropagation(); mtPrintOPD('${ev.apptId}', this)">
               <i class="fa-solid fa-print me-1"></i> Print
            </button>
            <button class="btn btn-sm btn-outline-light py-0 px-3 rounded-pill fw-bold" onclick="event.stopPropagation(); triggerEditOPD('${ev.apptId}')">
               <i class="fa-solid fa-pen-to-square me-1"></i> Edit
            </button>
            <span style="color: var(--text-main) !important; font-size: 0.9em;"><i class="fa-regular fa-clock me-1 text-muted"></i>${ev.date}</span>
            <i id="chev-${ev.apptId}" class="fa-solid fa-chevron-down text-muted ms-2" style="transition: transform 0.2s;"></i>
          </div>
        </div>

        <div id="body-${ev.apptId}" style="display: none;">
            <div style="background-color: var(--surface); border: 1px solid var(--border-hover); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; font-size: 0.95em;">
              ${formatVitals(ev.vitals)}
            </div>

            <div class="row g-3">
              <div class="col-md-7 emr-rec-divider-end">
                <div class="mb-3">
                  <span style="color: var(--accent-fg); font-size: 0.85em; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px;"><i class="fa-solid fa-clipboard-list me-1 text-muted"></i> Complaints</span>
                  <p style="color: var(--text-main) !important; font-size: 1.05em; margin-bottom: 2px; font-weight: 500;">${mtEsc(ev.complaints)}</p>
                </div>
                <div class="mb-3">
                  <span style="color: var(--accent-fg); font-size: 0.85em; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px;"><i class="fa-solid fa-clock-rotate-left me-1" style="color: var(--accent-fg);"></i> History</span>
                  <p style="color: var(--text-main) !important; font-size: 1.05em; margin-bottom: 2px; font-weight: 500;">${mtEsc(ev.history)}</p>
                </div>
                <div class="mb-3">
                  <span style="color: var(--accent-fg); font-size: 0.85em; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px;"><i class="fa-solid fa-microscope me-1" style="color: var(--accent-fg);"></i> Examinations</span>
                  <div style="color: var(--text-main) !important; font-size: 0.95em;">Gen: ${formatExams(ev.genExam, false)}</div>
                  <div style="color: var(--text-main) !important; font-size: 0.95em; margin-top: 4px;">Sys: ${formatExams(ev.sysExam, true)}</div>
                </div>

                <div style="background-color: var(--surface); border: 1px solid var(--border-hover); border-radius: 6px; padding: 10px; margin-top: 14px;">
                  <span style="color: var(--danger-fg); font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;"><i class="fa-solid fa-triangle-exclamation me-1" style="color: var(--danger-fg);"></i> Diagnosis</span>
                  <p style="color: var(--text-main) !important; font-weight: bold; font-size: 1.1em; margin-bottom: 0;">${mtEsc(ev.diagnosis)}</p>
                </div>
              </div>

              <div class="col-md-5 ps-md-3">
                <div class="mb-3">
                  <span style="color: var(--accent-fg); font-size: 0.85em; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 0.5px;"><i class="fa-solid fa-prescription me-1" style="color: var(--accent-fg);"></i> Rx</span>
                  ${formatRx(ev.rx)}
                </div>
                
                <div style="background-color: var(--surface); border: 1px solid var(--border-hover); border-radius: 6px; padding: 10px; margin-bottom: 10px;">
                  <span style="color: var(--accent-fg); font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;"><i class="fa-solid fa-flask-vial me-1" style="color: var(--accent-fg);"></i> Labs & Advice</span>
                  <p style="color: var(--text-main) !important; font-size: 0.95em; margin-bottom: 4px;"><strong style="color: var(--accent-fg);">Labs:</strong> ${formatLabs(ev.labs)}</p>
                  <p style="color: var(--text-main) !important; font-size: 0.95em; margin-bottom: 0;"><strong style="color: var(--accent-fg);">Advice:</strong> ${mtEsc(ev.advice)}</p>
                </div>

                <div class="text-end mt-3">
                  <span style="border: 1px solid var(--border-hover); background-color: var(--surface-2); color: var(--text-main) !important; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; display: inline-block;">
                    <i class="fa-solid fa-calendar-check me-1 text-muted"></i> Review: ${mtEsc(ev.followUp)}
                  </span>
                </div>
              </div>
            </div>
        </div>
        
      </div>
    </div>`;
}

function toggleTimelineCard(bodyId, chevronId) {
    const bodyEl = document.getElementById(bodyId);
    const chevEl = document.getElementById(chevronId);
    if (!bodyEl || !chevEl) return;

    if (bodyEl.style.display === 'none') {
        bodyEl.style.display = 'block';
        chevEl.classList.remove('fa-chevron-down');
        chevEl.classList.add('fa-chevron-up');
    } else {
        bodyEl.style.display = 'none';
        chevEl.classList.remove('fa-chevron-up');
        chevEl.classList.add('fa-chevron-down');
    }
}

/**
 * The discharge-summary strip inside an admission card.
 *
 * Three states, all of them worth seeing: signed (with the signer, their
 * registration number and the short hash that identifies the exact signed
 * version), in progress (so the ward knows it is owed), and none started.
 */
function buildIPDischargeBlock(ev) {
  if (!ev.summaryId) {
    return `
      <div class="p-3 mt-2" style="background-color: var(--surface); border: 1px dashed var(--border-hover); border-radius: 6px;">
        <span class="text-muted" style="font-size:.9em;">
          <i class="fa-regular fa-file me-1"></i> No discharge summary has been started for this stay.
        </span>
      </div>`;
  }

  const signed = !!ev.summarySigned;
  const edge  = signed ? 'var(--success)' : 'var(--warning)';
  const fg    = signed ? 'var(--success-fg)' : 'var(--warning-fg)';
  const icon  = signed ? 'fa-file-circle-check' : 'fa-file-pen';
  const label = signed ? 'Discharge summary &mdash; signed'
                       : `Discharge summary &mdash; ${(ev.summaryStatus || '').replace(/_/g, ' ').toLowerCase()}`;

  // The safe id for this stay's expandable body.
  const key = String(ev.ipNumber || '').replace(/[^\w-]/g, '');

  return `
    <div class="p-3 mt-2" style="background-color: var(--surface); border-left: 3px solid ${edge}; border: 1px solid var(--border-hover); border-left-width: 3px; border-radius: 6px;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <strong style="color:${fg}; font-size:.95em;"><i class="fa-solid ${icon} me-1"></i> ${label}</strong>
        <div class="d-flex gap-2">
          <\!-- THE WHOLE SUMMARY, not its final diagnosis alone. This card used
               to carry six fields from the header — id, status, signer, hash,
               date, diagnosis — and none of the course, the medications, the
               advice or the follow-up, all of which exist signed and hashed
               one sheet away. Fetched on demand rather than folded into the
               timeline payload, so a patient with six admissions does not
               carry six complete summaries on every timeline open. -->
          <button class="btn btn-sm btn-outline-info py-0 px-2" style="font-size:.8em;"
                  id="ds-read-${key}"
                  onclick="mtReadSummary('${ev.ipNumber}', '${key}', this)">
            <i class="fa-solid fa-chevron-down me-1"></i> Read in full
          </button>
          ${signed ? `<button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:.8em;"
                  title="Print the signed discharge summary"
                  onclick="mtPrintSummary('${ev.summaryId}', this)">
            <i class="fa-solid fa-print me-1"></i> Print
          </button>` : ''}
          <button class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size:.8em;"
                  onclick="openDischargeSummaryFromTimeline('${ev.ipNumber}')">
            <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Open
          </button>
        </div>
      </div>
      ${signed ? `<div class="mt-2" style="color: var(--text-main); font-size:.88em;">
          Signed ${ev.signedAt || ''}${ev.signedBy ? ' by ' + ev.signedBy : ''}${ev.signerRegNo ? ' (Reg: ' + ev.signerRegNo + ')' : ''}
          ${ev.shortHash ? `<span class="text-muted ms-2" style="font-family:monospace;">${ev.shortHash}</span>` : ''}
        </div>` : ''}
      <div id="ds-full-${key}" class="mt-3" style="display:none;"></div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   READING AND PRINTING ONE EPISODE

   Every OPD and IPD event on this timeline is now individually printable,
   and an admission's discharge summary can be read here in full rather than
   only in the discharge desk.
   ══════════════════════════════════════════════════════════════════════════ */

/** Cache per stay, so collapsing and re-expanding is free. */
var MT_SUMMARY_CACHE = {};

function mtReadSummary(ipNumber, key, btn) {
  const host = document.getElementById('ds-full-' + key);
  if (!host) return;

  // Already open: collapse.
  if (host.style.display !== 'none') {
    host.style.display = 'none';
    btn.innerHTML = '<i class="fa-solid fa-chevron-down me-1"></i> Read in full';
    return;
  }

  const paint = function (res) {
    if (!res || !res.success) {
      host.innerHTML = `<div class="text-muted" style="font-size:.88em;">${
        (res && res.message) || 'The summary could not be read.'}</div>`;
      return;
    }
    const warn = res.signed ? '' :
      `<div class="mb-2 p-2" style="border:1px solid var(--warning); color:var(--warning-fg); border-radius:4px; font-size:.82em;">
         <i class="fa-solid fa-triangle-exclamation me-1"></i>${mtEsc(res.message)}</div>`;
    host.innerHTML = warn + (res.sections || []).map(sec => `
      <div class="mb-3">
        <div style="color: var(--accent-fg); font-size:.78em; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px;">${mtEsc(sec.title)}</div>
        <div style="color: var(--text-main); font-size:.92em; white-space:pre-wrap;">${mtEsc(sec.text) || '—'}</div>
      </div>`).join('') ||
      `<div class="text-muted" style="font-size:.88em;">Every section was empty.</div>`;
  };

  host.style.display = 'block';
  btn.innerHTML = '<i class="fa-solid fa-chevron-up me-1"></i> Collapse';

  if (MT_SUMMARY_CACHE[ipNumber]) { paint(MT_SUMMARY_CACHE[ipNumber]); return; }

  host.innerHTML = `<div class="text-muted" style="font-size:.88em;"><i class="fa-solid fa-circle-notch fa-spin me-1"></i>Reading the signed summary…</div>`;
  google.script.run
    .withSuccessHandler(function (res) {
      // A cached failure would be wrong: a permission that has since been
      // granted, or a summary signed since, should be picked up on retry.
      if (res && res.success) MT_SUMMARY_CACHE[ipNumber] = res;
      paint(res);
    })
    .withFailureHandler(function (e) {
      paint({ success: false, message: 'Could not reach the server: ' + e.message });
    })
    .getDischargeSummaryFull(ipNumber, window.sessionToken);
}

/** Opens a built document in its own window and prints it. */
function mtOpenPrint(html) {
  const w = window.open('', '_blank', 'width=900,height=1100');
  if (!w) {
    if (typeof crescAlert === 'function') crescAlert('Pop-up blocked. Allow pop-ups, then retry.', 'warn');
    return;
  }
  w.document.open(); w.document.write(html); w.document.close(); w.focus();
  setTimeout(function () { try { w.print(); } catch (e) {} }, 500);
}

/** Building the document is a round trip, so the button says so. */
function mtPrintBusy(btn, on, label) {
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="spinner-border spinner-border-sm me-1" style="width:.6rem;height:.6rem;border-width:.1em;"></span>Building…'
    : '<i class="fa-solid fa-print me-1"></i> ' + label;
}

function mtPrintOPD(encounterId, btn) {
  mtPrintBusy(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      mtPrintBusy(btn, false, 'Print');
      if (!res || !res.success) {
        if (typeof crescAlert === 'function')
          crescAlert((res && res.message) || 'That consultation could not be printed.', 'err');
        return;
      }
      mtOpenPrint(res.html);
    })
    .withFailureHandler(function (e) {
      mtPrintBusy(btn, false, 'Print');
      if (typeof crescAlert === 'function') crescAlert('Print failed: ' + e.message, 'err');
    })
    .mtPrintOPEncounter(encounterId, window.sessionToken);
}

function mtPrintSummary(summaryId, btn) {
  if (!summaryId) return;
  mtPrintBusy(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      mtPrintBusy(btn, false, 'Print');
      if (!res || !res.success) {
        if (typeof crescAlert === 'function')
          crescAlert((res && res.message) || 'The summary could not be printed.', 'err');
        return;
      }
      // ds_getPrintHtml renders from the SIGNED snapshot, so what prints is
      // what was signed — never the working row.
      mtOpenPrint((res.data || {}).html || '');
    })
    .withFailureHandler(function (e) {
      mtPrintBusy(btn, false, 'Print');
      if (typeof crescAlert === 'function') crescAlert('Print failed: ' + e.message, 'err');
    })
    .ds_getPrintHtml(window.sessionToken, summaryId, '', 'FINAL');
}

/** Opens the discharge desk on this admission's summary. */
function openDischargeSummaryFromTimeline(ipNumber) {
  if (typeof dsOpenForAdmission === 'function') { dsOpenForAdmission(ipNumber, ''); return; }
  // The discharge desk is a lazy bundle; ask for it, then retry once it is in.
  if (window.CrescModules) {
    window.CrescModules.onReady('emr-discharge', function () {
      if (typeof dsOpenForAdmission === 'function') dsOpenForAdmission(ipNumber, '');
    });
  }
}

function buildIPCard(ev) {
  return `
    <div class="timeline-node">
      <div class="timeline-badge badge-ip" style="background-color: var(--accent-purple); border-color: var(--border-color);"></div>
      <div class="timeline-card border-primary" style="background-color: var(--surface-2); border: 1px solid var(--accent-purple) !important;">
        
        <div class="d-flex justify-content-between align-items-center mb-2 emr-rec-divider pb-2" style="cursor: pointer; user-select: none;" onclick="toggleTimelineCard('body-ip-${ev.ipNumber}', 'chev-ip-${ev.ipNumber}')">
          <div>
            <strong style="color: var(--accent-fg); font-size: 1.15em;"><i class="fa-solid fa-bed-pulse me-1"></i> IP Admission</strong>
            <span style="border: 1px solid var(--accent-purple); color: var(--text-main) !important; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 10px; background-color: var(--bg-main);">${ev.ipNumber}</span>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span style="color: var(--text-main) !important; font-size: 0.9em;"><i class="fa-regular fa-clock me-1 text-muted"></i>${ev.date}</span>
            <i id="chev-ip-${ev.ipNumber}" class="fa-solid fa-chevron-down text-muted ms-2" style="transition: transform 0.2s;"></i>
          </div>
        </div>

        <div id="body-ip-${ev.ipNumber}" style="display: none;">
          <div class="p-3 mt-2" style="background-color: var(--surface); border: 1px solid var(--border-hover); border-radius: 6px;">
             <p style="color: var(--text-main) !important; font-size: 0.95em; margin-bottom: 6px;"><span style="color: var(--accent-fg); font-weight: bold; width: 110px; display:inline-block;">Ward:</span> ${mtEsc(ev.ward)}</p>
             <p style="color: var(--text-main) !important; font-size: 0.95em; margin-bottom: 6px;"><span style="color: var(--accent-fg); font-weight: bold; width: 110px; display:inline-block;">Stay:</span> ${ev.admitted || ev.date}${ev.discharged ? ' &rarr; ' + ev.discharged : ' &rarr; still admitted'}</p>
             ${ev.consultant ? `<p style="color: var(--text-main) !important; font-size: 0.95em; margin-bottom: 6px;"><span style="color: var(--accent-fg); font-weight: bold; width: 110px; display:inline-block;">Consultant:</span> ${mtEsc(ev.consultant)}</p>` : ''}
             <p style="color: var(--text-main) !important; font-size: 1.05em; margin-bottom: 0; font-weight: bold;"><span style="color: var(--danger-fg); font-weight: bold; width: 110px; display:inline-block;">Diagnosis:</span> ${mtEsc(ev.diagnosis)}</p>
          </div>

          <\!-- The discharge summary for this stay. Until now the timeline read
               a sheet nothing writes, so no inpatient episode appeared here at
               all; a signed summary is the document that closes the stay and
               belongs on the patient's record beside the consultations. -->
          ${buildIPDischargeBlock(ev)}
        </div>
        
      </div>
    </div>`;
}
  // =========================================================================
  // 6. MASTER RENDERER
  // =========================================================================
  /** One place the stream says it has nothing and why. */
  function mtStreamProblem(msg) {
    const c = document.getElementById('clinical-stream-container');
    if (!c) return;
    c.innerHTML = '<div class="text-center mt-5" ' +
      'style="color: var(--danger-fg) !important; font-weight: bold;"></div>';
    c.querySelector('div').textContent = msg;
  }

  /**
   * The timeline now arrives wrapped in { success, data, message }; `data`
   * is the same { found, patient, events } object as before. A refused call
   * used to be thrown past this handler and shown as "Fetch Engine Blocked",
   * which named no cause and offered nothing. See crescUnwrap in
   * Shell_UX.html.
   */
  function renderTimeline(reply) {
    const r = window.crescUnwrap ? window.crescUnwrap(reply, null)
                                 : { ok: true, data: reply, message: '' };
    if (!r.ok) { mtStreamProblem(r.message); return; }
    const res = r.data;
    if (!res || !res.found) {
      document.getElementById('clinical-stream-container').innerHTML = `<div class="text-center mt-4" style="color:var(--text-main); font-weight:bold;">Demographic files absent.</div>`;
      return;
    }

    currentPatientEvents = res.events || [];

    // The patient AS DATA, kept for the handoff into the OP consultation.
    // executeEMRRoute() used to reconstruct age and sex by scraping the
    // banner's rendered text — see the note there for what that cost.
    currentPatientRecord = res.patient || null;

    document.getElementById('tl-pat-name').innerText = res.patient.name || "Unknown Patient";
    // Escaped. These four are typed into the Patients sheet by staff and
    // land in innerHTML: an ampersand in an address or an angle bracket in a
    // note field would break the banner's markup, and worse is possible.
    // crescEsc lives in the shell (Auth.html) and is always parsed first.
    const tlEsc = (v) => (window.crescEsc ? window.crescEsc(v)
      : String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
    document.getElementById('tl-pat-details').innerHTML =
      `<span style="color:var(--text-main) !important;">ID: ${tlEsc(res.patient.id || '--')}` +
      ` &nbsp;|&nbsp; Age: ${tlEsc(res.patient.age || '--')}` +
      ` &nbsp;|&nbsp; Sex: ${tlEsc(res.patient.sex || '--')}` +
      ` &nbsp;|&nbsp; Mobile: ${tlEsc(res.patient.mobile || '--')}</span>`;

    const container = document.getElementById('clinical-stream-container');
    
    if (currentPatientEvents.length === 0) {
      container.innerHTML = `<div class="text-center mt-4 p-4" style="color:var(--text-muted) !important; font-style:italic; border: 1px dashed var(--border-hover); border-radius: 8px;">No historical clinical events found for this patient.</div>`;
      return;
    }

    container.innerHTML = currentPatientEvents.map(ev => {
      if (ev.type === 'OP') return buildOPCard(ev);
      if (ev.type === 'IP') return buildIPCard(ev);
      return ''; 
    }).join('');
  }

  // =========================================================================
  // 7. ACTION TRIGGERS & FORM AUTO-FILL ENGINE
  // =========================================================================

  function clearEMRForm() {
    const inputsToClear = ['op-vit-sys', 'op-vit-dia', 'op-vit-pr', 'op-vit-spo2', 'op-vit-wt', 'op-vit-ht', 'op-vit-temp', 'clin-diagnosis', 'op-future-labs', 'clin-review-date'];
    inputsToClear.forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    
    document.getElementById('op-vit-bmi') && (document.getElementById('op-vit-bmi').innerText = '--');
    
    const ccTbody = document.getElementById('op-cc-tbody'); if(ccTbody) ccTbody.innerHTML = '';
    const hxTbody = document.getElementById('op-hx-tbody'); if(hxTbody) hxTbody.innerHTML = '';
    const rxTbody = document.getElementById('op-rx-tbody'); if(rxTbody) rxTbody.innerHTML = '';
    const labTbody = document.getElementById('op-lab-results-tbody'); if(labTbody) labTbody.innerHTML = '';
    
    document.querySelectorAll('.op-ge-chk').forEach(chk => chk.checked = false);
    if(typeof markOPAllWNL === 'function') markOPAllWNL();
    
    document.querySelectorAll('.op-lab-chk').forEach(chk => chk.checked = false);
    document.getElementById('op-lab-other') && (document.getElementById('op-lab-other').value = '');
    document.querySelectorAll('#advice-dropdown input[type="checkbox"]').forEach(chk => chk.checked = false);
    if(typeof updateDropdownText === 'function') updateDropdownText('advice-dropdown', 'btn-advice', 'Select Advice...');
    const labsContainer = document.getElementById('op-active-labs-container'); if(labsContainer) labsContainer.innerHTML = '';
  }

  function populateDynamicTable(tbodyId, type, rawString) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    if (!rawString || rawString === "Not recorded" || rawString === "None") {
        if(typeof addOPDynamicRow === 'function') addOPDynamicRow(tbodyId, type);
        return;
    }
    
    const parts = rawString.split('|').map(s => s.trim()).filter(Boolean);
    parts.forEach(part => {
        if(typeof addOPDynamicRow === 'function') addOPDynamicRow(tbodyId, type);
        const lastRow = tbody.lastElementChild;
        if (!lastRow) return;
        
        let textInput = lastRow.querySelector('.op-array-text');
        let durInput = lastRow.querySelector('.op-array-dur');
        let prefixSelect = lastRow.querySelector('.op-array-prefix');

        let match = part.match(/^(K\/C\/O|H\/o|S\/p)?\s*(.*?)(?:\s*\((.*?)\))?$/i);
        if (match) {
            if (prefixSelect && match[1]) prefixSelect.value = match[1];
            if (textInput) textInput.value = match[2] || part;
            if (durInput) durInput.value = match[3] || "";
        } else {
            if (textInput) textInput.value = part;
        }
    });
  }

  function populateRxTable(rxString) {
    const rxTbody = document.getElementById('op-rx-tbody');
    if(!rxTbody) return;
    
    const rxList = safeJSONParse(rxString, []);
    if(rxList.length === 0) {
        if(typeof addOPRxRow === 'function') addOPRxRow(); 
        return;
    }

    rxList.forEach(rx => {
        if(typeof addOPRxRow === 'function') addOPRxRow();
        const lastRow = rxTbody.lastElementChild;
        if (!lastRow) return;
        
        const typeSelect = lastRow.querySelector('.op-rx-type');
        if (typeSelect && rx.strength) {
            Array.from(typeSelect.options).forEach(opt => {
                if(opt.value.toLowerCase() === rx.strength.toLowerCase()) typeSelect.value = opt.value;
            });
        }
        
        const nameInput = lastRow.querySelector('.op-rx-name');
        if (nameInput) nameInput.value = rx.drugName || '';
        
        const sigInput = lastRow.querySelector('.op-rx-sig');
        if (sigInput) sigInput.value = rx.sig || '';
        
        const durInput = lastRow.querySelector('.op-rx-days');
        if (durInput) durInput.value = rx.duration || '';
        
        const commentInput = lastRow.querySelector('.op-rx-comment');
        if (commentInput) commentInput.value = rx.comments || '';
    });
  }

  function executeEMRRoute(apptId) {
      if (typeof openEMRWorkspace === 'function') openEMRWorkspace('op-consult');
      
      window.currentPatientId = currentActivePatientId;
      activeOpEncounterId = apptId === "NEW-CONSULT" ? "" : apptId;

      // ────────────────────────────────────────────────────────────────
      // THE PATIENT'S AGE, FROM THE RECORD — NOT FROM THE SCREEN.
      //
      // This used to read the banner back out of the DOM and pull the two
      // fields apart on a literal '&':
      //
      //     patDemo.split('Age:')[1].split('&')[0]
      //
      // The banner is built with `&nbsp;` separators in innerHTML, and by
      // the time innerText reads it back those entities have BECOME SPACES.
      // There is no '&' left to split on, so split('&')[0] returned the
      // whole remainder of the line and `age` came out as
      //
      //     "25   |   Sex: Male   |   Mobile: 8838723513"
      //
      // which was then written into #hd-pat-demo. The dose calculator picks
      // the age out of that element with /(\d+)\s*Y/ — and the last number
      // before the " Y" this code appends is the MOBILE NUMBER. So opening
      // the calculator on a patient reached through the timeline offered a
      // paediatric dose for a ten-digit-year-old, and the paediatric
      // suggestion in offerPaediatricDose() was suppressed for the same
      // reason.
      //
      // Nothing needs to be parsed: renderTimeline() already has the
      // patient as an object. The DOM read is kept only as a fallback for
      // the case where this runs before any timeline load.
      // ────────────────────────────────────────────────────────────────
      const rec = currentPatientRecord || {};
      const patName = rec.name || document.getElementById('tl-pat-name').innerText;
      const age = String(rec.age === 0 || rec.age ? rec.age : '--').trim() || '--';
      const sex = String(rec.sex || '--').trim() || '--';

      const hdName = document.getElementById('hd-pat-name'); if (hdName) hdName.innerText = patName;
      const hdId = document.getElementById('hd-pat-id'); if (hdId) hdId.innerText = currentActivePatientId;
      const hdDemo = document.getElementById('hd-pat-demo'); if (hdDemo) hdDemo.innerText = `${age} Y | ${sex}`;

      // Downstream screens read these for WhatsApp / email dispatch, and the
      // handoff never set them — so a consultation opened from the timeline
      // carried the PREVIOUS patient's mobile number into the dispatch box.
      window.currentPatientMobile = rec.mobile || '';
      window.currentPatientEmail  = rec.email || '';
  }

  function triggerNewOPD() {
      executeEMRRoute("NEW-CONSULT");
      clearEMRForm();

      const latestOP = currentPatientEvents.find(e => e.type === 'OP');
      setTimeout(() => {
          if (latestOP) {
              populateDynamicTable('op-hx-tbody', 'HX', latestOP.history);
              populateRxTable(latestOP.rx);
              populateDynamicTable('op-cc-tbody', 'CC', ""); 
          } else {
              populateDynamicTable('op-hx-tbody', 'HX', "");
              populateDynamicTable('op-cc-tbody', 'CC', "");
              if(typeof addOPRxRow === 'function') addOPRxRow();
          }
      }, 100);
  }

  function triggerEditOPD(apptId) {
      const ev = currentPatientEvents.find(e => e.apptId === apptId);
      if (!ev) return;

      executeEMRRoute(apptId);
      clearEMRForm();
      
      setTimeout(() => {
          const v = safeJSONParse(ev.vitals, {});
          let bpParts = (v.bp || "/").split("/");
          if(document.getElementById('op-vit-sys')) document.getElementById('op-vit-sys').value = bpParts[0] || '';
          if(document.getElementById('op-vit-dia')) document.getElementById('op-vit-dia').value = bpParts[1] || '';
          if(document.getElementById('op-vit-pr')) document.getElementById('op-vit-pr').value = v.hr || '';
          if(document.getElementById('op-vit-spo2')) document.getElementById('op-vit-spo2').value = v.spo2 || '';
          if(document.getElementById('op-vit-temp')) document.getElementById('op-vit-temp').value = v.temp || '';
          if(document.getElementById('op-vit-wt')) document.getElementById('op-vit-wt').value = v.weight || '';
          if(typeof calcOPBMI === 'function') calcOPBMI(); 
          
          populateDynamicTable('op-cc-tbody', 'CC', ev.complaints);
          populateDynamicTable('op-hx-tbody', 'HX', ev.history);
          populateRxTable(ev.rx);

          const ge = safeJSONParse(ev.genExam, {});
          for (const [key, val] of Object.entries(ge)) {
              if(val === "Yes") {
                  const chk = document.querySelector(`.op-ge-chk[value="${key}"]`);
                  if (chk) chk.checked = true;
              }
          }

          const sysExams = safeJSONParse(ev.sysExam, {});
          ['cvs', 'rs', 'pa', 'cns'].forEach(sys => {
              const txtArea = document.getElementById(`op-se-${sys}-text`);
              if (txtArea && sysExams[sys.toUpperCase()]) {
                  if (typeof setOPSysExam === 'function') {
                      txtArea.value = sysExams[sys.toUpperCase()];
                      if(txtArea.value !== opSysDefaults[sys]) setOPSysExam(sys, 'abn');
                  }
              }
          });

          const labsList = safeJSONParse(ev.labs, []);
          labsList.forEach(lab => {
              if (lab.type === "Order") {
                  const chk = document.querySelector(`.op-lab-chk[value="${lab.testName}"]`);
                  if (chk) chk.checked = true;
                  else {
                      const otherInput = document.getElementById('op-lab-other');
                      if (otherInput) otherInput.value = lab.testName;
                  }
              } else if (lab.type === "Result") {
                  if(typeof addOPLabResultRow === 'function') addOPLabResultRow();
                  const lastRow = document.getElementById('op-lab-results-tbody').lastElementChild;
                  if(lastRow) {
                      lastRow.querySelector('.op-lab-res-name').value = lab.testName;
                      lastRow.querySelector('.op-lab-res-val').value = lab.result;
                  }
              }
          });
          if(typeof compileOPLabs === 'function') compileOPLabs();

          if(document.getElementById('clin-diagnosis')) document.getElementById('clin-diagnosis').value = ev.diagnosis || "";
          
          document.querySelectorAll('#advice-dropdown input[type="checkbox"]').forEach(chk => {
              chk.checked = ev.advice.includes(chk.value);
          });
          if(typeof updateDropdownText === 'function') updateDropdownText('advice-dropdown', 'btn-advice', 'Select Advice...');
          
          let futureMatch = ev.advice.match(/Future Labs:\s*(.*)/);
          if (document.getElementById('op-future-labs')) document.getElementById('op-future-labs').value = futureMatch ? futureMatch[1] : "";
          
          if(document.getElementById('clin-review-date') && ev.followUp && ev.followUp !== "None") {
              try {
                  // The stored follow-up is whatever the consult wrote -
                  // "13-Sep-2026" as often as an ISO date. crescParseDate
                  // reads both; new Date() read only one of them, so the
                  // review-date box came up empty on a real follow-up.
                  var iso = (typeof window.crescDateInputValue === 'function')
                    ? window.crescDateInputValue(ev.followUp) : '';
                  if (!iso) { var d = new Date(ev.followUp); if (!isNaN(d)) iso = d.toISOString().split('T')[0]; }
                  if (iso) document.getElementById('clin-review-date').value = iso;
              } catch(e) {}
          }
      }, 100);
  }

</script>
