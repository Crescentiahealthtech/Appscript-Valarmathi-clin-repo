<style>
 /* ========================================= */
 /* 1. PREMIUM THEME VARIABLES                */
 /* ========================================= */

 /* Single source of truth for every colour in the application.            */
 /* Components must consume these tokens - never raw hex values - so that  */
 /* a theme switch is a pure variable swap with no per-module overrides.   */

 :root {
   color-scheme: dark;

   /* --- Surfaces (ascending elevation) --- */
   --bg-main:        #020617;
   --bg-sidebar:     #09090b;
   --bg-card:        #0f172a;
   --bg-input:       #1e293b;
   --bg-elevated:    #131c31;   /* modals / popovers stacked above a card */
   --surface:        #111418;   /* full-bleed workspace canvas            */
   --surface-2:      #181c22;   /* headers & rails inside a workspace     */
   --surface-3:      #1e293b;   /* raised rows / chips inside a workspace  */
   --surface-hover:  rgba(255,255,255,0.06);
   --surface-active: rgba(255,255,255,0.10);

   /* --- Text --- */
   --text-main:      #f8fafc;
   --text-main-rgb:  248, 250, 252;   /* Bootstrap needs the channels too */
   --text-secondary: #cbd5e1;
   --text-label:     #cbd5e1;
   --text-muted:     #94a3b8;
   --text-faint:     #8291a8;
   --text-on-accent: #ffffff;   /* text sitting on a saturated fill       */

   /* --- Lines --- */
   --border-color:   #1e293b;
   --border-hover:   #334155;
   --border-strong:  #475569;
   --border-soft:    rgba(255,255,255,0.06);
   --border-mid:     rgba(255,255,255,0.10);
   --divider-color:  #1e293b;

   /* --- Accent --- */
   --accent-purple:  #6164ef;
   --accent:         #6164ef;
   --accent-hover:   #818cf8;
   --accent-fg:      #a5b4fc;   /* accent text on a dim surface           */
   --accent-glow:    rgba(99, 102, 241, 0.25);

   /* --- Semantic triage -------------------------------------------------
      *      = saturated fill (badges, bars, dots)
      *-bg   = translucent tint behind *-fg text
      *-fg   = the ONLY value safe for text; flips light-tint <-> deep-shade
      ------------------------------------------------------------------ */
   --success:        #10b981;  --success-bg: rgba(16, 185, 129, 0.15);  --success-fg: #34d399;
   --warning:        #f59e0b;  --warning-bg: rgba(245, 158, 11, 0.15);  --warning-fg: #fbbf24;
   --danger:         #ef4444;  --danger-bg:  rgba(239, 68, 68, 0.15);   --danger-fg:  #f87171;
   --info:           #0ea5e9;  --info-bg:    rgba(14, 165, 233, 0.15);  --info-fg:    #38bdf8;
   --blue:           #3b82f6;  --blue-bg:    rgba(59, 130, 246, 0.15);  --blue-fg:    #60a5fa;
   --teal:           #14b8a6;  --teal-bg:    rgba(20, 184, 166, 0.15);  --teal-fg:    #2dd4bf;
   --violet:         #a855f7;  --violet-bg:  rgba(168, 85, 247, 0.15);  --violet-fg:  #c084fc;

   /* *-solid = the same hue darkened just enough that WHITE text on it meets
      AA. Use these only for filled controls that carry white text; the plain
      tokens above stay untouched so dots, bars and borders keep their hue. */
   --success-solid:  #0a8058;
   --info-solid:     #0978aa;
   --warning-deep:   #92400e;
   --violet-deep:    #4c1d95;
   --success-deep:   #065f46;
   --danger-solid:   #dc2626;
   --warning-solid:  #b0620a;
   --violet-solid:   #9333ea;
   --pink:           #ec4899;  --pink-bg:    rgba(236, 72, 153, 0.15);  --pink-fg:    #f472b6;

   /* --- Elevation --- */
   /* Shadow hue as raw channels so components keep their own alpha values
      while the colour still follows the theme: rgba(var(--shadow-rgb), .4) */
   --shadow-rgb:     0, 0, 0;
   --shadow-sm:      0 1px 3px rgba(0,0,0,0.40);
   --shadow:         0 4px 20px rgba(0,0,0,0.30);
   --shadow-lg:      0 8px 30px rgba(0,0,0,0.45);
   --overlay-scrim:  rgba(0,0,0,0.80);

   /* --- Scrollbars --- */
   --scrollbar-thumb: #334155;
   --scrollbar-track: transparent;

   /* --- Data visualisation (Chart.js reads these via cssVar) --- */
   --chart-grid: #1e293b;
   --chart-tick: #94a3b8;
   /* Categorical series colours, assigned in this fixed order and never
      cycled. Re-stepped and validated against this surface (#0f172a): every
      hue sits inside the dark lightness band, holds >= 3:1 against the card,
      and the closest adjacent pair separates by dE 11 under protanopia. The
      previous sky/amber/emerald steps were too light for this surface and the
      indigo/sky pair sat dE 12 apart even in full colour. */
   --chart-1: #6366f1;  --chart-2: #047857;  --chart-3: #d97706;
   --chart-4: #0369a1;  --chart-5: #a855f7;  --chart-6: #ef4444;
 }

 body.light-theme,
 html.light-theme {
   color-scheme: light;

   --bg-main:        #f8fafc;
   --bg-sidebar:     #ffffff;
   --bg-card:        #ffffff;
   --bg-input:       #f1f5f9;
   --bg-elevated:    #ffffff;
   --surface:        #f8fafc;
   --surface-2:      #ffffff;
   --surface-3:      #f1f5f9;
   --surface-hover:  rgba(15,23,42,0.04);
   --surface-active: rgba(15,23,42,0.08);

   --text-main:      #0f172a;
   --text-main-rgb:  15, 23, 42;
   --text-secondary: #334155;
   --text-label:     #475569;
   --text-muted:     #5f6d82;
   --text-faint:     #667488;
   --text-on-accent: #ffffff;

   --border-color:   #e2e8f0;
   --border-hover:   #cbd5e1;
   --border-strong:  #94a3b8;
   --border-soft:    rgba(15,23,42,0.08);
   --border-mid:     rgba(15,23,42,0.12);
   --divider-color:  #e2e8f0;

   --accent-purple:  #4f46e5;
   --accent:         #4f46e5;
   --accent-hover:   #4338ca;
   --accent-fg:      #4338ca;
   --accent-glow:    rgba(79, 70, 229, 0.15);

   /* Saturated fills stay; only the *-fg text values darken so they keep  */
   /* a >=4.5:1 ratio against white instead of washing out.               */
   --success:        #059669;  --success-bg: rgba(16, 185, 129, 0.12);  --success-fg: #047857;
   --warning:        #d97706;  --warning-bg: rgba(245, 158, 11, 0.14);  --warning-fg: #b45309;
   --danger:         #dc2626;  --danger-bg:  rgba(239, 68, 68, 0.12);   --danger-fg:  #b91c1c;
   --info:           #0284c7;  --info-bg:    rgba(14, 165, 233, 0.12);  --info-fg:    #0369a1;
   --blue:           #2563eb;  --blue-bg:    rgba(59, 130, 246, 0.12);  --blue-fg:    #1d4ed8;
   --teal:           #0d9488;  --teal-bg:    rgba(20, 184, 166, 0.12);  --teal-fg:    #0f766e;
   --violet:         #9333ea;  --violet-bg:  rgba(168, 85, 247, 0.12);  --violet-fg:  #7e22ce;
   --success-solid:  #047857;
   --info-solid:     #0369a1;
   --warning-deep:   #9a3412;
   --violet-deep:    #5b21b6;
   --success-deep:   #065f46;
   --danger-solid:   #b91c1c;
   --warning-solid:  #b45309;
   --violet-solid:   #7e22ce;
   --pink:           #db2777;  --pink-bg:    rgba(236, 72, 153, 0.12);  --pink-fg:    #be185d;

   --shadow-rgb:     15, 23, 42;
   --shadow-sm:      0 1px 3px rgba(15,23,42,0.08);
   --shadow:         0 4px 20px rgba(15,23,42,0.10);
   --shadow-lg:      0 8px 30px rgba(15,23,42,0.14);
   --overlay-scrim:  rgba(15,23,42,0.45);

   --scrollbar-thumb: #cbd5e1;
   --scrollbar-track: transparent;

   --chart-grid: #e2e8f0;
   --chart-tick: #64748b;
   /* The same six hues, re-stepped for a white surface. Dark mode is chosen,
      not flipped: these are their own steps, validated against #ffffff. */
   --chart-1: #6366f1;  --chart-2: #059669;  --chart-3: #b45309;
   --chart-4: #0284c7;  --chart-5: #7e22ce;  --chart-6: #dc2626;
 }

 /* ----------------------------------------------------------------------
    Bootstrap's own text tokens, bound to ours.

    Bootstrap 5.3 sets --bs-body-color: #212529 on :root and then re-asserts
    it on .card, .list-group-item, .modal-content, .accordion and friends.
    Nothing here ever overrode it, so every one of those containers reset its
    text to near-black — and any child without an explicit colour class
    inherited near-black ON A NEAR-BLACK CARD. That is why the dashboard's
    figures (bed utilisation, inpatients, appointments, length of stay,
    turnaround, attendance) were unreadable in dark mode while their labels,
    which carry .label-bright, were fine.

    Binding the Bootstrap tokens to the theme fixes it once for every
    component in the application rather than per tile, and keeps the light
    theme exactly as it looks today.
    ---------------------------------------------------------------------- */
 :root,
 body.light-theme,
 html.light-theme {
   --bs-body-color:            var(--text-main);
   --bs-body-color-rgb:        var(--text-main-rgb);
   --bs-body-bg:               var(--bg-main);
   --bs-emphasis-color:        var(--text-main);
   --bs-secondary-color:       var(--text-label);
   --bs-tertiary-color:        var(--text-muted);
   --bs-heading-color:         var(--text-main);
   --bs-border-color:          var(--border-color);
   --bs-card-color:            var(--text-main);
   --bs-card-bg:               var(--bg-card);
   --bs-card-border-color:     var(--border-color);
   --bs-card-cap-bg:           transparent;
 }
 /* Modals, dropdowns, list groups and accordions are already pinned with
    !important rules in section 11.6 below, so they are left out here. */

 /* .text-muted is Bootstrap's, and it resolves to a fixed slate that all but
    vanishes on our dark surfaces. It is used across every module, so it is
    bound to the token rather than hunted down call site by call site. */
 .text-muted { color: var(--text-muted) !important; }

 /* ========================================= */
 /* 2. BASE STYLES & UTILITIES                */
 /* ========================================= */

 body { 
    background-color: var(--bg-main) !important; 
    color: var(--text-main) !important; 
    font-family: 'Inter', 'Segoe UI', sans-serif; 
    height: 100vh; margin: 0; overflow: hidden; 
    transition: background-color 0.3s ease, color 0.3s ease;
 }
 
 .dr-badge { position: fixed; top: 20px; right: 25px; color: var(--text-muted); font-weight: 500; z-index: 1050; background: var(--bg-card); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); backdrop-filter: blur(5px);}
 .card { background-color: var(--bg-card) !important; border: 1px solid var(--border-color) !important; border-radius: 20px; transition: 0.3s; }
 .soft-glow { box-shadow: 0 10px 30px -10px var(--accent-glow); border: 1px solid var(--accent-glow); }
 .status-chip { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; background: var(--surface-hover); backdrop-filter: blur(4px); margin-right: 8px; margin-bottom: 8px; }
 
 .text-normal { color: var(--success-fg) !important; } 
 .text-border { color: var(--warning-fg) !important; } 
 .text-abnormal { color: var(--danger-fg) !important; }
 .label-bright { color: var(--text-label) !important; } 
 .text-white-force { color: var(--text-main) !important; }
 
 .clinic-logo { height: 90px; width: 100%; object-fit: contain; margin-bottom: 15px; }
 .sidebar-logo { height: 35px; width: 35px; object-fit: contain; }

 @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
 .animate-slide { animation: slideIn 0.5s ease forwards; }

 #auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
 .auth-card { background-color: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
 #app-screen { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
 
 /* ========================================= */
 /* 3. DESKTOP SIDEBAR                        */
 /* ========================================= */
 .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: width 0.3s ease, background-color 0.3s ease; z-index: 1000; height: 100vh; flex-shrink: 0; overflow-y: auto; overflow-x: hidden; }
 .sidebar::-webkit-scrollbar { width: 4px; } .sidebar::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 4px; }
 .sidebar.collapsed { width: 85px; }
 .sidebar.collapsed .sidebar-text, .sidebar.collapsed .label-bright { display: none; }
 .sidebar.collapsed .nav-link { justify-content: center; padding: 12px 0; margin: 4px 8px; }
 .sidebar.collapsed .nav-link i { margin: 0; font-size: 1.2rem; }
 .sidebar.collapsed .profile-details { display: none; }
 .sidebar-toggle { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; transition: 0.2s; } .sidebar-toggle:hover { color: var(--text-main); }
 .nav-link { color: var(--text-muted); border-radius: 8px; padding: 12px 20px; margin: 4px 12px; font-weight: 500; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
 .nav-link.active { background-color: var(--accent-purple); color: var(--text-on-accent) !important; }
 
 .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; background-color: var(--bg-main); display: flex; flex-direction: column; transition: background-color 0.3s ease;}
 .page-section { display: none; } .active-section { display: block; animation: fadeIn 0.3s; }
 
 .theme-toggle-btn { padding: 12px 20px; margin: 4px 12px; cursor: pointer; background: transparent; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; gap: 15px; font-weight: 500; transition: 0.2s; white-space: nowrap; }
 .theme-toggle-btn:hover { border-color: var(--border-hover); color: var(--text-main); }
 .sidebar.collapsed .theme-toggle-btn { justify-content: center; padding: 12px 0; margin: 4px 8px; }
 .sidebar.collapsed .theme-toggle-btn i { margin: 0; font-size: 1.2rem; }

 /* ========================================= */
 /* 4. FORMS & INPUTS                         */
 /* ========================================= */
 .form-control, .form-select { background-color: var(--bg-input) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 8px; transition: all 0.2s ease;}
 .form-control:focus, .form-select:focus { border-color: var(--accent-purple) !important; background-color: var(--bg-input) !important; color: var(--text-main) !important; box-shadow: 0 0 0 3px var(--accent-glow) !important; }
 ::placeholder { color: var(--text-muted) !important; opacity: 1; }
 input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
 body.light-theme input[type="date"]::-webkit-calendar-picker-indicator, body.light-theme input[type="time"]::-webkit-calendar-picker-indicator { filter: none; }

 /* ========================================= */
 /* 5. PATIENT BOOKING SCROLLER & PILLS       */
 /* ========================================= */
 .date-scroller { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
 .date-scroller::-webkit-scrollbar { display: none; }
 .date-card { flex: 0 0 auto; min-width: 80px; background: var(--bg-input) !important; border: 1px solid var(--border-color) !important; border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
 .date-card:hover { border-color: var(--border-hover) !important; }
 .date-card.active { background: var(--accent-purple) !important; border-color: var(--accent-purple) !important; box-shadow: 0 4px 12px var(--accent-glow); }
 
 /* Fix Calendar Text Colors */
 .date-card span { display: block; font-size: 0.8rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; color: var(--text-muted); transition: 0.2s; }
 .date-card strong { display: block; font-size: 1.4rem; margin-top: 4px; font-weight: 700; color: var(--text-main); transition: 0.2s; }
 .date-card.active span, .date-card.active strong { color: var(--text-on-accent) !important; }

 .time-category-title { color: var(--text-label); font-size: 0.9rem; margin-top: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: 0.5px; }
 .time-slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
 .time-btn { padding: 10px; background-color: transparent !important; border: 1px solid var(--border-color) !important; color: var(--text-muted) !important; border-radius: 20px; text-align: center; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
 .time-btn:hover { border-color: var(--border-hover) !important; color: var(--text-main) !important; }
 .time-btn.selected { background-color: var(--accent-purple) !important; border-color: var(--accent-purple) !important; color: var(--text-on-accent) !important; }
 .time-btn.booked { background-color: var(--bg-card) !important; border-color: transparent !important; color: var(--text-muted) !important; cursor: not-allowed; text-decoration: line-through; opacity: 0.5; }

 /* ========================================= */
 /* 6. ADMIN LEDGER STYLES                    */
 /* ========================================= */
 .table-ledger th { background-color: var(--bg-card) !important; color: var(--text-label) !important; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color) !important; white-space: nowrap; }
 .table-ledger td { vertical-align: middle; border-bottom: 1px solid var(--border-color) !important; font-size: 0.95rem; color: var(--text-main) !important; white-space: nowrap; }
 
 .badge-token { background-color: var(--bg-input); color: var(--text-main); font-weight: bold; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; border: 1px solid var(--border-color);}
 .badge-booked { background-color: var(--info-bg) !important; color: var(--info-fg) !important; }
 .badge-arrived { background-color: var(--warning-bg) !important; color: var(--warning-fg) !important; }
 .badge-completed { background-color: var(--success-bg) !important; color: var(--success-fg) !important; }
 .badge-progress { background-color: var(--violet-bg) !important; color: var(--violet-fg) !important; }

 .select-badge { appearance: none; -webkit-appearance: none; padding: 6px 25px 6px 12px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; border: 1px solid transparent; outline: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 8px center; background-size: 12px; transition: all 0.2s ease; }

 /* ========================================= */
 /* 7. HORIZONTAL FAB LAYOUT                  */
 /* ========================================= */
 .fab-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: row; gap: 15px; z-index: 1050; }
 .fab-action { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: var(--shadow-lg); cursor: pointer; transition: transform 0.2s ease; text-decoration: none; border: none; }
  /* #25D366 is the WhatsApp brand colour and is deliberately NOT themed. */
 .fab-whatsapp { background-color: #25D366; color: var(--text-on-accent); }
 .fab-whatsapp:hover { transform: scale(1.1); color: var(--text-on-accent); }
 .fab-emergency { background-color: var(--danger); color: var(--text-on-accent); animation: pulse-red 2s infinite; }
 .fab-emergency:hover { transform: scale(1.1); color: var(--text-on-accent); }

 @keyframes pulse-red {
   0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
   70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
   100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
 }

 .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--overlay-scrim); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
 .hidden { display: none !important; }

 /* ========================================= */
 /* 8. MOBILE NAVIGATION RAIL ARCHITECTURE    */
 /* ========================================= */
 @media (max-width: 768px) {
   .dr-badge { display: none; }
  
   .sidebar { position: fixed; top: 0; left: 0; z-index: 9999; height: 100vh; transition: width 0.3s ease; box-shadow: var(--shadow-lg); width: 65px; overflow-x: hidden; }
   .sidebar:not(.mobile-open) .sidebar-text, .sidebar:not(.mobile-open) .label-bright, .sidebar:not(.mobile-open) .profile-details { display: none; }
   .sidebar:not(.mobile-open) .nav-link, .sidebar:not(.mobile-open) .theme-toggle-btn { justify-content: center; padding: 12px 0; margin: 4px 8px; }
   .sidebar:not(.mobile-open) .nav-link i, .sidebar:not(.mobile-open) .theme-toggle-btn i { margin: 0; font-size: 1.2rem; }
   .sidebar.mobile-open { width: 260px; }
  
   .main-content { padding: 15px; margin-left: 65px; padding-bottom: 100px; width: calc(100vw - 65px); }
  
   .fab-container { bottom: 20px; right: 20px; }
   .fab-action { width: 50px; height: 50px; font-size: 24px; }
 }

 /* ========================================= */
 /* 9. WORKSPACE CARD HOVER EFFECTS           */
 /* ========================================= */
 .workspace-card {
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
    border: 1px solid var(--border-color);
    background-color: var(--bg-card);
 }
 .workspace-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent-purple);
    box-shadow: 0 10px 20px var(--accent-glow);
 }

 .active-section { 
    display: block !important; 
    animation: fadeIn 0.3s; 
 }

 /* ========================================= */
 /* 10. EMR CONTINUOUS TIMELINE CSS           */
 /* ========================================= */
 .clinical-timeline {
   position: relative;
   padding-left: 2rem;
   margin-top: 1rem;
 }
 .clinical-timeline::before {
   content: '';
   position: absolute;
   left: 0.5rem;
   top: 0;
   bottom: 0;
   width: 2px;
   background-color: var(--border-hover); 
 }
 .timeline-node {
   position: relative;
   margin-bottom: 1.5rem;
 }
 .timeline-badge {
   position: absolute;
   left: -2.35rem;
   top: 0.2rem;
   width: 1.2rem;
   height: 1.2rem;
   border-radius: 50%;
   border: 3px solid var(--bg-main);
   z-index: 2;
 }
 .badge-op { background-color: var(--success); } 
 .badge-ip { background-color: var(--accent-purple); } 
  
 .timeline-card {
   background-color: var(--surface-3);
   border: 1px solid var(--border-color);
   color: var(--text-main);
   border-radius: 0.5rem;
